function toArr(v){if(!v)return[];if(Array.isArray(v))return v;if(typeof v==="object")return Object.values(v);return[];}
function globalWeekKey(){const now=new Date();const mon=new Date(now);mon.setDate(now.getDate()-(now.getDay()===0?6:now.getDay()-1));return"social_week_"+mon.getFullYear()+String(mon.getMonth()+1).padStart(2,"0")+String(mon.getDate()).padStart(2,"0");}
function globalSprintKey(){const now=new Date();const q=Math.floor(now.getMonth()/3)+1;return"social_sprint_"+now.getFullYear()+"_Q"+q;}
function prevGlobalWeekKey(){
  const now=new Date();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(now.getDay()===0?6:now.getDay()-1)-7); // go back 7 more days
  return"social_week_"+mon.getFullYear()+String(mon.getMonth()+1).padStart(2,"0")+String(mon.getDate()).padStart(2,"0");
}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return(h>>>0).toString(16);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function weekNum(sd){const toMon=d=>{const day=d.getDay()===0?6:d.getDay()-1;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);};const weeks=Math.round((toMon(new Date())-toMon(new Date(sd)))/(7*24*60*60*1000))+1;return Math.min(Math.max(weeks,1),12);}
function scoreOne(raw,h){if(raw===null||raw===undefined||raw==="")return 0;const v=h.type==="boolean"?(raw?1:0):Math.max(parseFloat(raw)||0,0);const t=Math.max(parseFloat(h.target)||1,0.001);return h.targetType==="max"?Math.min(t/Math.max(v,0.001),1):Math.min(v/t,1);}
function calcScores(habits,logs){
  const reg=(habits||[]).filter(h=>!h.isBonus);const bon=(habits||[]).filter(h=>h.isBonus);
  let tW=0,tS=0;const byCat={};
  ["health","growth","career","finance","social","fun"].forEach(id=>{
    const ch=reg.filter(h=>h.catId===id&&(parseFloat(h.weight)||0)>0);
    if(!ch.length){byCat[id]=null;return;}
    let cW=0,cS=0;ch.forEach(h=>{const w=parseFloat(h.weight)||0,s=scoreOne((logs||{})[h.id],h);cW+=w;cS+=w*s;tW+=w;tS+=w*s;});
    byCat[id]=cW>0?Math.round((cS/cW)*100):0;
  });
  const regScore=tW>0?Math.round((tS/tW)*100):0;
  let bonusScore=0;bon.forEach(h=>{bonusScore+=scoreOne((logs||{})[h.id],h)*5;});
  return{overall:Math.min(regScore+Math.round(bonusScore),100),byCat,regScore,bonusScore:Math.round(bonusScore)};
}
function sprintAvg(habits,weekLogs,upTo,paused=[]){let sum=0,count=0;for(let w=1;w<=upTo;w++){if(paused.includes(w))continue;const ll=weekLogs[w]||{};if(!habits.some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!==""))continue;sum+=calcScores(habits,ll).overall;count++;}return count?Math.round(sum/count):0;}
function catAvgs(habits,weekLogs,upTo,paused=[]){const sums={},counts={};for(let w=1;w<=upTo;w++){if(paused.includes(w))continue;const ll=weekLogs[w]||{};if(!habits.some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!==""))continue;const{byCat}=calcScores(habits,ll);Object.keys(byCat).forEach(id=>{if(byCat[id]!==null){sums[id]=(sums[id]||0)+byCat[id];counts[id]=(counts[id]||0)+1;}});}const res={};["health","growth","career","finance","social","fun"].forEach(id=>{res[id]=counts[id]?Math.round(sums[id]/counts[id]):null;});return res;}
function barColor(s){if(s>=85)return"#1D6CF6";if(s>=75)return"rgba(29,108,246,0.65)";if(s>=60)return"rgba(29,108,246,0.40)";return"rgba(29,108,246,0.18)";}
function scoreColor(s){if(s>=85)return"#16A34A";if(s>=75)return"#2D9A50";if(s>=60)return"#D97706";return"#DC2626";}
function statusLabel(s){if(s>=85)return"Excellent";if(s>=75)return"Bien";if(s>=60)return"OK";return"En retard";}
function fmtDate(iso){return new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});}
function initials(n){return(n||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();}
const AV_COLORS=["#1D6CF6","#16A34A","#D97706","#DC2626","#5856d6","#ff6b00","#a78bfa"];
function avColor(id){let n=0;for(let i=0;i<(id||"").length;i++)n=(n+id.charCodeAt(i))%AV_COLORS.length;return AV_COLORS[n];}

function dayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
async function recordPing(userId){
  try{
    const key="pings_"+dayKey();
    const existing=toArr(await sg(key));
    const already=existing.find(p=>p.userId===userId);
    if(!already){await ss(key,[...existing,{userId,ts:Date.now()}]);}
  }catch(e){}
}

function Scroll({children}){return <div style={{padding:"20px 18px 100px",maxWidth:560,margin:"0 auto"}}>{children}</div>;}
function Card({children,style:xs={}}){return <div style={{background:"#ffffff",borderRadius:18,boxShadow:"0 2px 14px rgba(0,0,0,0.07)",padding:"16px 18px",...xs}}>{children}</div>;}
function Btn({onClick,children,variant="primary",small,full,disabled,style:xs={}}){
  const styles={primary:{background:"#1D6CF6",color:"#fff",border:"none"},secondary:{background:"rgba(0,0,0,0.06)",color:"#0F0F14",border:"none"},ghost:{background:"transparent",color:"#6B7280",border:"none"},danger:{background:"rgba(255,59,48,0.12)",color:"#DC2626",border:"none"},success:{background:"rgba(48,209,88,0.12)",color:"#16A34A",border:"none"},amber:{background:"rgba(255,149,0,0.12)",color:"#D97706",border:"none"}};
  const s=styles[variant]||styles.primary;
  return <button onClick={onClick} disabled={disabled} style={{...s,borderRadius:12,fontWeight:600,cursor:disabled?"not-allowed":"pointer",fontSize:small?13:15,padding:small?"8px 14px":"12px 22px",width:full?"100%":undefined,opacity:disabled?0.5:1,...xs}}>{children}</button>;
}
function Notice({children,color}){return <div style={{background:color+"12",border:`1px solid ${color}25`,borderRadius:14,padding:"13px 16px",marginBottom:16}}><p style={{margin:0,fontSize:13,color,lineHeight:1.6,fontWeight:500}}>{children}</p></div>;}
function Avatar({name,userId,email,size=36}){
  const [err,setErr]=useState(false);
  const url=email&&!err?`https://www.gravatar.com/avatar/${hashStr(email.trim().toLowerCase())}?s=${size*2}&d=404`:null;
  if(url)return <img src={url} onError={()=>setErr(true)} style={{width:size,height:size,borderRadius:size*0.3,flexShrink:0,objectFit:"cover"}} alt={name}/>;
  return <div style={{width:size,height:size,borderRadius:size*0.3,background:avColor(userId||"x"),flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.36,fontWeight:700,color:"#fff"}}>{initials(name)}</div>;
}
function Ring({score=0,size=80,color}){
  const col=color||scoreColor(score);
  const r=(size-8)/2,circ=2*Math.PI*r,fill=(Math.min(score,100)/100)*circ;
  return <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
    <svg width={size} height={size} style={{transform:"rotate(-90deg)",display:"block"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(0,0,0,0.07)" strokeWidth={5}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={5} strokeLinecap="round" strokeDasharray={`${fill} ${circ}`} style={{transition:"stroke-dasharray 0.5s ease"}}/>
    </svg>
    <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <span style={{fontSize:size*0.2,fontWeight:800,color:"#0F0F14",letterSpacing:-1}}>{score}<span style={{fontSize:size*0.12,fontWeight:500,color:"#6B7280"}}>%</span></span>
    </div>
  </div>;
}
function Inp({label,...p}){return <div style={{display:"flex",flexDirection:"column",gap:5}}>{label&&<label style={{fontSize:11,color:"#6B7280",textTransform:"uppercase",letterSpacing:0.6,fontWeight:600}}>{label}</label>}<input {...p} style={{...ISX,...(p.style||{})}}/></div>;}
function Sel({label,options,...p}){return <div style={{display:"flex",flexDirection:"column",gap:5}}>{label&&<label style={{fontSize:11,color:"#6B7280",textTransform:"uppercase",letterSpacing:0.6,fontWeight:600}}>{label}</label>}<select {...p} style={{...ISX,...(p.style||{})}}>{options.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}</select></div>;}
function RadarChart({cats,datasets}){
  const n=cats.length;if(n<3)return null;
  const VB=300,cx=150,cy=150,R=90,LR=122;
  const angle=i=>(i/n)*2*Math.PI-Math.PI/2;
  const pt=(a,v)=>[cx+R*Math.cos(a)*v/100,cy+R*Math.sin(a)*v/100];
  const angles=cats.map((_,i)=>angle(i));
  const ds=typeof window!=="undefined"?Math.min(Math.max(window.innerWidth-120,200),280):240;
  return <svg width={ds} height={ds} viewBox="0 0 300 300">
    {[25,50,75,100].map(lv=>{const pts=angles.map(a=>pt(a,lv));return <polygon key={lv} points={pts.map(p=>p.join(",")).join(" ")} fill="none" stroke="rgba(0,0,0,0.08)" strokeWidth={lv===100?1:0.5}/>;} )}
    {angles.map((a,i)=>{const[x,y]=pt(a,100);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(0,0,0,0.08)" strokeWidth={0.5}/>;} )}
    {datasets.map((ds,di)=>{const pts=angles.map((a,i)=>pt(a,ds.values[i]||0));return <g key={di}><polygon points={pts.map(p=>p.join(",")).join(" ")} fill={ds.color+"22"} stroke={ds.color} strokeWidth={1.5}/>{pts.map(([x,y],i)=><circle key={i} cx={x} cy={y} r={4} fill={ds.color}/>)}</g>;} )}
    {angles.map((a,i)=>{const lx=cx+LR*Math.cos(angle(i)),ly=cy+LR*Math.sin(angle(i));const anchor=Math.cos(angle(i))>0.15?"start":Math.cos(angle(i))<-0.15?"end":"middle";return <text key={i} x={lx} y={ly} textAnchor={anchor} fontSize={13} fill={cats[i].color} dominantBaseline="middle" fontWeight="700">{(cats[i].radar||cats[i].name).toUpperCase()}</text>;} )}
  </svg>;
}

  const [slide,setSlide]=useState(0);
  const s=ONBOARDING[slide];const isLast=slide===ONBOARDING.length-1;
  return <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#F8F8FB 0%,#EEEEF5 100%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 24px"}}>
    <div style={{display:"flex",gap:6,marginBottom:40}}>{ONBOARDING.map((_,i)=><div key={i} style={{width:i===slide?20:6,height:6,borderRadius:3,background:i===slide?"#1D6CF6":i<slide?"rgba(0,122,255,0.4)":"#C4C4CC",transition:"all 0.3s"}}/>)}</div>
    <div style={{width:"100%",maxWidth:400,textAlign:"center"}}>
      <div style={{fontSize:60,marginBottom:24}}>{s.emoji}</div>
      <h1 style={{color:"#0F0F14",fontSize:24,fontWeight:800,margin:"0 0 14px",lineHeight:1.2,letterSpacing:-0.6}}>{s.title}</h1>
      <p style={{color:"#0F0F14",fontSize:14,lineHeight:1.7,margin:"0 0 10px"}}>{s.body}</p>
      <p style={{color:"#6B7280",fontSize:13,lineHeight:1.6,margin:"0 0 32px"}}>{s.sub}</p>
      <Btn full onClick={()=>isLast?onDone():setSlide(i=>i+1)}>{slide===0?`Salut ${name.split(" ")[0]}, ${s.cta}`:s.cta}</Btn>
      {slide>0&&<button onClick={()=>setSlide(i=>i-1)} style={{marginTop:12,background:"none",border:"none",color:"#C4C4CC",fontSize:13,cursor:"pointer"}}>← Retour</button>}
    </div>
  </div>;
}

// ── AUTH ──
function AuthView({onAuth}){
  const [mode,setMode]=useState("login");
  const [name,setName]=useState("");const [email,setEmail]=useState("");const [password,setPassword]=useState("");
  const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  async function submit(){
    if(busy)return;setErr("");
    if(mode==="register"&&!name.trim()){setErr("Merci d'entrer ton nom.");return;}
    if(!email.trim()){setErr("Merci d'entrer ton email.");return;}
    if(!password){setErr("Merci d'entrer un mot de passe.");return;}
    if(mode==="register"&&password.length<6){setErr("Mot de passe : 6 caractères minimum.");return;}
    setBusy(true);
    try{
      const em=email.trim().toLowerCase();
      if(mode==="register"){
        const idx=(await sg("userIndex"))||[];
        if(idx.find(u=>u.email===em)){setErr("Email déjà enregistré.");setBusy(false);return;}
        const user={id:uid(),name:name.trim(),email:em,passwordHash:hashStr(password),createdAt:Date.now(),isNew:true};
        await ss(`user_${user.id}`,user);await ss("userIndex",[...idx,{id:user.id,email:user.email,name:user.name}]);
        onAuth(user);
      }else{
        const idx=(await sg("userIndex"))||[];const found=idx.find(u=>u.email===em);
        if(!found){setErr("Aucun compte avec cet email.");setBusy(false);return;}
        const user=await sg(`user_${found.id}`);
        if(!user||user.passwordHash!==hashStr(password)){setErr("Mot de passe incorrect.");setBusy(false);return;}
        onAuth(user);
      }
    }catch(e){setErr("Erreur: "+e.message);}
    setBusy(false);
  }
  return <div style={{minHeight:"100vh",background:"#F0F0F5",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 20px"}}>
    <div style={{width:"100%",maxWidth:400}}>
      <div style={{textAlign:"center",marginBottom:36}}>
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" style={{margin:"0 auto 16px",display:"block",filter:"drop-shadow(0 4px 16px rgba(29,108,246,0.25))"}}><rect width="64" height="64" rx="20" fill="#0F0F14"/><polyline points="8,50 22,20 33,34 42,24 56,50" fill="none" stroke="#ffffff" strokeWidth="3.5" strokeLinejoin="round" strokeLinecap="round"/><polyline points="8,50 22,20 33,34 42,24 56,50" fill="none" stroke="rgba(29,108,246,0.5)" strokeWidth="6" strokeLinejoin="round" strokeLinecap="round" style={{filter:"blur(4px)"}}/></svg>
        <h1 style={{color:"#0F0F14",fontSize:28,fontWeight:800,margin:0,letterSpacing:-0.8}}>Momentum</h1>
        <p style={{color:"#6B7280",margin:"8px 0 0",fontSize:14,lineHeight:1.5}}>Construis la vie que tu veux,<br/>un sprint à la fois.</p>
      </div>
      <div style={{display:"flex",background:"rgba(0,0,0,0.06)",borderRadius:14,padding:4,marginBottom:24}}>
        {[["login","Se connecter"],["register","Créer un compte"]].map(([m,l])=>(
          <button key={m} onClick={()=>{setMode(m);setErr("");}} style={{flex:1,padding:"10px 0",border:"none",borderRadius:10,cursor:"pointer",background:mode===m?"#ffffff":"transparent",color:mode===m?"#0F0F14":"#9CA3AF",fontSize:14,fontWeight:600,boxShadow:mode===m?SH:"none",transition:"all 0.2s"}}>{l}</button>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {mode==="register"&&<Inp label="Nom complet" value={name} onChange={e=>setName(e.target.value)} placeholder="Ton prénom et nom"/>}
        <Inp label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="toi@exemple.com"/>
        <Inp label="Mot de passe" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••"/>
        {err&&<Notice color="#DC2626">{err}</Notice>}
        <button onClick={submit} disabled={busy} style={{background:busy?"#C4C4CC":"#1D6CF6",color:"#fff",border:"none",borderRadius:14,fontWeight:700,fontSize:15,padding:"14px",cursor:busy?"not-allowed":"pointer",letterSpacing:-0.2}}>{busy?"Patiente…":mode==="login"?"Se connecter":"Créer mon compte"}</button>
      </div>
    </div>
  </div>;
}

// ── HABIT FORM ──
function HabitForm({habit,cat,remaining,onChange,onSave,onCancel,saveLabel="Enregistrer"}){
  const set=(k,v)=>onChange(h=>({...h,[k]:v}));
  const isBool=habit.type==="boolean";
  const canSave=habit.name.trim()&&(isBool||habit.target!=="")&&(parseFloat(habit.weight)||0)>0;
  return <div style={{background:"#F0F0F5",border:"1px solid rgba(0,122,255,0.3)",borderRadius:14,padding:16,display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"grid",gridTemplateColumns:cat.subs?"1fr 1fr":"1fr",gap:10}}>
      <Inp label="Nom" value={habit.name} placeholder="ex: Séances de sport" onChange={e=>set("name",e.target.value)}/>
      {cat.subs&&<Sel label="Sous-catégorie" value={habit.subCat||cat.subs[0]} onChange={e=>set("subCat",e.target.value)} options={cat.subs.map(s=>({value:s,label:s}))}/>}
    </div>
    <Sel label="Type de métrique" value={habit.type} onChange={e=>set("type",e.target.value)} options={HABIT_TYPES.map(t=>({value:t.id,label:t.label}))}/>
    {!isBool&&<>
      <Sel label="Direction" value={habit.targetType} onChange={e=>set("targetType",e.target.value)} options={[{value:"min",label:"Au moins (minimum)"},{value:"max",label:"Au plus (maximum)"}]}/>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10}}>
        <Inp label="Objectif" type="number" value={habit.target} placeholder="ex: 4" onChange={e=>set("target",e.target.value)} onFocus={e=>e.target.select()}/>
        <Inp label="Unité" value={habit.unit} placeholder="hrs" onChange={e=>set("unit",e.target.value)}/>
      </div>
    </>}
    <div>
      <label style={{fontSize:11,color:"#6B7280",textTransform:"uppercase",letterSpacing:0.6,fontWeight:600,display:"block",marginBottom:5}}>Poids % <span style={{fontWeight:400,letterSpacing:0,textTransform:"none",color:"#C4C4CC",fontSize:10}}>(restant: {Math.max(0,remaining).toFixed(0)}%)</span></label>
      <input type="number" min={0} step={0.5} value={habit.weight} placeholder={Math.max(0,remaining).toFixed(0)} onChange={e=>set("weight",e.target.value)} onFocus={e=>e.target.select()} style={{...ISX}}/>
    </div>
    <div style={{display:"flex",gap:8}}>
      <Btn variant="ghost" small onClick={onCancel}>Annuler</Btn>
      <Btn small full disabled={!canSave} onClick={onSave}>{saveLabel}</Btn>
    </div>
  </div>;
}

// ── SPRINT SETUP ──
function SprintSetupView({user,onDone,isFirstSprint=false}){
  const [step,setStep]=useState(0);
  const [catW,setCatW]=useState({health:25,growth:20,career:20,finance:15,social:10,fun:10});
  const [habits,setHabits]=useState({});const [catIdx,setCatIdx]=useState(0);
  const [formOpen,setFormOpen]=useState(false);const [draft,setDraft]=useState(null);const [editingId,setEditingId]=useState(null);
  const [bonus,setBonus]=useState(null);const [bonusForm,setBonusForm]=useState(false);const [bonusDraft,setBonusDraft]=useState(null);
  const [saving,setSaving]=useState(false);
  const activeCats=CATS.filter(c=>(parseFloat(catW[c.id])||0)>0);
  const totalW=Object.values(catW).reduce((a,v)=>a+(parseFloat(v)||0),0);
  const weightOk=Math.abs(totalW-100)<0.6;
  const usedW=catId=>(habits[catId]||[]).filter(h=>!h.isBonus).reduce((a,h)=>a+(parseFloat(h.weight)||0),0);
  function openNew(cat,remaining){setDraft({id:uid(),catId:cat.id,subCat:cat.subs?.[0]||"",name:"",type:"numeric",targetType:"min",target:"",unit:"",weight:Math.max(0,remaining).toFixed(0)});setFormOpen(true);setEditingId(null);}
  function openTemplate(cat,t,remaining){setDraft({...t,id:uid(),catId:cat.id,subCat:t.subCat||cat.subs?.[0]||"",weight:remaining>0?Math.max(0,remaining).toFixed(0):t.weight.toString()});setFormOpen(true);setEditingId(null);}
  function openEdit(h,remaining){setDraft({...h});setFormOpen(true);setEditingId(h.id);}
  function saveForm(cat){
    if(editingId){setHabits(p=>({...p,[cat.id]:p[cat.id].map(h=>h.id===editingId?{...draft,weight:parseFloat(draft.weight)||0}:h)}));}
    else{setHabits(p=>({...p,[cat.id]:[...(p[cat.id]||[]),{...draft,id:uid()}]}));}
    setDraft(null);setFormOpen(false);setEditingId(null);
  }
  async function launch(){
    setSaving(true);
    const allH=CATS.flatMap(c=>habits[c.id]||[]);
    if(bonus)allH.push(bonus);
    const sprint={id:uid(),userId:user.id,startDate:new Date().toISOString().split("T")[0],habits:allH,catWeights:catW,pausedWeeks:[],createdAt:Date.now()};
    await ss(`sprint_${user.id}`,sprint);setSaving(false);onDone(sprint);
  }
  if(step===0)return <Scroll>
    <h2 style={{fontSize:22,fontWeight:800,color:"#0F0F14",margin:"0 0 4px",letterSpacing:-0.5}}>Configuration du sprint</h2>
    <p style={{color:"#6B7280",fontSize:13,margin:"0 0 16px"}}>Étape 1 sur 3 — répartis ton attention</p>
    <Card style={{marginBottom:16}}><p style={{color:"#0F0F14",fontSize:13,lineHeight:1.65,margin:0}}>Assigne un <strong style={{color:"#1D6CF6"}}>pourcentage</strong> à chaque catégorie. Tout doit faire <strong style={{color:"#16A34A"}}>exactement 100%</strong>.</p></Card>
    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
      {CATS.map(cat=><div key={cat.id} style={{background:"#ffffff",borderRadius:14,boxShadow:"0 2px 14px rgba(0,0,0,0.07)",padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
        <div style={{width:10,height:10,borderRadius:3,background:cat.color,flexShrink:0}}/>
        <div style={{flex:1}}><div style={{color:"#0F0F14",fontSize:14,fontWeight:600}}>{cat.name}</div></div>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <input type="number" min={0} max={100} step={1} value={catW[cat.id]??0} onChange={e=>setCatW(p=>({...p,[cat.id]:Math.min(100,Math.max(0,parseFloat(e.target.value)||0))}))} style={{...ISX,width:58,textAlign:"center",fontWeight:700,padding:"6px"}}/>
          <span style={{color:"#6B7280",fontSize:13}}>%</span>
        </div>
      </div>)}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <span style={{color:"#6B7280"}}>Total :</span>
      <span style={{fontSize:20,fontWeight:800,color:weightOk?"#16A34A":"#DC2626"}}>{totalW.toFixed(0)}%</span>
    </div>
    <Btn full disabled={!weightOk} onClick={()=>setStep(1)}>Définir les habitudes →</Btn>
  </Scroll>;
  if(step===1){
    const cat=activeCats[catIdx];if(!cat){setStep(2);return null;}
    const catH=habits[cat.id]||[];const regH=catH.filter(h=>!h.isBonus);
    const used=usedW(cat.id);const budget=parseFloat(catW[cat.id])||0;const remaining=budget-used;
    const usedNames=new Set(regH.map(h=>h.name));const tpls=(TEMPLATES[cat.id]||[]).filter(t=>!usedNames.has(t.name));
    return <Scroll>

      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:2}}><div style={{width:12,height:12,borderRadius:3,background:cat.color}}/><h2 style={{fontSize:22,fontWeight:800,color:"#0F0F14",margin:0,letterSpacing:-0.5}}>{cat.name}</h2></div>
      <p style={{color:"#6B7280",fontSize:13,margin:"4px 0 12px"}}>Étape 2 sur 3</p>
      {isFirstSprint&&<Notice color="#1D6CF6">Commencer simple, c'est commencer fort — <strong>1 habitude par catégorie</strong> recommandée pour ton premier sprint.</Notice>}
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
        <span style={{color:"#6B7280",fontSize:12}}>Utilisé : <strong style={{color:remaining<0?"#DC2626":"#0F0F14"}}>{used.toFixed(0)}%</strong></span>
        <span style={{color:remaining<0?"#DC2626":"#16A34A",fontSize:12,fontWeight:600}}>Restant : {remaining.toFixed(0)}%</span>
      </div>
      <div style={{height:6,background:"rgba(0,0,0,0.06)",borderRadius:4,marginBottom:16}}>
        <div style={{height:"100%",borderRadius:3,background:remaining<0?"#DC2626":cat.color,width:`${Math.min((used/budget)*100,100)}%`,transition:"width 0.3s"}}/>
      </div>
      {tpls.length>0&&<div style={{marginBottom:14}}>
        <p style={{color:"#6B7280",fontSize:11,textTransform:"uppercase",letterSpacing:0.6,margin:"0 0 8px",fontWeight:600}}>Ajout rapide</p>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{tpls.map(t=><button key={t.name} onClick={()=>openTemplate(cat,t,remaining)} style={{background:cat.color+"15",border:`1px solid ${cat.color}44`,color:cat.color,borderRadius:8,fontSize:12,padding:"6px 10px",cursor:"pointer",fontWeight:500}}>+ {t.name}</button>)}</div>
      </div>}
      {regH.map(h=>{
        if(editingId===h.id&&formOpen)return <div key={h.id} style={{marginBottom:8}}><HabitForm habit={draft} cat={cat} remaining={remaining+(parseFloat(h.weight)||0)} onChange={setDraft} saveLabel="Mettre à jour" onSave={()=>saveForm(cat)} onCancel={()=>{setFormOpen(false);setEditingId(null);setDraft(null);}}/></div>;
        return <div key={h.id} style={{background:"#ffffff",borderRadius:12,boxShadow:"0 2px 14px rgba(0,0,0,0.07)",padding:"11px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{color:"#0F0F14",fontSize:14,fontWeight:500}}>{h.name}</div><div style={{color:"#6B7280",fontSize:12,marginTop:2}}>{h.type}{h.target?` · ${h.targetType==="min"?"≥":"≤"} ${h.target}${h.unit?` ${h.unit}`:""}`:""} · <strong style={{color:cat.color}}>{h.weight}%</strong></div></div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>openEdit(h,remaining+(parseFloat(h.weight)||0))} style={{background:"none",border:"1px solid rgba(0,0,0,0.1)",color:"#6B7280",borderRadius:8,padding:"7px 12px",fontSize:12,cursor:"pointer"}}>Modifier</button>
            <button onClick={()=>setHabits(p=>({...p,[cat.id]:p[cat.id].filter(x=>x.id!==h.id)}))} style={{background:"none",border:"none",color:"#DC2626",cursor:"pointer",fontSize:20,padding:"0 4px"}}>×</button>
          </div>
        </div>;
      })}
      {(!formOpen||editingId)&&<button onClick={()=>openNew(cat,remaining)} style={{width:"100%",padding:12,background:"transparent",border:"1.5px dashed rgba(0,0,0,0.15)",borderRadius:12,color:"#6B7280",fontSize:14,cursor:"pointer",marginTop:4}}>+ Ajouter une habitude</button>}
      {formOpen&&!editingId&&<HabitForm habit={draft} cat={cat} remaining={remaining} onChange={setDraft} onSave={()=>saveForm(cat)} onCancel={()=>{setFormOpen(false);setDraft(null);}}/>}
      <div style={{display:"flex",gap:10,marginTop:20}}>
        <Btn variant="secondary" onClick={()=>catIdx===0?setStep(0):setCatIdx(i=>i-1)}>← Retour</Btn>
        <Btn full onClick={()=>catIdx<activeCats.length-1?setCatIdx(i=>i+1):setStep(2)}>{catIdx<activeCats.length-1?`Suivant : ${activeCats[catIdx+1].name} →`:"Révision →"}</Btn>
      </div>
    </Scroll>;
  }
  const allH=CATS.flatMap(c=>habits[c.id]||[]);
  return <Scroll>
    <h2 style={{fontSize:22,fontWeight:800,color:"#0F0F14",margin:"0 0 4px",letterSpacing:-0.5}}>Révision du sprint</h2>
    <p style={{color:"#6B7280",fontSize:13,margin:"0 0 16px"}}>Étape 3 sur 3</p>
    {CATS.filter(c=>(habits[c.id]||[]).length>0).map(cat=>{
      const reg=(habits[cat.id]||[]).filter(h=>!h.isBonus);
      return <div key={cat.id} style={{marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><div style={{width:8,height:8,borderRadius:2,background:cat.color}}/><span style={{color:cat.color,fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{cat.name}</span></div>
        {reg.map(h=><div key={h.id} style={{background:"#ffffff",borderRadius:10,boxShadow:"0 2px 14px rgba(0,0,0,0.07)",padding:"8px 12px",marginBottom:4,display:"flex",justifyContent:"space-between"}}>
          <span style={{color:"#0F0F14",fontSize:13}}>{h.name}</span><span style={{color:"#6B7280",fontSize:12}}>{h.weight}%</span>
        </div>)}
      </div>;
    })}
    <div style={{borderTop:"1px solid rgba(0,0,0,0.1)",paddingTop:14,marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
        <span style={{fontSize:14}}>⭐</span><span style={{color:"#D97706",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>Habitude bonus</span><span style={{color:"#C4C4CC",fontSize:11}}>— +5% si accomplie</span>
      </div>
      {!bonus&&!bonusForm&&<button onClick={()=>{setBonusDraft({id:uid(),catId:activeCats[0]?.id||"health",name:"",type:"boolean",targetType:"min",target:"1",unit:"",weight:5,isBonus:true});setBonusForm(true);}} style={{width:"100%",padding:12,background:"rgba(255,149,0,0.08)",border:"1.5px dashed rgba(255,149,0,0.4)",borderRadius:12,color:"#D97706",fontSize:13,cursor:"pointer",fontWeight:500}}>+ Définir une habitude bonus</button>}
      {bonusForm&&bonusDraft&&<div style={{background:"rgba(255,149,0,0.06)",border:"1px solid rgba(255,149,0,0.3)",borderRadius:14,padding:14,display:"flex",flexDirection:"column",gap:10}}>
        <Inp label="Nom" value={bonusDraft.name} placeholder="ex: Courir 10km" onChange={e=>setBonusDraft(p=>({...p,name:e.target.value}))}/>
        <div style={{display:"flex",gap:8}}>
          <Btn variant="ghost" small onClick={()=>{setBonusForm(false);setBonusDraft(null);}}>Annuler</Btn>
          <Btn small full disabled={!bonusDraft.name.trim()} onClick={()=>{setBonus({...bonusDraft,weight:5,isBonus:true});setBonusForm(false);setBonusDraft(null);}} style={{background:"#D97706",border:"none",color:"#fff"}}>Enregistrer le bonus</Btn>
        </div>
      </div>}
      {bonus&&!bonusForm&&<div style={{background:"rgba(255,149,0,0.1)",border:"1px solid rgba(255,149,0,0.3)",borderRadius:12,padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{color:"#D97706",fontSize:14,fontWeight:600}}>⭐ {bonus.name}</div></div>
        <button onClick={()=>setBonus(null)} style={{background:"none",border:"none",color:"#DC2626",cursor:"pointer",fontSize:20,padding:"0 2px"}}>×</button>
      </div>}
    </div>
    {allH.length===0&&<Notice color="#D97706">Aucune habitude ajoutée. Reviens en arrière.</Notice>}
    <div style={{display:"flex",gap:10,marginTop:16}}>
      <Btn variant="secondary" onClick={()=>{setStep(1);setCatIdx(activeCats.length-1);}}>← Modifier</Btn>
      <Btn full disabled={allH.length===0||saving} onClick={launch}>{saving?"Lancement…":"Lancer le sprint"}</Btn>
    </div>
  </Scroll>;
}

// ── HABIT ROW ──
function HabitRow({habit,value,onChange,isBonus=false}){
  const isBool=habit.type==="boolean";
  const s=scoreOne(isBool?(value?1:0):value,habit);
  const hasVal=value!==undefined&&value!==null&&value!=="";
  const col=hasVal?barColor(Math.round(s*100)):"rgba(0,0,0,0.08)";
  return <div style={{background:isBonus?"rgba(217,119,6,0.06)":"#FFFFFF",borderRadius:16,boxShadow:SH,border:"1px solid rgba(0,0,0,0.055)",padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}>
    <div style={{width:4,height:36,borderRadius:2,background:isBonus?"#D97706":col,flexShrink:0,transition:"background 0.3s"}}/>
    <div style={{flex:1}}>
      <div style={{color:isBonus?"#D97706":"#0F0F14",fontSize:14,fontWeight:500}}>{isBonus?"⭐ ":""}{habit.name}</div>
      <div style={{color:"#6B7280",fontSize:11,marginTop:2}}>
        {habit.subCat&&`${habit.subCat} · `}
        {habit.type!=="boolean"&&`${habit.targetType==="min"?"≥":"≤"} ${habit.target}${habit.unit?` ${habit.unit}`:""} · `}
        {isBonus?"+5% bonus":`${habit.weight}%`}
        {hasVal&&<span style={{marginLeft:6,color:isBonus?"#D97706":col,fontWeight:700}}>{Math.round(s*100)}%</span>}
      </div>
    </div>
    {isBool

function LogView({sprint,weekLogs,onSave,userId,onUpdateSprint}){
  const currentWk=weekNum(sprint.startDate);
  const [selWk,setSelWk]=useState(currentWk);
  const [local,setLocal]=useState(weekLogs[currentWk]||{});
  const [saved,setSaved]=useState(false);
  useEffect(()=>setLocal(weekLogs[selWk]||{}),[weekLogs,selWk]);
  const {overall,bonusScore}=calcScores(sprint.habits,local);

  if(!sprint||reconfigure)return <SprintSetupView user={user} onDone={s=>{setReconfigure(false);onSprintCreated(s);}} isFirstSprint={!sprint&&history.length===0}/>;
  const wk=weekNum(sprint.startDate);

    setSaving(true);
    const updated=sprint.habits.map(h=>h.id===editDraft.id?{...editDraft,weight:parseFloat(editDraft.weight)||0}:h);
    const sp={...sprint,habits:updated};await ss(`sprint_${user.id}`,sp);
    onHabitsUpdated(sp);setEditingId(null);setEditDraft(null);setSaving(false);
  }
  async function delHabit(id){const sp={...sprint,habits:sprint.habits.filter(h=>h.id!==id)};await ss(`sprint_${user.id}`,sp);onHabitsUpdated(sp);}

    {catGroups.map(cat=>{
      const reg=cat.habits.filter(h=>!h.isBonus);const bon=cat.habits.filter(h=>h.isBonus);

        </div>
        {[...reg,...bon].map(h=>{
          const isBonus=h.isBonus;
          if(editingId===h.id&&editDraft){
            const otherW=reg.filter(x=>x.id!==h.id).reduce((a,x)=>a+(parseFloat(x.weight)||0),0);
            return <div key={h.id} style={{marginTop:4}}><HabitForm habit={editDraft} cat={cat} remaining={(cat.weight||0)-otherW} onChange={setEditDraft} saveLabel={saving?"Patiente…":"Mettre à jour"} onSave={saveEdit} onCancel={()=>{setEditingId(null);setEditDraft(null);}}/></div>;

                {(()=>{const prevSorted=toArr(prevWkData).sort((a,b)=>b.overall-a.overall);const prevRank=prevSorted.findIndex(e=>e.userId===member.id);return prevRank>=0&&prevRank<3?<span style={{fontSize:9,fontWeight:700,color:prevRank===0?"#1D6CF6":prevRank===1?"#6B7280":"#D97706",background:prevRank===0?"rgba(0,122,255,0.1)":prevRank===1?"rgba(0,0,0,0.06)":"rgba(255,149,0,0.1)",padding:"2px 7px",borderRadius:10}}>{prevRank===0?"🥇 S-1":prevRank===1?"🥈 S-1":"🥉 S-1"}</span>:null;})()}

// ── DUELS ──
function DuelsView({user,sprint,onPendingCount}){
  const [myDuels,setMyDuels]=useState([]);const [users,setUsers]=useState([]);
  const [loading,setLoading]=useState(true);const [creating,setCreating]=useState(false);
  const [form,setForm]=useState({opponentId:"",type:"overall",catId:"health"});const [msg,setMsg]=useState(null);
  const wk=weekNum(sprint.startDate);
  const activeCats=CATS.filter(c=>sprint.habits.some(h=>h.catId===c.id&&!h.isBonus));
  async function load(){
    setLoading(true);
    const [idx,duelsData]=await Promise.all([sg("userIndex"),sg(`duels_${sprint.id}`)]);
    setUsers((idx||[]).filter(u=>u.id!==user.id));
    const all=toArr(duelsData);const mine=all.filter(d=>d.challengerId===user.id||d.opponentId===user.id);
    setMyDuels(mine);
    if(onPendingCount)onPendingCount(mine.filter(d=>d.status==="pending"&&d.opponentId===user.id).length);
    setLoading(false);
  }
  useEffect(()=>{load();},[sprint]);
  async function createDuel(){
    if(!form.opponentId)return;
    const newDuel={id:uid(),challengerId:user.id,challengerName:user.name,opponentId:form.opponentId,opponentName:users.find(u=>u.id===form.opponentId)?.name||"",type:form.type,catId:form.type==="category"?form.catId:null,week:wk,status:"pending",createdAt:Date.now()};
    const all=toArr(await sg(`duels_${sprint.id}`));await ss(`duels_${sprint.id}`,[...all,newDuel]);
    setCreating(false);setMsg("Défi envoyé ! 🔥");setTimeout(()=>setMsg(null),3000);load();
  }
  async function respond(duelId,accept){
    const all=toArr(await sg(`duels_${sprint.id}`));
    await ss(`duels_${sprint.id}`,all.map(d=>d.id===duelId?{...d,status:accept?"active":"declined"}:d));
    setMsg(accept?"Défi accepté ! C'est parti 🔥":"Défi refusé.");setTimeout(()=>setMsg(null),3000);load();
  }
  const pending=myDuels.filter(d=>d.status==="pending"&&d.opponentId===user.id);
  const active=myDuels.filter(d=>d.status==="active"&&d.week===wk);
  const past=myDuels.filter(d=>d.status==="declined"||(d.status==="active"&&d.week<wk));
  function DuelCard({duel}){
    const isChallenger=duel.challengerId===user.id;const opponent=isChallenger?duel.opponentName:duel.challengerName;
    const cat=duel.catId?CATS.find(c=>c.id===duel.catId):null;
    return <Card style={{marginBottom:8}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
        <div style={{fontSize:20}}>{duel.type==="category"?"🎯":"⚔️"}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:700,color:"#0F0F14"}}>{isChallenger?"Tu as défié":"Défi reçu de"} <span style={{color:"#1D6CF6"}}>{opponent}</span></div>
          <div style={{fontSize:11,color:"#6B7280",marginTop:2}}>{duel.type==="category"?`Catégorie : ${cat?.name||duel.catId}`:"Score global"} · Semaine {duel.week}</div>
        </div>
      </div>
      {duel.status==="active"&&<div style={{background:"rgba(0,122,255,0.07)",borderRadius:10,padding:"9px 12px"}}><span style={{fontSize:12,color:"#1D6CF6"}}>⚡ En cours — résultat à la fin de la semaine</span></div>}
      {duel.status==="pending"&&duel.opponentId===user.id&&<div style={{display:"flex",gap:8,marginTop:4}}>
        <button onClick={()=>respond(duel.id,false)} style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:"rgba(255,59,48,0.1)",color:"#DC2626",fontWeight:600,fontSize:13,cursor:"pointer"}}>Refuser</button>
        <button onClick={()=>respond(duel.id,true)} style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:"#1D6CF6",color:"#fff",fontWeight:600,fontSize:13,cursor:"pointer"}}>Accepter 🔥</button>
      </div>}
      {duel.status==="pending"&&duel.challengerId===user.id&&<div style={{background:"rgba(0,0,0,0.04)",borderRadius:10,padding:"9px 12px"}}><span style={{fontSize:12,color:"#6B7280"}}>⏳ En attente d'acceptation…</span></div>}
      {duel.status==="declined"&&<div style={{background:"rgba(255,59,48,0.07)",borderRadius:10,padding:"9px 12px"}}><span style={{fontSize:12,color:"#DC2626"}}>Défi refusé</span></div>}
    </Card>;
  }
  return <Scroll>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div><h2 style={{fontSize:22,fontWeight:800,color:"#0F0F14",margin:"0 0 3px",letterSpacing:-0.5}}>Duels</h2><p style={{color:"#6B7280",fontSize:13,margin:0}}>Défie tes amis cette semaine</p></div>
      {!creating&&<button onClick={()=>setCreating(true)} style={{background:"#1D6CF6",color:"#fff",border:"none",borderRadius:12,padding:"9px 16px",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Nouveau défi</button>}
    </div>
    {msg&&<Notice color="#16A34A">{msg}</Notice>}
    {creating&&<Card style={{marginBottom:16}}>
      <div style={{fontSize:13,fontWeight:700,color:"#0F0F14",marginBottom:14}}>Nouveau défi</div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Sel label="Adversaire" value={form.opponentId} onChange={e=>setForm(p=>({...p,opponentId:e.target.value}))} options={[{value:"",label:"Choisir…"},...users.map(u=>({value:u.id,label:u.name}))]}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[["overall","⚔️ Score global"],["category","🎯 Catégorie"]].map(([t,l])=>(
            <button key={t} onClick={()=>setForm(p=>({...p,type:t}))} style={{padding:"11px 8px",border:"none",borderRadius:12,cursor:"pointer",background:form.type===t?"#1D6CF6":"rgba(0,0,0,0.05)",color:form.type===t?"#fff":"#0F0F14",fontWeight:600,fontSize:13}}>{l}</button>
          ))}
        </div>
        {form.type==="category"&&<div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {activeCats.map(cat=><button key={cat.id} onClick={()=>setForm(p=>({...p,catId:cat.id}))} style={{padding:"7px 12px",border:"none",borderRadius:10,cursor:"pointer",background:form.catId===cat.id?cat.color:"rgba(0,0,0,0.05)",color:form.catId===cat.id?"#fff":"#0F0F14",fontWeight:600,fontSize:12}}>{cat.name}</button>)}
        </div>}
        <div style={{display:"flex",gap:8}}>
          <Btn variant="secondary" small onClick={()=>setCreating(false)}>Annuler</Btn>
          <Btn full small disabled={!form.opponentId} onClick={createDuel}>Envoyer le défi 🔥</Btn>
        </div>
      </div>
    </Card>}
    {pending.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:9,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:"#DC2626",marginBottom:8}}>🔔 {pending.length} défi{pending.length>1?"s":""} à accepter</div>{pending.map(d=><DuelCard key={d.id} duel={d}/>)}</div>}
    {active.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:9,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:"#1D6CF6",marginBottom:8}}>⚔️ En cours — semaine {wk}</div>{active.map(d=><DuelCard key={d.id} duel={d}/>)}</div>}
    {past.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:9,fontWeight:600,letterSpacing:2,textTransform:"uppercase",color:"#9CA3AF",marginBottom:8}}>Historique</div>{past.map(d=><DuelCard key={d.id} duel={d}/>)}</div>}
    {!loading&&myDuels.length===0&&!creating&&<div style={{textAlign:"center",padding:"40px 20px"}}>
      <div style={{fontSize:44,marginBottom:12}}>⚔️</div>
      <p style={{color:"#0F0F14",fontSize:16,fontWeight:700,marginBottom:6,letterSpacing:-0.3}}>Aucun défi en cours</p>
      <p style={{color:"#9CA3AF",fontSize:13,lineHeight:1.5}}>Lance le premier défi de la semaine !</p>
    </div>}
  </Scroll>;
}

function ProfileView({user,sprint,weekLogs,onLogout}){

  const wk=sprint?weekNum(sprint.startDate):0;

  const allAvgs=history.map(s=>s.avgScore).filter(Boolean);

    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>

    {history.length>0&&<Card style={{marginBottom:14}}>
      <p style={{color:"#6B7280",fontSize:11,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 12px",fontWeight:600}}>Historique des sprints</p>
      {history.map((sp,i)=>(
        <div key={sp.sprintId} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderTop:i>0?"1px solid rgba(0,0,0,0.09)":"none"}}>
          <div style={{flex:1}}><div style={{color:"#0F0F14",fontSize:13,fontWeight:500}}>Sprint {history.length-i}</div><div style={{color:"#6B7280",fontSize:11,marginTop:2}}>{fmtDate(sp.startDate)} · {sp.weeksLogged} sem.</div></div>
          <div style={{fontSize:16,fontWeight:800,color:scoreColor(sp.avgScore)}}>{sp.avgScore}%</div>
        </div>
      ))}
    </Card>}
    <Btn full variant="danger" onClick={onLogout}>Se déconnecter</Btn>
  </Scroll>;
}

// ── ADMIN ──
function AnalyticsView({users}){
  const [pings,setPings]=useState({});
  const [socialData,setSocialData]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    (async()=>{
      // Load last 14 days of pings
      const pingData={};
      const today=new Date();
      for(let i=0;i<14;i++){
        const d=new Date(today);d.setDate(today.getDate()-i);
        const key="pings_"+dayKey(d);
        const data=toArr(await sg(key));
        pingData[dayKey(d)]=data;
      }
      setPings(pingData);
      // Load sprint social data for group scores
      const sd=toArr(await sg(globalSprintKey()));
      setSocialData(sd);
      setLoading(false);
    })();
  },[]);

  // Build last 14 days array
  const days=Array.from({length:14},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-(13-i));
    const k=dayKey(d);
    const count=(pings[k]||[]).length;
    const label=d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"}).slice(0,5);
    return{key:k,label,count,isToday:i===13};
  });

  const maxPings=Math.max(...days.map(d=>d.count),1);
  const totalUsers=users.length;
  const activeThisSprint=socialData.length;
  const avgScore=socialData.length?Math.round(socialData.reduce((a,e)=>a+(e.sprintAvg||0),0)/socialData.length):0;
  const topContributor=socialData.sort((a,b)=>(b.weeksLogged||0)-(a.weeksLogged||0))[0];
  const todayPings=(pings[dayKey()]||[]).length;

  // Weekly active users (last 7 days)
  const last7=days.slice(7);
  const uniqueWeekly=new Set(last7.flatMap(d=>(pings[d.key]||[]).map(p=>p.userId))).size;

  return <div>
    <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"#D97706",marginBottom:16}}>📊 Analytics</div>

    {loading&&<div style={{textAlign:"center",padding:20,color:"#6B7280"}}>Chargement…</div>}
    {!loading&&<>
      {/* KPI grid */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {[
          {label:"Membres total",value:totalUsers,icon:"👥",color:"#1D6CF6"},
          {label:"Actifs ce sprint",value:activeThisSprint,icon:"⚡",color:"#16A34A"},
          {label:"Score moy. groupe",value:avgScore?avgScore+"%":"—",icon:"🏆",color:"#D97706"},
          {label:"Connexions auj.",value:todayPings,icon:"📱",color:"#5856d6"},
          {label:"Actifs 7 jours",value:uniqueWeekly,icon:"🔥",color:"#DC2626"},
          {label:"Meilleur contributeur",value:topContributor?topContributor.name.split(" ")[0]+" ("+topContributor.weeksLogged+"sem.)":"—",icon:"⭐",color:"#D97706"},
        ].map(({label,value,icon,color})=>(
          <div key={label} style={{background:"#FFFFFF",borderRadius:16,padding:"14px 16px",boxShadow:SH,border:"1px solid rgba(0,0,0,0.055)"}}>
            <div style={{fontSize:18,marginBottom:6}}>{icon}</div>
            <div style={{fontSize:20,fontWeight:800,color,letterSpacing:-0.5}}>{value}</div>
            <div style={{fontSize:10,color:"#6B7280",marginTop:3,lineHeight:1.3}}>{label}</div>
          </div>
        ))}
      </div>

      {/* Connections bar chart */}
      <div style={{background:"#FFFFFF",borderRadius:20,padding:"16px",boxShadow:SH,border:"1px solid rgba(0,0,0,0.055)"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#0F0F14",marginBottom:14}}>Connexions · 14 derniers jours</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:4,height:80}}>
          {days.map(({key,label,count,isToday})=>{
            const h=count>0?Math.max((count/maxPings)*68,8):3;
            return <div key={key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{position:"relative",width:"100%",display:"flex",justifyContent:"center"}}>
                {count>0&&<span style={{position:"absolute",top:-16,fontSize:8,fontWeight:700,color:isToday?"#1D6CF6":"#6B7280"}}>{count}</span>}
                <div style={{width:"100%",height:h,borderRadius:"3px 3px 0 0",background:isToday?"#1D6CF6":count>0?"rgba(0,122,255,0.45)":"rgba(0,0,0,0.08)",transition:"height 0.4s"}}/>
              </div>
              <span style={{fontSize:7,color:isToday?"#1D6CF6":"#6B7280",fontWeight:isToday?700:400,textAlign:"center",lineHeight:1.2}}>{label}</span>
            </div>;
          })}
        </div>
      </div>

      {/* Group score trend */}

// ── RECAP ──
function RecapView({user,sprint,weekLogs,onArchive}){
  const [archiving,setArchiving]=useState(false);
  const wk=weekNum(sprint.startDate);
  const weekScores=Array.from({length:12},(_,i)=>{const w=i+1;const logs=weekLogs[w]||{};const logged=sprint.habits.some(h=>logs[h.id]!==undefined&&logs[h.id]!==null&&logs[h.id]!=="");const{overall}=calcScores(sprint.habits,logs);return{w,overall:logged?overall:null,logged};});
  const lw=weekScores.filter(w=>w.logged);const avg=lw.length?Math.round(lw.reduce((a,w)=>a+w.overall,0)/lw.length):0;
  const ca=catAvgs(sprint.habits,weekLogs,wk,[]);
  async function doArchive(){
    setArchiving(true);
    const record={sprintId:sprint.id,startDate:sprint.startDate,endDate:new Date().toISOString().split("T")[0],avgScore:avg,weeksLogged:lw.length,catAvgs:ca,weekScores:weekScores.map(w=>({w:w.w,score:w.overall}))};
    const hist=toArr(await sg(`sprint_history_${user.id}`));await ss(`sprint_history_${user.id}`,[...hist,record]);
    await ss(`sprint_${user.id}`,null);setArchiving(false);onArchive();
  }
  return <Scroll>
    <div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:52,marginBottom:10}}>🏁</div><h2 style={{color:"#0F0F14",fontSize:28,fontWeight:800,margin:0,letterSpacing:-0.8}}>Sprint terminé !</h2></div>
    <Card style={{marginBottom:14,display:"flex",flexDirection:"column",alignItems:"center",gap:14,padding:"24px 20px"}}>
      <Ring score={avg} size={110}/>
      <div style={{textAlign:"center"}}><div style={{color:"#0F0F14",fontSize:18,fontWeight:800}}>{avg>=80?"Excellent sprint":avg>=60?"Bel effort":"Peut mieux faire"}</div><div style={{color:"#6B7280",fontSize:13,marginTop:4}}>{lw.length} / 12 semaines · moy. {avg}%</div></div>
    </Card>
    <Btn full disabled={archiving} onClick={doArchive}>{archiving?"Archivage…":"Archiver et démarrer un nouveau sprint →"}</Btn>
  </Scroll>;
}

          <div style={{position:"relative",display:"inline-flex",background:view===item.id?"rgba(29,108,246,0.10)":"transparent",borderRadius:10,padding:"5px 10px",transition:"background 0.2s"}}>
            <span style={{color:view===item.id?(item.id==="admin"?"#D97706":"#1D6CF6"):"#9CA3AF",transition:"color 0.2s"}}>{NAV_ICONS[item.id]}</span>
            {item.id==="duels"&&pendingDuels>0&&<div style={{position:"absolute",top:-2,right:-2,width:14,height:14,borderRadius:7,background:"#DC2626",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:8,fontWeight:800,color:"#fff"}}>{pendingDuels}</span></div>}
          </div>
          <span style={{fontSize:10,fontWeight:view===item.id?700:500,color:view===item.id?(item.id==="admin"?"#D97706":"#1D6CF6"):"#9CA3AF",transition:"color 0.2s",letterSpacing:-0.1}}>{item.label}</span>
        </button>
      ))}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
