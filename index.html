function RecapView({user,sprint,weekJournals,onArchive}){
  const [archiving,setArchiving]=useState(false);
  const wk=weekNum(sprint.startDate);
  const weekScores=useMemo(()=>{const out=[];for(let w=1;w<=12;w++){const logs=weekJournals[w]||{};const logged=sprint.habits.some(h=>logs[h.id]!==undefined&&logs[h.id]!==null&&logs[h.id]!=="");const{overall}=calcScores(sprint.habits,logs);out.push({w,overall:logged?overall:null,logged});}return out;},[sprint,weekJournals]);
  const lw=weekScores.filter(w=>w.logged);
  const avg=lw.length?Math.round(lw.reduce((a,w)=>a+w.overall,0)/lw.length):0;
  const catAvgs=catAvgsFromSemaines(sprint.habits,weekJournals,wk);
  async function doArchive(){
    setArchiving(true);
    const record={sprintId:sprint.id,startDate:sprint.startDate,endDate:new Date().toISOString().split("T")[0],habits:sprint.habits,catWeights:sprint.catWeights,weekScores:weekScores.map(w=>({w:w.w,score:w.overall})),avgScore:avg,weeksJournalged:lw.length,catAvgs};
    const hist=await sg(`sprint_history_${user.id}`)||[];
    await ss(`sprint_history_${user.id}`,[...hist,record]);
    await ss(`sprint_${user.id}`,null);setArchiving(false);onArchive();
  }
  return <Scroll>
    <div style={{textAlign:"center",marginBottom:28}}><div style={{fontSize:40,marginBottom:8}}>🏁</div><h2 style={{color:T.text,fontSize:24,fontWeight:800,margin:0}}>Sprint terminé !</h2><p style={{color:T.muted,fontSize:14,margin:"8px 0 0"}}>{fmtDate(sprint.startDate)} — {fmtDate(new Date().toISOString().split("T")[0])}</p></div>
    <div style={{background:T.card,borderRadius:22,boxShadow:shadow,padding:"24px 20px",marginBottom:16,display:"flex",flexDirection:"column",alignItems:"center",gap:16}}>
      <Ring score={avg} size={120}/>
      <div style={{textAlign:"center"}}><div style={{color:T.text,fontSize:18,fontWeight:800}}>{avg>=80?"Sprint excellent":avg>=60?"Bel effort":"Peut mieux faire"}</div><div style={{color:T.muted,fontSize:13,marginTop:4}}>{lw.length} / 12 semaines saisies · avg {avg}%</div></div>
    </div>
    <div style={{background:T.card,borderRadius:18,boxShadow:shadow,padding:"16px 18px",marginBottom:16}}>
      <p style={{color:T.muted,fontSize:11,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 14px"}}>Parcours de 12 semaines</p>
      <div style={{display:"flex",alignItems:"flex-end",gap:3,height:72}}>
        {weekScores.map(({w,overall,logged})=>(
          <div key={w} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            <div style={{width:"100%",height:logged&&overall!==null?`${(overall/100)*60+4}px`:"2px",background:logged?scoreColor(overall):T.faint,borderRadius:"3px 3px 0 0",minHeight:2}}/>
            <span style={{fontSize:7,color:T.muted}}>W{w}</span>
          </div>
        ))}
      </div>
    </div>
    <Btn full disabled={archiving} onClick={doArchive}>{archiving?"Archivage…":"Archiver et démarrer un nouveau sprint →"}</Btn>
  </Scroll>;
}

// ── MAIN APP ──
function App(){
  const [user,setUser]=useState(null);const [sprint,setSprint]=useState(null);const [weekJournals,setWL]=useState({});
  const [view,setView]=useState("home");const [booting,setBooting]=useState(true);
  const [showOnboarding,setShowOnboarding]=useState(false);const [showRecap,setShowRecap]=useState(false);
  const [history,setHistory]=useState([]);
  const [quote]=useState(WISDOM[new Date().getDay()%WISDOM.length]);
  const wk=sprint?weekNum(sprint.startDate):0;
  const userIsAdmin=user&&ADMIN_EMAILS.includes(user.email);
  const NAV=useMemo(()=>[{id:"home",label:"Accueil"},{id:"log",label:"Journal"},{id:"sprint",label:"Sprint"},{id:"social",label:"Social"},{id:"duels",label:"Duels"},{id:"profile",label:"Profil"},...(userIsAdmin?[{id:"admin",label:"Admin"}]:[])]  ,[userIsAdmin]);

  async function loadHistory(userId){const h=await sg(`sprint_history_${userId}`)||[];setHistory(h);}
  async function loadJournals(userId,sp){
    const out={};for(let w=1;w<=weekNum(sp.startDate);w++){const d=await sg(`logs_${userId}_${sp.id}_w${w}`);if(d)out[w]=d;}setWL(out);
  }

  useEffect(()=>{
    (async()=>{
      const session=await sg("session");if(!session?.userId){setBooting(false);return;}
      const u=await sg(`user_${session.userId}`);if(!u){setBooting(false);return;}
      setUser(u);
      await loadHistory(u.id);
      const sp=await sg(`sprint_${u.id}`);
      if(sp){setSprint(sp);await loadJournals(u.id,sp);}
      setBooting(false);
    })();
  },[]);

  useEffect(()=>{if(sprint&&weekNum(sprint.startDate)>=12)setShowRecap(true);},[sprint]);

  async function onAuth(u){
    await ss("session",{userId:u.id});
    if(u.isNew){const updated={...u,isNew:false};await ss(`user_${u.id}`,updated);setUser(updated);setShowOnboarding(true);return;}
    setUser(u);await loadHistory(u.id);
    const sp=await sg(`sprint_${u.id}`);if(sp){setSprint(sp);await loadJournals(u.id,sp);}
  }
  async function onJournalout(){await ss("session",null);setUser(null);setSprint(null);setWL({});setHistory([]);setView("home");setShowOnboarding(false);setShowRecap(false);}
  function onSprintCreated(sp){setSprint(sp);setWL({});setView("home");setShowRecap(false);}
  function onEnregistrerJournals(w,logs){setWL(p=>({...p,[w]:logs}));}
  async function onArchive(){setSprint(null);setWL({});setShowRecap(false);setView("sprint");if(user)await loadHistory(user.id);}

  if(booting)return <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:T.muted,fontSize:14}}>Chargement…</span></div>;
  if(!user)return <AuthView onAuth={onAuth}/>;
  if(showOnboarding)return <OnboardingView name={user.name} onDone={()=>{setShowOnboarding(false);setView("sprint");}}/>;
  if(showRecap&&sprint)return <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
    <div style={{background:T.surface,borderBottom:`1px solid ${T.border}`,padding:"11px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:9}}><div style={{width:28,height:28,borderRadius:8,background:T.text,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#fff"}}>M</div><span style={{fontWeight:800,fontSize:15}}>Momentum</span></div>
      <span style={{color:T.amber,fontSize:12,fontWeight:600}}>Sprint terminé</span>
    </div>
    <RecapView user={user} sprint={sprint} weekJournals={weekJournals} onArchive={onArchive}/>
  </div>;

  return <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
    <div style={{background:"rgba(242,242,247,0.92)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderBottom:"1px solid rgba(0,0,0,0.1)",padding:"11px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:9}}><div style={{width:28,height:28,borderRadius:8,background:T.text,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#fff"}}>M</div><span style={{fontWeight:800,fontSize:15}}>Momentum</span></div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {sprint&&<span style={{color:T.muted,fontSize:11}}>W{wk}/12</span>}
        {userIsAdmin&&<span style={{fontSize:9,color:T.amber,background:T.amber+"22",padding:"2px 7px",borderRadius:4,fontWeight:700}}>ADMIN</span>}
        <Avatar name={user.name} userId={user.id} email={user.email} size={28}/>
      </div>
    </div>
    {!sprint&&view!=="sprint"&&<div style={{background:"rgba(0,122,255,0.08)",borderBottom:"1px solid rgba(0,122,255,0.15)",padding:"10px 20px",textAlign:"center"}}><span style={{color:T.text,fontSize:13}}>Aucun sprint actif.{" "}<button onClick={()=>setView("sprint")} style={{background:"none",border:"none",color:T.accent,fontWeight:700,fontSize:13,cursor:"pointer",padding:0}}>En créer un →</button></span></div>}
    <div style={{paddingTop:4}}>
      {view==="home"&&(sprint?<AccueilView sprint={sprint} weekJournals={weekJournals} quote={quote} userId={user.id}/>:<div style={{textAlign:"center",padding:64}}><p style={{color:T.muted,fontSize:15,marginBottom:20}}>Configure un sprint pour commencer.</p><Btn onClick={()=>setView("sprint")}>Configurer un sprint →</Btn></div>)}
      {view==="log"&&(sprint?<JournalView sprint={sprint} weekJournals={weekJournals} onEnregistrer={onEnregistrerJournals} userId={user.id} onMettre à jourSprint={sp=>setSprint(sp)}/>:<div style={{textAlign:"center",padding:64,color:T.muted}}>Configure d'abord un sprint.</div>)}
      {view==="sprint"&&<SprintTab user={user} sprint={sprint} onSprintCreated={onSprintCreated} onHabitsMettre à jourd={sp=>setSprint(sp)} history={history}/>}
      {view==="social"&&(sprint?<SocialView user={user} sprint={sprint}/>:<div style={{textAlign:"center",padding:64,color:T.muted}}>Configure d'abord un sprint.</div>)}
      {view==="duels"&&(sprint?<DuelsView user={user} sprint={sprint}/>:<div style={{textAlign:"center",padding:64,color:T.muted}}>Configure d'abord un sprint.</div>)}
      {view==="profile"&&<ProfilView user={user} sprint={sprint} weekJournals={weekJournals} onJournalout={onJournalout}/>}
      {view==="admin"&&userIsAdmin&&<AdminView currentUser={user} onHistoryMettre à jourd={loadHistory}/>}
    </div>
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(242,242,247,0.92)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderTop:"1px solid rgba(0,0,0,0.1)",display:"flex",paddingBottom:"env(safe-area-inset-bottom,8px)",zIndex:100}}>
      {NAV.map(item=>(
        <button key={item.id} onClick={()=>setView(item.id)} style={{flex:1,background:"none",border:"none",cursor:"pointer",padding:"12px 4px 10px",display:"flex",flexDirection:"column",alignItems:"center",gap:5,minHeight:56}}>
          <div style={{width:24,height:3,borderRadius:2,background:view===item.id?(item.id==="admin"?T.amber:T.accent):"transparent",transition:"background 0.2s"}}/>
          <span style={{fontSize:12,fontWeight:view===item.id?700:500,color:view===item.id?(item.id==="admin"?T.amber:T.text):T.muted,transition:"color 0.2s",letterSpacing:-0.1}}>{item.label}</span>
        </button>
      ))}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
