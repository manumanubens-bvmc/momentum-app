function fbKey(k){return k.replace(/\./g,"_").replace(/#/g,"_").replace(/\$/g,"_").replace(/\[/g,"_").replace(/\]/g,"_");}
async function sg(k){
  try{
    if(window._fbReady){
      var snap=await window._fbDb.ref(fbKey(k)).once("value");
      return snap.exists()?snap.val():null;
    }
    var v=localStorage.getItem(k);return v?JSON.parse(v):null;
  }catch(e){console.warn("sg error",k,e);return null;}
}
async function ss(k,v){
  try{
    if(window._fbReady){
      await window._fbDb.ref(fbKey(k)).set(v===null?null:v);

function gravatarUrl(email,size=80){const hash=md5(email.trim().toLowerCase());return`https://www.gravatar.com/avatar/${hash}?s=${size}&d=identicon`;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function weekNum(sd){
  // Count calendar weeks (Mon–Sun) elapsed since sprint start
  const start=new Date(sd);
  // Normalize both dates to the Monday of their respective week
  const toMonday=d=>{const day=d.getDay()===0?6:d.getDay()-1;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);};
  const startMon=toMonday(start);
  const nowMon=toMonday(new Date());
  const weeks=Math.round((nowMon-startMon)/(7*24*60*60*1000))+1;
  return Math.min(Math.max(weeks,1),12);
}
function scoreOne(raw,h){
  if(raw===null||raw===undefined||raw==="")return 0;
  const v=h.type==="boolean"?(raw?1:0):Math.max(parseFloat(raw)||0,0);
  const t=Math.max(parseFloat(h.target)||1,0.001);
  return h.targetType==="max"?Math.min(t/Math.max(v,0.001),1):Math.min(v/t,1);
}
function calcScores(habits,logs){
  const reg=(habits||[]).filter(h=>!h.isBonus);
  const bon=(habits||[]).filter(h=>h.isBonus);
  let tW=0,tS=0;const byCat={};
  CATS.forEach(({id})=>{
    const ch=reg.filter(h=>h.catId===id&&(parseFloat(h.weight)||0)>0);
    if(!ch.length){byCat[id]=null;return;}
    let cW=0,cS=0;
    ch.forEach(h=>{const w=parseFloat(h.weight)||0,s=scoreOne((logs||{})[h.id],h);cW+=w;cS+=w*s;tW+=w;tS+=w*s;});
    byCat[id]=cW>0?Math.round((cS/cW)*100):0;
  });
  const regScore=tW>0?Math.round((tS/tW)*100):0;
  let bonusScore=0;
  bon.forEach(h=>{bonusScore+=scoreOne((logs||{})[h.id],h)*5;});
  return{overall:Math.min(regScore+Math.round(bonusScore),100),byCat,regScore,bonusScore:Math.round(bonusScore)};
}
function scoreColor(s){return s>=80?T.green:s>=50?T.amber:T.red;}
function avCol(id){let n=0;for(let i=0;i<(id||"").length;i++)n=(n+id.charCodeAt(i))%AV_COLORS.length;return AV_COLORS[n];}
function initials(n){return(n||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();}
function fmtDate(iso){return new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}
function catAvgsFromSemaines(habits,weekJournals,upToWk,pausedSemaines=[]){
  const sums={};const counts={};
  for(let w=1;w<=upToWk;w++){
    if(pausedSemaines.includes(w))continue;
    const ll=weekJournals[w]||{};
    const has=habits.some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!=="");
    if(!has)continue;
    const{byCat}=calcScores(habits,ll);
    CATS.forEach(c=>{if(byCat[c.id]!==null&&byCat[c.id]!==undefined){sums[c.id]=(sums[c.id]||0)+byCat[c.id];counts[c.id]=(counts[c.id]||0)+1;}});
  }
  const res={};
  CATS.forEach(c=>{res[c.id]=counts[c.id]?Math.round(sums[c.id]/counts[c.id]):null;});
  return res;
}
function sprintAvgFromJournals(habits,weekJournals,upToWk,pausedSemaines=[]){
  let sum=0;let count=0;
  for(let w=1;w<=upToWk;w++){
    if(pausedSemaines.includes(w))continue;
    const ll=weekJournals[w]||{};
    const has=habits.some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!=="");
    if(!has)continue;
    const{overall}=calcScores(habits,ll);sum+=overall;count++;
  }
  return count?Math.round(sum/count):0;
}

// ── RADAR CHART ──
function RadarChart({cats,datasets,size}){
  const s=size||(typeof window!=="undefined"?Math.min(Math.max(window.innerWidth-140,160),220):200);
  const n=cats.length;if(n<3)return null;
  const cx=s/2,cy=s/2,R=s*0.34;
  const angles=cats.map((_,i)=>(i/n)*2*Math.PI-Math.PI/2);
  const pt=(a,v)=>[cx+R*Math.cos(a)*v/100,cy+R*Math.sin(a)*v/100];
  const labelPt=(a)=>[cx+(R+18)*Math.cos(a),cy+(R+18)*Math.sin(a)];
  const gridLevels=[25,50,75,100];
  return(
    <svg width={s} height={s} viewBox={`0 0 ${s} ${s}`}>
      {gridLevels.map(lv=>{
        const pts=angles.map(a=>pt(a,lv));
        return <polygon key={lv} points={pts.map(p=>p.join(",")).join(" ")} fill="none" stroke={T.border} strokeWidth={lv===100?1:0.5}/>;
      })}
      {angles.map((a,i)=>{const[x,y]=pt(a,100);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={T.border} strokeWidth={0.5}/>;})}
      {datasets.map((ds,di)=>{
        const pts=angles.map((a,i)=>pt(a,ds.values[i]||0));
        const poly=pts.map(p=>p.join(",")).join(" ");
        return <g key={di}><polygon points={poly} fill={ds.color+"2A"} stroke={ds.color} strokeWidth={1.5}/>{pts.map(([x,y],i)=><circle key={i} cx={x} cy={y} r={3} fill={ds.color}/>)}</g>;
      })}
      {angles.map((a,i)=>{
        const[x,y]=labelPt(a);
        const anchor=Math.cos(a)>0.2?"start":Math.cos(a)<-0.2?"end":"middle";
        return <text key={i} x={x} y={y} textAnchor={anchor} fontSize={Math.max(s*0.038,8)} fill={cats[i].color} dominantBaseline="middle" fontWeight="700">{cats[i].name.toUpperCase()}</text>;
      })}
    </svg>
  );
}

function AuthView({onAuth}){
  const [mode,setMode]=useState("login");
  const [name,setName]=useState("");const [email,setEmail]=useState("");const [password,setPassword]=useState("");
  const [err,setErr]=useState("");const [busy,setBusy]=useState(false);const [dbg,setDbg]=useState("");
  async function go(){
    if(busy)return;setErr("");setDbg("");
    if(mode==="register"&&!name.trim()){setErr("Merci d'entrer ton nom complet.");return;}
    if(!email.trim()){setErr("Merci d'entrer ton email.");return;}
    if(!password){setErr("Merci d'entrer un mot de passe.");return;}
    if(mode==="register"&&password.length<6){setErr("Le mot de passe doit contenir au moins 6 caractères.");return;}
    setBusy(true);setDbg("Connexion…");
    try{
      const em=email.trim().toLowerCase();
      if(mode==="register"){
        setDbg("Vérification de l'email…");
        const idx=await sg("userIndex")||[];
        if(idx.find(u=>u.email===em)){setErr("Email déjà enregistré. Essaie de te connecter.");return;}
        const user={id:uid(),name:name.trim(),email:em,passwordHash:hashStr(password),createdAt:Date.now(),isNew:true};
        setDbg("Création du compte…");
        await ss(`user_${user.id}`,user);
        await ss("userIndex",[...idx,{id:user.id,email:user.email,name:user.name}]);
        setDbg("");onAuth(user);
      }else{
        setDbg("Recherche du compte…");
        const idx=await sg("userIndex")||[];
        const found=idx.find(u=>u.email===em);
        if(!found){setErr("Aucun compte trouvé avec cet email.");return;}
        const user=await sg(`user_${found.id}`);
        if(!user||user.passwordHash!==hashStr(password)){setErr("Mot de passe incorrect.");return;}
        setDbg("");onAuth(user);
      }
    }catch(e){setErr("Error: "+e.message);}finally{setBusy(false);}
  }
  return <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 20px"}}>
    <div style={{width:"100%",maxWidth:400}}>
      <div style={{textAlign:"center",marginBottom:40}}>
        <div style={{width:64,height:64,borderRadius:20,background:T.accent,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:26,fontWeight:800,color:"#fff"}}>M</div>
        <h1 style={{color:T.text,margin:0,fontSize:28,fontWeight:800}}>Momentum</h1>
        <p style={{color:T.muted,margin:"8px 0 0",fontSize:14}}>Construis la vie que tu veux, un sprint à la fois.</p>
      </div>
      <div style={{display:"flex",background:"rgba(0,0,0,0.05)",borderRadius:14,padding:4,marginBottom:28}}>
        {[["login","Se connecter"],["register","Créer un compte"]].map(([m,l])=>(
          <button key={m} onClick={()=>{setMode(m);setErr("");setDbg("");}} style={{flex:1,padding:"9px 0",border:"none",borderRadius:9,cursor:"pointer",background:mode===m?T.accent:"transparent",color:mode===m?"#fff":T.muted,fontSize:14,fontWeight:600,transition:"all 0.2s"}}>{l}</button>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {mode==="register"&&<Inp label="Nom complet" value={name} onChange={e=>setName(e.target.value)} placeholder="Ton prénom"/>}
        <Inp label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/>
        <Inp label="Password" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••"/>
        {err&&<div style={{background:T.red+"18",border:`1px solid ${T.red}44`,borderRadius:8,padding:"10px 12px"}}><p style={{margin:0,fontSize:13,color:T.red}}>{err}</p></div>}
        {dbg&&<p style={{color:T.muted,fontSize:12,textAlign:"center",margin:0}}>{dbg}</p>}
        <button onClick={go} disabled={busy} style={{background:busy?T.faint:T.accent,color:"#fff",border:"none",borderRadius:10,fontWeight:600,fontSize:15,padding:"13px",cursor:busy?"not-allowed":"pointer",opacity:busy?0.7:1}}>

        </button>
      </div>
    </div>
  </div>;
}

function SprintSetupView({user,onDone,isFirstSprint=false}){
  const [step,setStep]=useState(0);

  const totalW=Object.values(catW).reduce((a,v)=>a+(parseFloat(v)||0),0);

    setFormOpen(true);setModifieringId(null);
  }

  }
  function saveForm(cat){

    const tpls=(TEMPLATES[cat.id]||[]).filter(t=>!usedNames.has(t.name));
    return <Scroll>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:2}}><div style={{width:12,height:12,borderRadius:3,background:cat.color}}/><SH>{cat.name}</SH></div>
      {/* Catégorie description */}
      <div style={{background:cat.color+"12",border:`1px solid ${cat.color}33`,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
        <p style={{margin:0,fontSize:13,color:T.text,lineHeight:1.6}}>{cat.desc}</p>
      </div>
      {/* Weight guidance */}
      <div style={{background:"rgba(0,0,0,0.04)",border:"1px solid rgba(0,0,0,0.1)",borderRadius:10,padding:"12px 14px",marginBottom:16}}>
        <p style={{margin:0,fontSize:12,color:T.muted,lineHeight:1.6}}>
          <strong style={{color:T.text}}>Comment fonctionnent les poids :</strong> Each habit's weight is its share of this category's {budget}% budget.
          All habit weights in this category must add up to <strong style={{color:cat.color}}>{budget}%</strong>.
          The suggested weight below is automatically set to the remaining budget.
        </p>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{color:T.muted,fontSize:12}}>Budget: <strong style={{color:cat.color}}>{budget}%</strong> · Used: <strong style={{color:remaining<0?T.red:T.text}}>{used.toFixed(0)}%</strong> · Remaining: <strong style={{color:remaining<0?T.red:T.green}}>{remaining.toFixed(0)}%</strong></span>
      </div>
      <div style={{height:4,background:T.border,borderRadius:2,margin:"0 0 20px"}}>
        <div style={{height:"100%",borderRadius:2,background:remaining<0?T.red:cat.color,width:`${Math.min(pct,100)}%`,transition:"width 0.3s"}}/>
      </div>

      {/* Templates */}
      {tpls.length>0&&<div style={{marginBottom:16}}>
        <p style={{color:T.muted,fontSize:11,textTransform:"uppercase",letterSpacing:0.6,margin:"0 0 8px"}}>Ajout rapide depuis la bibliothèque — clique pour personnaliser</p>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {tpls.map(t=><button key={t.name} onClick={()=>openTemplate(cat,t,remaining)} style={{background:cat.color+"15",border:`1px solid ${cat.color}44`,color:cat.color,borderRadius:8,fontSize:12,padding:"6px 11px",cursor:"pointer",fontWeight:500}}>+ {t.name} <span style={{opacity:0.6,fontSize:10}}>{t.weight}%</span></button>)}
        </div>
      </div>}

      {/* Habit list */}
      {regH.map(h=>{
        if(editingId===h.id&&formOpen)return <div key={h.id} style={{marginBottom:8}}><HabitForm habit={draft} cat={cat} remaining={remaining+(parseFloat(h.weight)||0)} onChange={setDraft} saveLabel="Mettre à jour" onEnregistrer={()=>saveForm(cat)} onAnnuler={()=>{setFormOpen(false);setModifieringId(null);setDraft(null);}}/></div>;
        return <div key={h.id} style={{background:T.card,borderRadius:14,boxShadow:shadow,padding:"11px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{color:T.text,fontSize:14,fontWeight:500}}>{h.name}</div>
            <div style={{color:T.muted,fontSize:12,marginTop:2}}>{h.subCat&&`${h.subCat} · `}{h.type}{h.target?` · ${h.targetType==="min"?"≥":"≤"} ${h.target}${h.unit?` ${h.unit}`:""}`:""} · <strong style={{color:cat.color}}>{h.weight}%</strong></div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>openModifier(h,remaining+(parseFloat(h.weight)||0))} style={{background:"none",border:`1px solid ${T.border}`,color:T.muted,borderRadius:7,padding:"8px 12px",fontSize:12,cursor:"pointer",minHeight:36}}>Modifier</button>
            <button onClick={()=>setHabits(p=>({...p,[cat.id]:p[cat.id].filter(x=>x.id!==h.id)}))} style={{background:"none",border:"none",color:T.red,cursor:"pointer",fontSize:20,padding:"0 4px"}}>×</button>
          </div>
        </div>;
      })}

      {/* Add custom */}
      {(!formOpen||editingId)&&<button onClick={()=>openNew(cat,remaining)} style={{width:"100%",padding:12,background:"transparent",border:`1.5px dashed ${T.faint}`,borderRadius:10,color:T.muted,fontSize:14,cursor:"pointer",marginTop:4}}>+ Ajouter une habitude personnalisée</button>}
      {formOpen&&!editingId&&<HabitForm habit={draft} cat={cat} remaining={remaining} onChange={setDraft} onEnregistrer={()=>saveForm(cat)} onAnnuler={()=>{setFormOpen(false);setDraft(null);}}/>}

      <div style={{display:"flex",gap:10,marginTop:24}}>
        <Btn variant="secondary" onClick={()=>catIdx===0?setStep(0):setCatIdx(i=>i-1)}>← Retour</Btn>
        <Btn full onClick={()=>catIdx<activeCats.length-1?setCatIdx(i=>i+1):setStep(2)}>{catIdx<activeCats.length-1?`Next: ${activeCats[catIdx+1].name} →`:"Révision →"}</Btn>
      </div>
      <div style={{display:"flex",justifyContent:"center",gap:6,marginTop:14}}>
        {activeCats.map((c,i)=><div key={c.id} style={{width:6,height:6,borderRadius:3,background:i===catIdx?c.color:i<catIdx?T.green:T.border,transition:"background 0.3s"}}/>)}
      </div>
    </Scroll>;
  }

  // Step 2 — review
  const allH=CATS.flatMap(c=>habits[c.id]||[]);
  const totalHW=allH.filter(h=>!h.isBonus).reduce((a,h)=>a+(parseFloat(h.weight)||0),0);
  // Bonus cat options for the form (all active cats)
  const bonusCatOptions=activeCats.map(c=>({value:c.id,label:c.name}));
  const bonusCat=bonus?CATS.find(c=>c.id===bonus.catId)||CATS[0]:CATS[0];
  return <Scroll>
    <SH>Review sprint</SH><Sub>Étape 3 sur 3 — confirme ton plan de 12 semaines</Sub>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:T.card,borderRadius:14,boxShadow:shadow,padding:"12px 16px",marginBottom:20}}>
      <span style={{color:T.muted,fontSize:13}}>Poids des habitudes :</span>
      <span style={{fontWeight:700,fontSize:18,color:Math.abs(totalHW-100)<2?T.green:T.amber}}>{totalHW.toFixed(0)}%</span>
    </div>
    {CATS.filter(c=>(habits[c.id]||[]).length>0).map(cat=>{
      const reg=(habits[cat.id]||[]).filter(h=>!h.isBonus);
      return <div key={cat.id} style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <div style={{width:8,height:8,borderRadius:2,background:cat.color}}/>
          <span style={{color:cat.color,fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{cat.name}</span>
        </div>
        {reg.map(h=><div key={h.id} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px",marginBottom:4,display:"flex",justifyContent:"space-between"}}>
          <span style={{color:T.text,fontSize:13}}>{h.name}{h.subCat&&<span style={{color:T.muted}}> · {h.subCat}</span>}</span>
          <span style={{color:T.muted,fontSize:12}}>{h.weight}%</span>
        </div>)}
      </div>;
    })}

    {/* Global bonus habit */}
    <div style={{borderTop:`1px solid ${T.border}`,paddingTop:16,marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
        <span style={{fontSize:14}}>⭐</span>
        <span style={{color:T.amber,fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>Bonus habit</span>
        <span style={{color:T.faint,fontSize:11}}>— one per sprint, worth +5% if achieved</span>
      </div>
      {!bonus&&!bonusFormOpen&&(
        <button onClick={openBonusNew} style={{width:"100%",padding:12,background:T.amber+"10",border:`1.5px dashed ${T.amber}55`,borderRadius:10,color:T.amber,fontSize:13,cursor:"pointer",fontWeight:500}}>
          + Définir ton habitude bonus
        </button>
      )}
      {bonusFormOpen&&bonusDraft&&(
        <div style={{background:T.amber+"0A",border:`1px solid ${T.amber}44`,borderRadius:12,padding:16,display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Inp label="Nom de l'habitude" value={bonusDraft.name} placeholder="e.g. Run a 10k" onChange={e=>setBonusDraft(p=>({...p,name:e.target.value}))}/>
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              <label style={{fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:0.6}}>Catégorie</label>
              <select value={bonusDraft.catId} onChange={e=>setBonusDraft(p=>({...p,catId:e.target.value}))} style={{...iSx}}>
                {bonusCatOptions.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:0.6}}>Type de métrique</label>
            <select value={bonusDraft.type} onChange={e=>setBonusDraft(p=>({...p,type:e.target.value}))} style={{...iSx}}>
              {MTYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
          </div>
          {bonusDraft.type!=="boolean"&&<>
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              <label style={{fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:0.6}}>Direction de l'objectif</label>
              <select value={bonusDraft.targetType} onChange={e=>setBonusDraft(p=>({...p,targetType:e.target.value}))} style={{...iSx}}>
                <option value="min">Au moins (minimum)</option><option value="max">Au plus (maximum)</option>
              </select>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10}}>
              <Inp label="Valeur cible" type="number" value={bonusDraft.target} placeholder="e.g. 10" onChange={e=>setBonusDraft(p=>({...p,target:e.target.value}))}/>
              <Inp label="Unit" value={bonusDraft.unit} placeholder="km" onChange={e=>setBonusDraft(p=>({...p,unit:e.target.value}))}/>
            </div>
          </>}
          <div style={{display:"flex",gap:8}}>
            <Btn variant="ghost" small onClick={()=>{setBonusFormOpen(false);setBonusDraft(null);}}>Annuler</Btn>
            <Btn small full disabled={!bonusDraft.name.trim()} onClick={saveBonus} style={{background:T.amber,border:"none",color:"#fff"}}>Enregistrer le bonus</Btn>
          </div>
        </div>
      )}
      {bonus&&!bonusFormOpen&&(
        <div style={{background:T.amber+"12",border:`1px solid ${T.amber}44`,borderRadius:10,padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{color:T.amber,fontSize:14,fontWeight:600}}>⭐ {bonus.name}</div>
            <div style={{color:T.muted,fontSize:11,marginTop:2}}>
              {CATS.find(c=>c.id===bonus.catId)?.name} · {bonus.type}
              {bonus.type!=="boolean"?` · ${bonus.targetType==="min"?"≥":"≤"} ${bonus.target}${bonus.unit?` ${bonus.unit}`:""}`:""}
              {" · +5% bonus"}
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>{setBonusDraft({...bonus});setBonusFormOpen(true);}} style={{background:"none",border:`1px solid ${T.border}`,color:T.muted,borderRadius:7,padding:"8px 12px",fontSize:12,cursor:"pointer",minHeight:36}}>Modifier</button>
            <button onClick={()=>setBonus(null)} style={{background:"none",border:"none",color:T.red,cursor:"pointer",fontSize:20,padding:"0 2px"}}>×</button>
          </div>
        </div>
      )}
    </div>

    {allH.length===0&&<Notice color={T.amber}>Aucune habitude ajoutée. Reviens en arrière pour en ajouter.</Notice>}
    <div style={{display:"flex",gap:10,marginTop:24}}>
      <Btn variant="secondary" onClick={()=>{setStep(1);setCatIdx(activeCats.length-1);}}>← Modifier</Btn>
      <Btn full disabled={allH.length===0||saving} onClick={launch}>{saving?"Lancement…":"Lancer le sprint"}</Btn>
    </div>
  </Scroll>;
}

// ── HOME ──
function AccueilView({sprint,weekJournals,quote,userId}){
  const wk=weekNum(sprint.startDate);
  const logs=weekJournals[wk]||{};
  const {overall:wkScore,byCat:wkByCat,bonusScore}=calcScores(sprint.habits,logs);
  const [detailMode,setDetailMode]=useState("%");
  const [history,setHistory]=useState(null);
  const pausedSemaines=sprint.pausedSemaines||[];

  useEffect(()=>{sg(`sprint_history_${userId}`).then(h=>setHistory(h||[]));},[userId]);

  const sprintAvg=sprintAvgFromJournals(sprint.habits,weekJournals,wk,pausedSemaines);
  const sprintByCatAvg=catAvgsFromSemaines(sprint.habits,weekJournals,wk,pausedSemaines);
  const prevSprint=history&&history.length>0?history[history.length-1]:null;
  const last3Avg=history&&history.length>0?Math.round(history.slice(-3).reduce((a,s)=>a+(s.avgScore||0),0)/Math.min(history.length,3)):null;
  const activeCats=CATS.filter(c=>sprint.habits.some(h=>h.catId===c.id&&!h.isBonus));
  const radarCatVals=(byCatObj)=>activeCats.map(c=>byCatObj[c.id]??0);
  const logged=sprint.habits.filter(h=>!h.isBonus).filter(h=>{const v=logs[h.id];return v!==undefined&&v!==null&&v!=="";}).length;

  const now=new Date();
  const dayOfSemaine=now.getDay()===0?7:now.getDay();
  const weekPct=Math.round((dayOfSemaine/7)*100);
  const sprintPct=Math.round((wk/12)*100);

  const weekStatus=wkScore>=85?"Excellent":wkScore>=75?"Bien":wkScore>=60?"OK":"En retard";
  const weekStatusColor=wkScore>=85?T.green:wkScore>=75?"#5ac87a":wkScore>=60?T.amber:T.red;
  const sprintStatus=sprintAvg>=85?"Excellent":sprintAvg>=75?"Bien":sprintAvg>=60?"OK":"En retard";
  const sprintStatusColor=sprintAvg>=85?T.green:sprintAvg>=75?"#5ac87a":sprintAvg>=60?T.amber:T.red;

  // 12-week bar data
  const bars=Array.from({length:12},(_,i)=>{
    const w=i+1;
    if(pausedSemaines.includes(w))return{w,score:null,paused:true,logged:false};
    if(w>wk)return{w,score:null,paused:false,logged:false};
    const ll=weekJournals[w]||{};
    const has=sprint.habits.filter(h=>!h.isBonus).some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!=="");
    if(!has)return{w,score:null,paused:false,logged:false};
    const{overall}=calcScores(sprint.habits,ll);
    return{w,score:overall,paused:false,logged:true};
  });
  const chartH=76;
  const benchScore=prevSprint?prevSprint.avgScore:80;
  const benchLabel=prevSprint?`Q1-26 · ${benchScore}%`:"Objectif · 80%";
  const benchDashed=!prevSprint;
  const benchBottom=(benchScore/100)*chartH;

  return <Scroll>
    {/* Progress bars */}
    <div style={{background:T.card,borderRadius:18,padding:"18px 20px",marginBottom:14,boxShadow:shadow}}>
      <div style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
          <span style={{fontSize:10,fontWeight:600,letterSpacing:0.3,color:T.muted}}>Semaine {wk} · {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][dayOfSemaine-1]}</span>
          <span style={{fontSize:12,fontWeight:700,color:weekStatusColor}}>{weekPct}%</span>
        </div>
        <div style={{height:8,background:"rgba(0,0,0,0.07)",borderRadius:4}}>
          <div style={{height:"100%",borderRadius:4,background:weekStatusColor,width:`${weekPct}%`,transition:"width 0.6s"}}/>
        </div>
      </div>
      <div>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
          <span style={{fontSize:10,fontWeight:600,letterSpacing:0.3,color:T.muted}}>Sprint · Semaine {wk} sur 12</span>
          <span style={{fontSize:12,fontWeight:700,color:sprintStatusColor}}>{sprintPct}%</span>
        </div>
        <div style={{height:8,background:"rgba(0,0,0,0.07)",borderRadius:4,position:"relative"}}>
          <div style={{height:"100%",borderRadius:4,background:sprintStatusColor,width:`${sprintPct}%`,transition:"width 0.6s"}}/>
          {Array.from({length:11},(_,i)=>(
            <div key={i} style={{position:"absolute",left:`${((i+1)/12)*100}%`,top:0,width:1,height:"100%",background:T.bg,opacity:0.8}}/>
          ))}
        </div>
      </div>
    </div>

    {/* 21-day first sprint banner */}
    {history!==null&&history.length===0&&<div style={{background:"rgba(0,122,255,0.07)",borderRadius:16,padding:"14px 16px",marginBottom:12,borderLeft:`3px solid ${T.accent}`}}>
      <div style={{fontSize:12,fontWeight:700,color:T.accent,marginBottom:4}}>🧠 Les 21 premiers jours sont décisifs</div>
      <p style={{fontSize:12,color:T.muted,lineHeight:1.6,margin:0}}>Les neurosciences montrent que les habitudes se câblent dans le cerveau pendant les 3 premières semaines. La discipline que tu construis maintenant se multiplie sur tout le sprint — et au-delà. Sois là chaque jour.</p>
    </div>}

    {/* Two score cards */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
      <div style={{background:T.card,borderRadius:20,padding:"18px 16px",boxShadow:shadow}}>
        <div style={{fontSize:9,fontWeight:600,letterSpacing:1.2,textTransform:"uppercase",color:T.muted,marginBottom:8}}>Cette semaine</div>
        <div style={{fontSize:40,fontWeight:800,letterSpacing:-2,lineHeight:1,color:T.text}}>
          {wkScore}<span style={{fontSize:18,fontWeight:500,color:T.muted,letterSpacing:-0.5}}>%</span>
        </div>
        <div style={{fontSize:10,color:T.muted,marginTop:4,marginBottom:8}}>{logged}/{sprint.habits.filter(h=>!h.isBonus).length} habitudes saisies{bonusScore>0?` +${bonusScore}%`:""}</div>
        <div style={{display:"inline-flex",alignItems:"center",background:weekStatusColor+"18",borderRadius:20,padding:"3px 10px"}}>
          <span style={{fontSize:10,fontWeight:600,color:weekStatusColor}}>{weekStatus}</span>
        </div>
      </div>
      <div style={{background:T.card,borderRadius:20,padding:"18px 16px",boxShadow:shadow}}>
        <div style={{fontSize:9,fontWeight:600,letterSpacing:1.2,textTransform:"uppercase",color:T.muted,marginBottom:8}}>Moy. sprint</div>
        <div style={{fontSize:40,fontWeight:800,letterSpacing:-2,lineHeight:1,color:T.text}}>
          {sprintAvg}<span style={{fontSize:18,fontWeight:500,color:T.muted,letterSpacing:-0.5}}>%</span>
        </div>
        <div style={{fontSize:10,color:T.muted,marginTop:4,marginBottom:8}}>
          {prevSprint?<span>vs <strong style={{color:T.text}}>{prevSprint.avgScore}%</strong> last sprint</span>:`Semaine ${wk} sur 12`}
        </div>
        <div style={{display:"inline-flex",alignItems:"center",background:sprintStatusColor+"18",borderRadius:20,padding:"3px 10px"}}>
          <span style={{fontSize:10,fontWeight:600,color:sprintStatusColor}}>{sprintStatus}</span>
        </div>
      </div>
    </div>

    {/* Bar chart — 12 weeks */}
    <div style={{background:T.card,borderRadius:20,padding:"18px 18px 14px",marginBottom:12,boxShadow:shadow}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span style={{fontSize:12,fontWeight:600,color:T.text,letterSpacing:-0.2}}>Performance hebdomadaire</span>
        <div style={{display:"flex",gap:8}}>
          {[["rgba(0,122,255,0.22)","<60"],["rgba(0,122,255,0.45)","60+"],["#5ac87a","75+"],["rgba(0,122,255,1.0)","85+"]].map(([c,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:3}}>
              <div style={{width:7,height:7,borderRadius:2,background:c}}/>
              <span style={{fontSize:8,color:T.muted,fontWeight:500}}>{l}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{position:"relative",paddingBottom:20}}>
        {/* Benchmark line */}
        <div style={{position:"absolute",left:0,right:0,bottom:20+benchBottom,borderTop:`1.5px ${benchDashed?"dashed":"solid"} ${T.amber}`,pointerEvents:"none",zIndex:1}}>
          <span style={{position:"absolute",right:0,top:-17,fontSize:8,fontWeight:600,color:T.amber,background:T.card,padding:"1px 5px",borderRadius:4}}>{benchLabel}</span>
        </div>
        {/* Bars */}
        <div style={{display:"flex",alignItems:"flex-end",gap:3,height:`${chartH+4}px`}}>
          {bars.map(({w,score,paused,logged})=>{
            const isCur=w===wk;
            const h=logged&&score!==null?(score/100)*chartH+4:4;
            const bg=logged&&score!==null?barColor(score):"rgba(0,0,0,0.06)";
            return(
              <div key={w} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",position:"relative"}}>
                <div style={{
                  width:"100%",height:`${h}px`,borderRadius:"4px 4px 0 0",background:bg,
                  boxShadow:isCur&&logged?`0 0 0 1.5px ${T.accent}`:"none",
                  transition:"height 0.4s",
                }}/>
                <span style={{position:"absolute",bottom:-16,fontSize:7.5,fontWeight:isCur?700:400,color:isCur?T.text:T.muted}}>
                  {paused?"OFF":`W${w}`}
                </span>
              </div>
            );
          })}
        </div>
      </div>
    </div>

    {/* Radar charts */}
    {activeCats.length>=3&&<>
      <div style={{background:T.card,borderRadius:20,padding:"16px 18px",marginBottom:12,boxShadow:shadow}}>
        <div style={{fontSize:11,fontWeight:600,color:T.text,letterSpacing:-0.2,marginBottom:14}}>Semaine {wk} vs sprint average</div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
          <RadarChart cats={activeCats} datasets={[
            {label:`Semaine ${wk}`,color:T.accent,values:radarCatVals(wkByCat)},
            {label:"Moy. sprint",color:T.green,values:radarCatVals(sprintByCatAvg)},
          ]}/>
          <div style={{display:"flex",gap:16,justifyContent:"center"}}>
            {[{l:`Semaine ${wk}`,c:T.accent},{l:"Moy. sprint",c:T.green}].map(({l,c})=>(
              <div key={l} style={{display:"flex",alignItems:"center",gap:5}}>
                <div style={{width:8,height:8,borderRadius:2,background:c}}/>
                <span style={{fontSize:10,color:T.muted,fontWeight:500}}>{l}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

// ── LOG ──
function JournalView({sprint,weekJournals,onEnregistrer,userId,onMettre à jourSprint}){
  const currentWk=useMemo(()=>weekNum(sprint.startDate),[sprint.startDate]);
  const [selWk,setSelWk]=useState(currentWk);
  const [local,setLocal]=useState(weekJournals[currentWk]||{});
  const [saved,setEnregistrerd]=useState(false);
  useEffect(()=>setLocal(weekJournals[selWk]||{}),[weekJournals,selWk]);
  const {overall,bonusScore}=useMemo(()=>calcScores(sprint.habits,local),[sprint.habits,local]);
  const pausedSemaines=sprint.pausedSemaines||[];
  const isSelWkPaused=pausedSemaines.includes(selWk);

  async function togglePause(){
    const newPaused=isSelWkPaused?pausedSemaines.filter(w=>w!==selWk):[...pausedSemaines,selWk];
    const updated={...sprint,pausedSemaines:newPaused};
    await ss(`sprint_${userId}`,updated);
    onMettre à jourSprint(updated);
  }

  async function save(){
    if(isSelWkPaused)return;
    // Enregistrer logs and update UI immediately — don't wait on social writes
    await ss(`logs_${userId}_${sprint.id}_w${selWk}`,local);
    onEnregistrer(selWk,local);
    setEnregistrerd(true);
    setTimeout(()=>setEnregistrerd(false),2000);
    // Push social data in background (non-blocking)
    const {overall:ov,byCat}=calcScores(sprint.habits,local);
    sg(`user_${userId}`).then(u=>{
      const uname=u?.name||"User";
      const wsk=`social_${sprint.id}_w${selWk}`;
      sg(wsk).then(we=>{
        ss(wsk,[...(we||[]).filter(e=>e.userId!==userId),{userId,name:uname,email:(await sg(`user_${userId}`))?.email||"",overall:ov,byCat}],true);
      });
      const allEnregistrerd={...weekJournals,[selWk]:local};
      const curPaused=sprint.pausedSemaines||[];
      const entries=Object.entries(allEnregistrerd).map(([w,lg])=>{
        if(curPaused.includes(parseInt(w)))return null;
        const has=sprint.habits.some(h=>lg[h.id]!==undefined&&lg[h.id]!==null&&lg[h.id]!=="");
        const{overall:s}=calcScores(sprint.habits,lg);return has?{w:parseInt(w),s}:null;
      }).filter(Boolean);
      const spAvg=entries.length?Math.round(entries.reduce((a,e)=>a+e.s,0)/entries.length):0;
      const ssk=`social_sprint_${sprint.id}`;
      sg(ssk).then(se=>{
        ss(ssk,[...(se||[]).filter(e=>e.userId!==userId),{userId,name:uname,sprintAvg:spAvg,weeksJournalged:entries.length,weekScores:Object.fromEntries(entries.map(e=>[e.w,e.s]))}],true);
      });
    });
  }

  const catGroups=CATS.map(c=>({...c,habits:sprint.habits.filter(h=>h.catId===c.id)})).filter(c=>c.habits.length>0);
  const regHabits=sprint.habits.filter(h=>!h.isBonus);
  return <Scroll>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
      <div>
        <SH>Journal</SH>
        <p style={{color:T.muted,fontSize:13,margin:"4px 0 0"}}>
          {isSelWkPaused
            ?<span style={{color:T.amber,fontWeight:600}}>Semaine {selWk} marked as OFF — not counted in averages</span>
            :<><strong style={{color:scoreColor(overall)}}>{overall}%</strong>{bonusScore>0&&<span style={{color:T.amber,marginLeft:6,fontSize:11}}>+{bonusScore}% bonus</span>}{selWk!==currentWk&&<span style={{color:T.amber,marginLeft:8,fontSize:11}}>← semaine passée</span>}</>
          }
        </p>
      </div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={togglePause}
          style={{background:isSelWkPaused?T.amber+"22":"transparent",border:`1px solid ${isSelWkPaused?T.amber:T.border}`,
            color:isSelWkPaused?T.amber:T.muted,borderRadius:8,padding:"7px 11px",fontSize:12,cursor:"pointer",fontWeight:600}}>
          {isSelWkPaused?"▶ Reprendre":"⏸ Jours off"}
        </button>
        {!isSelWkPaused&&<Btn onClick={save} variant={saved?"success":"primary"}>{saved?"Enregistré ✓":"Enregistrer"}</Btn>}
      </div>
    </div>
    <div style={{display:"flex",gap:4,marginBottom:20,overflowX:"auto",paddingBottom:4}}>
      {Array.from({length:currentWk},(_,i)=>{
        const w=i+1;const ll=weekJournals[w]||{};
        const isPaused=pausedSemaines.includes(w);
        const hasJournal=!isPaused&&regHabits.some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!=="");
        const{overall:ws}=calcScores(sprint.habits,ll);const isSel=selWk===w;
        return <button key={w} onClick={()=>setSelWk(w)} style={{flexShrink:0,padding:"8px 12px",borderRadius:8,
          border:`1px solid ${isSel?(isPaused?T.amber:T.accent):T.border}`,
          background:isSel?(isPaused?T.amber+"22":T.accent+"22"):"transparent",
          cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,minWidth:44,minHeight:44,justifyContent:"center"}}>
          <span style={{fontSize:10,color:isSel?(isPaused?T.amber:T.accent):T.muted,fontWeight:isSel?700:400}}>W{w}</span>
          {isPaused
            ?<span style={{fontSize:8,color:T.amber,fontWeight:700}}>OFF</span>
            :<div style={{width:6,height:6,borderRadius:3,background:hasJournal?scoreColor(ws):T.faint}}/>
          }
        </button>;
      })}
    </div>
    {isSelWkPaused&&<div style={{background:T.amber+"12",border:`1px solid ${T.amber}33`,borderRadius:12,padding:"20px 16px",textAlign:"center",marginBottom:16}}>
      <div style={{fontSize:28,marginBottom:8}}>🏖️</div>
      <p style={{color:T.amber,fontSize:14,fontWeight:600,margin:"0 0 4px"}}>Cette semaine is marked as OFF</p>
      <p style={{color:T.muted,fontSize:12,margin:0}}>Congés, vacances ou maladie — cette semaine ne compte pas dans ta moyenne. You can still log if you want.</p>
    </div>}
    {catGroups.map(cat=>{
      const reg=cat.habits.filter(h=>!h.isBonus);const bon=cat.habits.filter(h=>h.isBonus);
      return <div key={cat.id} style={{marginBottom:20,opacity:isSelWkPaused?0.5:1,transition:"opacity 0.2s"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><div style={{width:8,height:8,borderRadius:2,background:cat.color}}/><span style={{color:cat.color,fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{cat.name}</span></div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {reg.map(h=><HabitRow key={h.id} habit={h} value={local[h.id]} onChange={v=>setLocal(p=>({...p,[h.id]:v}))}/>)}
          {bon.map(h=><HabitRow key={h.id} habit={h} value={local[h.id]} onChange={v=>setLocal(p=>({...p,[h.id]:v}))} isBonus/>)}
        </div>
      </div>;
    })}
  </Scroll>;
}

function HabitRow({habit,value,onChange,isBonus=false}){
  const isBool=habit.type==="boolean";const s=scoreOne(isBool?(value?1:0):value,habit);
  const hasVal=value!==undefined&&value!==null&&value!=="";const col=hasVal?scoreColor(Math.round(s*100)):T.border;
  return <div style={{background:isBonus?"rgba(255,149,0,0.07)":T.card,border:"none",borderRadius:14,boxShadow:shadow,padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
    <div style={{width:4,height:38,borderRadius:2,background:isBonus?T.amber:col,flexShrink:0,transition:"background 0.3s"}}/>
    <div style={{flex:1}}>
      <div style={{color:isBonus?T.amber:T.text,fontSize:14,fontWeight:500}}>{isBonus?"⭐ ":""}{habit.name}</div>
      <div style={{color:T.muted,fontSize:11,marginTop:2}}>
        {habit.subCat&&`${habit.subCat} · `}
        {habit.type!=="boolean"&&`${habit.targetType==="min"?"≥":"≤"} ${habit.target}${habit.unit?` ${habit.unit}`:""} · `}
        {isBonus?"+5% bonus":habit.weight+"%"}
        {hasVal&&<span style={{marginLeft:6,color:isBonus?T.amber:col,fontWeight:700}}>{Math.round(s*100)}%</span>}
      </div>
    </div>
    {isBool
      ?<button onClick={()=>onChange(!value)} style={{width:52,height:32,borderRadius:16,border:"none",cursor:"pointer",flexShrink:0,background:value?(isBonus?T.amber:T.green):T.border,transition:"background 0.2s",position:"relative"}}>
          <div style={{width:26,height:26,borderRadius:13,background:"#fff",position:"absolute",top:3,left:value?23:3,transition:"left 0.2s"}}/>
        </button>
      :<input type="number" step={habit.type==="duration"?0.5:1} min={habit.type==="rating"?1:0} max={habit.type==="rating"?5:undefined} value={value??""} onChange={e=>onChange(e.target.value)} placeholder={habit.type==="rating"?"1–5":"0"} style={{...iSx,width:80,textAlign:"center",fontWeight:700,flexShrink:0,padding:"9px 6px",fontSize:16}}/>
    }
  </div>;
}

function SprintTab({user,sprint,onSprintCreated,onHabitsMettre à jourd,history=[]}){
  const [reconfigure,setReconfigure]=useState(false);
  const [editingId,setModifieringId]=useState(null);const [editDraft,setModifierDraft]=useState(null);const [saving,setSaving]=useState(false);
  if(!sprint||reconfigure)return <SprintSetupView user={user} onDone={s=>{setReconfigure(false);onSprintCreated(s);}} isFirstSprint={!sprint&&history.length===0}/>;
  const wk=weekNum(sprint.startDate);
  async function saveModifier(){setSaving(true);const updated=sprint.habits.map(h=>h.id===editDraft.id?{...editDraft,weight:parseFloat(editDraft.weight)||0}:h);const sp={...sprint,habits:updated};await ss(`sprint_${user.id}`,sp);onHabitsMettre à jourd(sp);setModifieringId(null);setModifierDraft(null);setSaving(false);}
  async function delHabit(id){const sp={...sprint,habits:sprint.habits.filter(h=>h.id!==id)};await ss(`sprint_${user.id}`,sp);onHabitsMettre à jourd(sp);}
  const catGroups=CATS.map(c=>({...c,habits:sprint.habits.filter(h=>h.catId===c.id),weight:(sprint.catWeights||{})[c.id]||0})).filter(c=>c.habits.length>0);
  return <Scroll>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}><SH>Sprint en cours</SH><Btn small variant="secondary" onClick={()=>setReconfigure(true)}>Nouveau sprint</Btn></div>
    <Sub>Semaine {wk} sur 12 · started {fmtDate(sprint.startDate)}</Sub>
    <Notice color={T.accent}>Appuie sur Modifier pour mettre à jour une habitude. Les logs passés ne sont pas affectés.</Notice>
    {catGroups.map(cat=>{
      const reg=cat.habits.filter(h=>!h.isBonus);const bon=cat.habits.filter(h=>h.isBonus);
      const totW=reg.reduce((a,h)=>a+(parseFloat(h.weight)||0),0);
      return <div key={cat.id} style={{background:T.card,borderRadius:18,boxShadow:shadow,padding:"14px 16px",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <div style={{width:8,height:8,borderRadius:2,background:cat.color}}/>
          <span style={{color:cat.color,fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{cat.name}</span>
          <span style={{color:T.muted,fontSize:11,marginLeft:"auto"}}>{totW.toFixed(0)}% / {cat.weight}%</span>
        </div>
        {[...reg,...bon].map(h=>{
          const isBonus=h.isBonus;
          if(editingId===h.id&&editDraft){
            const otherW=reg.filter(x=>x.id!==h.id).reduce((a,x)=>a+(parseFloat(x.weight)||0),0);
            return <div key={h.id} style={{marginTop:4}}><HabitForm habit={editDraft} cat={cat} remaining={(cat.weight||0)-otherW} onChange={setModifierDraft} saveLabel={saving?"Saving…":"Mettre à jour"} onEnregistrer={saveModifier} onAnnuler={()=>{setModifieringId(null);setModifierDraft(null);}}/></div>;
          }
          return <div key={h.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:isBonus?T.amber+"10":T.surface,borderRadius:10,marginBottom:6,border:isBonus?`1px solid ${T.amber}22`:"none"}}>
            <div style={{flex:1}}>
              <div style={{color:isBonus?T.amber:T.text,fontSize:13,fontWeight:500}}>{isBonus?"⭐ ":""}{h.name}{h.subCat&&<span style={{color:T.muted,fontSize:11}}> · {h.subCat}</span>}</div>
              <div style={{color:T.muted,fontSize:11,marginTop:3}}>{h.type!=="boolean"&&`${h.targetType==="min"?"≥":"≤"} ${h.target}${h.unit?` ${h.unit}`:""} · `}<strong style={{color:isBonus?T.amber:cat.color}}>{isBonus?"+5% bonus":h.weight+"%"}</strong></div>
            </div>
            <button onClick={()=>{setModifieringId(h.id);setModifierDraft({...h});}} style={{background:"none",border:`1px solid ${T.border}`,color:T.muted,borderRadius:7,padding:"8px 12px",fontSize:12,cursor:"pointer",flexShrink:0,minHeight:36}}>Modifier</button>
            <button onClick={()=>delHabit(h.id)} style={{background:"none",border:"none",color:T.red+"88",fontSize:18,cursor:"pointer",padding:"0 2px",lineHeight:1,flexShrink:0}}>×</button>
          </div>;
        })}
      </div>;
    })}
  </Scroll>;
}

// ── SOCIAL ──
function SocialView({user,sprint}){
  const [tab,setTab]=useState("week");
  const [spData,setSpData]=useState([]);
  const [wkData,setWkData]=useState([]);
  const [prevWkData,setPrevWkData]=useState([]);
  const [loading,setLoading]=useState(true);
  const [expanded,setExpanded]=useState(null);
  const wk=weekNum(sprint.startDate);
  const activeCats=CATS.filter(c=>sprint.habits.some(h=>h.catId===c.id&&!h.isBonus));

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      const [sd,wd,pwd]=await Promise.all([
        sg(`social_sprint_${sprint.id}`),
        sg(`social_${sprint.id}_w${wk}`),
        wk>1?sg(`social_${sprint.id}_w${wk-1}`):Promise.resolve([]),
      ]);
      setSpData((sd||[]).sort((a,b)=>b.sprintAvg-a.sprintAvg));
      setWkData((wd||[]).sort((a,b)=>b.overall-a.overall));
      setPrevWkData(pwd||[]);
      setLoading(false);
    })();
  },[sprint,wk]);

  const entries=tab==="week"?wkData:spData;

  // Streak: consecutive weeks above 75%
  function getStreak(entry){
    if(!entry.weekScores)return 0;
    let streak=0;
    for(let w=wk;w>=1;w--){
      const s=entry.weekScores[w];
      if(s===undefined||s===null)break;
      if(s>=75)streak++;
      else break;
    }
    return streak;
  }

  // Movement vs previous week
  function getMovement(entry){
    if(tab!=="week"||!prevWkData.length)return null;
    const prev=prevWkData.find(e=>e.userId===entry.userId);
    if(!prev)return null;
    const diff=entry.overall-prev.overall;
    return diff;
  }

  // Beat last sprint badge
  function beatLastSprint(entry){
    if(tab!=="sprint")return false;
    return entry.sprintAvg&&entry.lastSprintAvg&&entry.sprintAvg>entry.lastSprintAvg;
  }

  // Top 3 for podium
  const top3=entries.slice(0,3);
  const rest=entries.slice(3);

  return <Scroll>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
      <div>
        <h2 style={{fontSize:20,fontWeight:800,color:T.text,margin:"0 0 2px",letterSpacing:-0.3}}>Communauté</h2>
        <p style={{color:T.muted,fontSize:13,margin:0}}>Semaine {wk} · {entries.length} participant{entries.length!==1?"s":""}</p>
      </div>
    </div>

    {/* Tab toggle */}
    <div style={{display:"flex",background:"rgba(0,0,0,0.06)",borderRadius:12,padding:3,margin:"14px 0 20px"}}>
      {[["week","Cette semaine"],["sprint","Sprint"]].map(([t,l])=>(
        <button key={t} onClick={()=>{setTab(t);setExpanded(null);}}
          style={{flex:1,padding:"9px 0",border:"none",borderRadius:10,cursor:"pointer",
            background:tab===t?T.card:"transparent",color:tab===t?T.text:T.muted,
            fontSize:13,fontWeight:600,boxShadow:tab===t?shadow:"none",transition:"all 0.2s"}}>{l}</button>
      ))}
    </div>

    {/* Invite card */}
    <div style={{background:T.card,borderRadius:16,padding:"13px 16px",marginBottom:20,boxShadow:shadow}}>
      <p style={{color:T.muted,fontSize:11,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 6px"}}>Inviter des amis</p>
      <p style={{color:T.text,fontSize:12,lineHeight:1.6,margin:0}}>
        Copie l'URL depuis ta <strong>barre d'adresse</strong> (commence par <span style={{color:T.accent}}>github.io/…</span>) et envoie-la. Ils créent un compte et apparaissent ici automatiquement.
      </p>
    </div>

    {loading&&<div style={{textAlign:"center",padding:48,color:T.muted}}>Chargement…</div>}
    {!loading&&entries.length===0&&(
      <div style={{textAlign:"center",padding:48}}>
        <p style={{color:T.muted,fontSize:14}}>Aucun score pour l'instant.</p>
        <p style={{color:T.faint,fontSize:13,marginTop:6}}>Saisis tes habitudes et enregistre pour apparaître ici.</p>
      </div>
    )}

    {/* ── PODIUM top 3 ── */}
    {!loading&&top3.length>0&&(
      <div style={{marginBottom:20}}>
        <div style={{fontSize:9,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:T.muted,marginBottom:12}}>Classement</div>

        {/* Podium visual */}
        {top3.length>=2&&<div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:8,marginBottom:16,height:100}}>
          {/* 2nd */}
          {top3[1]&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:1}}>
            <Avatar name={top3[1].name} userId={top3[1].userId} email={top3[1].email} size={36}/>
            <span style={{fontSize:10,fontWeight:600,color:T.muted,maxWidth:60,textAlign:"center",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{top3[1].name.split(" ")[0]}</span>
            <div style={{width:"100%",background:"rgba(0,0,0,0.06)",borderRadius:"8px 8px 0 0",height:50,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:16,fontWeight:800,color:T.muted}}>2</span>
            </div>
          </div>}
          {/* 1st */}
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:1}}>
            <div style={{fontSize:18,lineHeight:1}}>🥇</div>
            <Avatar name={top3[0].name} userId={top3[0].userId} email={top3[0].email} size={42}/>
            <span style={{fontSize:10,fontWeight:700,color:T.text,maxWidth:70,textAlign:"center",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{top3[0].name.split(" ")[0]}</span>
            <div style={{width:"100%",background:T.accent,borderRadius:"8px 8px 0 0",height:68,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:18,fontWeight:800,color:"#fff"}}>{tab==="week"?top3[0].overall:top3[0].sprintAvg}%</span>
            </div>
          </div>
          {/* 3rd */}
          {top3[2]&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:1}}>
            <Avatar name={top3[2].name} userId={top3[2].userId} email={top3[2].email} size={32}/>
            <span style={{fontSize:10,fontWeight:600,color:T.muted,maxWidth:60,textAlign:"center",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{top3[2].name.split(" ")[0]}</span>
            <div style={{width:"100%",background:"rgba(0,0,0,0.06)",borderRadius:"8px 8px 0 0",height:38,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:14,fontWeight:800,color:T.muted}}>3</span>
            </div>
          </div>}
        </div>}

        {/* Full list — top 3 + rest */}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {entries.map((entry,i)=>{
            const score=tab==="week"?entry.overall:entry.sprintAvg;
            const isMe=entry.userId===user.id;
            const isExpanded=expanded===entry.userId;
            const streak=getStreak(entry);
            const movement=getMovement(entry);
            const beat=beatLastSprint(entry);

            return(
              <div key={entry.userId}
                onClick={()=>setExpanded(isExpanded?null:entry.userId)}
                style={{background:isMe?"rgba(0,122,255,0.06)":T.card,borderRadius:16,
                  border:isMe?`1.5px solid rgba(0,122,255,0.25)`:"none",
                  boxShadow:shadow,overflow:"hidden",cursor:"pointer",transition:"all 0.2s"}}>

                {/* Main row */}
                <div style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}>
                  {/* Rank */}
                  <div style={{width:24,height:24,borderRadius:8,background:i===0?"rgba(0,122,255,0.12)":i===1?"rgba(0,0,0,0.05)":i===2?"rgba(255,149,0,0.1)":"transparent",
                    display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    <span style={{fontSize:i<3?14:11,fontWeight:700,color:i===0?T.accent:i===1?T.muted:i===2?T.amber:T.faint}}>
                      {i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}
                    </span>
                  </div>

                  {/* Avatar */}
                  <Avatar name={entry.name} userId={entry.userId} email={entry.email} size={34}/>

                  {/* Name + badges */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <span style={{fontSize:14,fontWeight:600,color:T.text,letterSpacing:-0.2}}>{entry.name}</span>
                      {isMe&&<span style={{fontSize:9,color:T.accent,background:"rgba(0,122,255,0.1)",padding:"2px 7px",borderRadius:10,fontWeight:700}}>toi</span>}
                      {streak>=3&&<span style={{fontSize:9,color:T.green,background:"rgba(48,209,88,0.1)",padding:"2px 7px",borderRadius:10,fontWeight:700}}>🔥 {streak} sem.</span>}
                      {beat&&<span style={{fontSize:9,color:T.green,background:"rgba(48,209,88,0.1)",padding:"2px 7px",borderRadius:10,fontWeight:700}}>↑ record</span>}
                    </div>
                    <div style={{fontSize:11,color:T.muted,marginTop:2}}>
                      {tab==="sprint"?`${entry.weeksLogged||0} sem. saisies`:`S${wk}`}
                    </div>
                  </div>

                  {/* Score + movement */}
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                    <span style={{fontSize:22,fontWeight:800,color:scoreColor(score),letterSpacing:-1}}>{score}%</span>
                    {movement!==null&&<span style={{fontSize:10,fontWeight:600,color:movement>0?T.green:movement<0?T.red:T.muted}}>
                      {movement>0?`↑ +${movement}pp`:movement<0?`↓ ${movement}pp`:"→"}
                    </span>}
                  </div>

                  {/* Expand chevron */}
                  <div style={{color:T.muted,fontSize:14,transform:isExpanded?"rotate(180deg)":"rotate(0)",transition:"transform 0.2s",marginLeft:4}}>⌄</div>
                </div>

                {/* Expanded: category breakdown */}
                {isExpanded&&<div style={{padding:"0 16px 16px",borderTop:`1px solid ${T.border}`}}>
                  <div style={{paddingTop:12,display:"flex",flexDirection:"column",gap:8}}>
                    <div style={{fontSize:9,fontWeight:600,letterSpacing:1.2,textTransform:"uppercase",color:T.muted,marginBottom:4}}>
                      Score par catégorie · poids visible, objectifs privés
                    </div>
                    {activeCats.map(cat=>{
                      const catScore=tab==="week"?entry.byCat?.[cat.id]:null;
                      const catWeight=(sprint.catWeights||{})[cat.id]||0;
                      if(catScore===null||catScore===undefined)return null;
                      return(
                        <div key={cat.id}>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                            <div style={{width:6,height:6,borderRadius:3,background:cat.color,flexShrink:0}}/>
                            <span style={{fontSize:12,color:T.text,fontWeight:500,flex:1}}>{cat.name}</span>
                            <span style={{fontSize:10,color:T.muted}}>{catWeight}%</span>
                            <span style={{fontSize:12,fontWeight:700,color:scoreColor(catScore),minWidth:36,textAlign:"right"}}>{catScore}%</span>
                          </div>
                          <div style={{height:4,background:"rgba(0,0,0,0.06)",borderRadius:2,marginLeft:14}}>
                            <div style={{height:"100%",borderRadius:2,background:barColor(catScore),width:`${catScore}%`,transition:"width 0.5s"}}/>
                          </div>
                        </div>
                      );
                    })}
                    {tab==="sprint"&&entry.weekScores&&(
                      <div style={{marginTop:8}}>
                        <div style={{fontSize:9,fontWeight:600,letterSpacing:1.2,textTransform:"uppercase",color:T.muted,marginBottom:8}}>Progression du sprint</div>
                        <div style={{display:"flex",alignItems:"flex-end",gap:3,height:40}}>
                          {Array.from({length:wk},(_,i)=>{
                            const s=entry.weekScores[i+1];
                            return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                              <div style={{width:"100%",height:s!==undefined?`${Math.max((s/100)*34,2)}px`:"2px",
                                background:s!==undefined?barColor(s):"rgba(0,0,0,0.06)",borderRadius:"2px 2px 0 0",minHeight:2}}/>
                              <span style={{fontSize:6.5,color:T.muted}}>S{i+1}</span>
                            </div>;
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                </div>}
              </div>
            );
          })}
        </div>
      </div>
    )}
  </Scroll>;
}

// ── DUELS ──
function DuelsView({user,sprint}){
  const [myDuels,setMyDuels]=useState([]);
  const [users,setUsers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [creating,setCreating]=useState(false);
  const [form,setForm]=useState({opponentId:"",type:"overall",catId:"health",wk:weekNum(sprint.startDate)});
  const [msg,setMsg]=useState(null);
  const wk=weekNum(sprint.startDate);

  async function load(){
    setLoading(true);
    const [idx,duelsData]=await Promise.all([
      sg("userIndex"),
      sg(`duels_${sprint.id}`),
    ]);
    setUsers((idx||[]).filter(u=>u.id!==user.id));
    const all=duelsData||[];
    setMyDuels(all.filter(d=>d.challengerId===user.id||d.opponentId===user.id));
    setLoading(false);
  }

  useEffect(()=>{load();},[sprint]);

  async function createDuel(){
    if(!form.opponentId)return;
    const duelId=uid();
    const newDuel={
      id:duelId,
      challengerId:user.id,
      challengerName:user.name,
      opponentId:form.opponentId,
      opponentName:users.find(u=>u.id===form.opponentId)?.name||"",
      type:form.type, // "overall" or "category"
      catId:form.type==="category"?form.catId:null,
      week:wk,
      status:"pending", // pending → active → completed
      createdAt:Date.now(),
    };
    const all=await sg(`duels_${sprint.id}`)||[];
    await ss(`duels_${sprint.id}`,[...all,newDuel]);
    setCreating(false);
    setMsg("Défi envoyé ! En attente d'acceptation.");
    setTimeout(()=>setMsg(null),3000);
    load();
  }

  async function respondDuel(duelId,accept){
    const all=await sg(`duels_${sprint.id}`)||[];
    const updated=all.map(d=>d.id===duelId?{...d,status:accept?"active":"declined"}:d);
    await ss(`duels_${sprint.id}`,updated);
    setMsg(accept?"Défi accepté ! C'est parti 🔥":"Défi refusé.");
    setTimeout(()=>setMsg(null),3000);
    load();
  }

  // Resolve duel result from social scores
  async function resolveDuel(duel){
    const wkData=await sg(`social_${sprint.id}_w${duel.week}`)||[];
    const cEntry=wkData.find(e=>e.userId===duel.challengerId);
    const oEntry=wkData.find(e=>e.userId===duel.opponentId);
    const getScore=(entry)=>{
      if(!entry)return null;
      if(duel.type==="category")return entry.byCat?.[duel.catId]??null;
      return entry.overall??null;
    };
    const cs=getScore(cEntry);const os=getScore(oEntry);
    if(cs===null||os===null)return null;
    return{challengerScore:cs,opponentScore:os,winner:cs>os?duel.challengerId:os>cs?duel.opponentId:"tie"};
  }

  const pending=myDuels.filter(d=>d.status==="pending"&&d.opponentId===user.id);
  const active=myDuels.filter(d=>d.status==="active"&&d.week===wk);
  const past=myDuels.filter(d=>d.status==="active"&&d.week<wk||d.status==="completed");
  const activeCats=CATS.filter(c=>sprint.habits.some(h=>h.catId===c.id&&!h.isBonus));

  function DuelCard({duel,resolved}){
    const isChallenger=duel.challengerId===user.id;
    const opponent=isChallenger?duel.opponentName:duel.challengerName;
    const myScore=resolved?isChallenger?resolved.challengerScore:resolved.opponentScore:null;
    const theirScore=resolved?isChallenger?resolved.opponentScore:resolved.challengerScore:null;
    const iWon=resolved&&resolved.winner===user.id;
    const tie=resolved&&resolved.winner==="tie";
    const cat=duel.catId?CATS.find(c=>c.id===duel.catId):null;
    return(
      <div style={{background:T.card,borderRadius:16,boxShadow:shadow,overflow:"hidden"}}>
        <div style={{padding:"14px 16px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{fontSize:20}}>{duel.type==="category"?"🎯":"⚔️"}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:T.text}}>
                {isChallenger?"Tu as défié":"Défi reçu de"} <span style={{color:T.accent}}>{opponent}</span>
              </div>
              <div style={{fontSize:11,color:T.muted,marginTop:2}}>
                {duel.type==="category"?`Catégorie : ${cat?.name||duel.catId}`:"Score global"}
                {" · "}Semaine {duel.week}
              </div>
            </div>
            {resolved&&(
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:11,fontWeight:700,color:iWon?T.green:tie?T.amber:T.red}}>
                  {iWon?"🏆 Gagné":tie?"🤝 Égalité":"💪 Perdu"}
                </div>
              </div>
            )}
          </div>

          {/* Scores */}
          {resolved&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:8,alignItems:"center",background:"rgba(0,0,0,0.03)",borderRadius:12,padding:"10px 14px"}}>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:10,color:T.muted,marginBottom:4}}>Toi</div>
                <div style={{fontSize:24,fontWeight:800,color:iWon?T.green:T.text,letterSpacing:-1}}>{myScore}%</div>
              </div>
              <div style={{fontSize:14,color:T.muted,fontWeight:600}}>vs</div>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:10,color:T.muted,marginBottom:4}}>{opponent}</div>
                <div style={{fontSize:24,fontWeight:800,color:!iWon&&!tie?T.green:T.text,letterSpacing:-1}}>{theirScore}%</div>
              </div>
            </div>
          )}

          {/* Active — in progress */}
          {!resolved&&duel.status==="active"&&(
            <div style={{background:"rgba(0,122,255,0.06)",borderRadius:10,padding:"10px 12px",display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:6,height:6,borderRadius:3,background:T.accent,animation:"pulse 1.5s infinite"}}/>
              <span style={{fontSize:12,color:T.accent,fontWeight:500}}>En cours · résultat à la fin de la semaine {duel.week}</span>
            </div>
          )}

          {/* Pending — awaiting response */}
          {duel.status==="pending"&&duel.opponentId===user.id&&(
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button onClick={()=>respondDuel(duel.id,false)}
                style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:"rgba(255,59,48,0.1)",color:T.red,fontWeight:600,fontSize:13,cursor:"pointer"}}>
                Refuser
              </button>
              <button onClick={()=>respondDuel(duel.id,true)}
                style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:T.accent,color:"#fff",fontWeight:600,fontSize:13,cursor:"pointer"}}>
                Accepter 🔥
              </button>
            </div>
          )}
          {duel.status==="pending"&&duel.challengerId===user.id&&(
            <div style={{background:"rgba(0,0,0,0.04)",borderRadius:10,padding:"9px 12px"}}>
              <span style={{fontSize:12,color:T.muted}}>⏳ En attente d'acceptation…</span>
            </div>
          )}
          {duel.status==="declined"&&(
            <div style={{background:"rgba(255,59,48,0.06)",borderRadius:10,padding:"9px 12px"}}>
              <span style={{fontSize:12,color:T.red}}>Défi refusé</span>
            </div>
          )}
        </div>
      </div>
    );
  }

  return <Scroll>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
      <div>
        <h2 style={{fontSize:20,fontWeight:800,color:T.text,margin:"0 0 2px",letterSpacing:-0.3}}>Duels</h2>
        <p style={{color:T.muted,fontSize:13,margin:0}}>Défie tes amis cette semaine</p>
      </div>
      {!creating&&<button onClick={()=>setCreating(true)}
        style={{background:T.accent,color:"#fff",border:"none",borderRadius:12,padding:"9px 16px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
        + Nouveau défi
      </button>}
    </div>

    {msg&&<div style={{background:"rgba(48,209,88,0.1)",borderRadius:12,padding:"11px 14px",marginBottom:16}}>
      <p style={{margin:0,fontSize:13,color:T.green,fontWeight:500}}>{msg}</p>
    </div>}

    {/* Create duel form */}
    {creating&&<div style={{background:T.card,borderRadius:18,padding:"18px 16px",marginBottom:20,boxShadow:shadow}}>
      <div style={{fontSize:13,fontWeight:700,color:T.text,marginBottom:16}}>Nouveau défi</div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div>
          <label style={{fontSize:10,fontWeight:600,letterSpacing:1,textTransform:"uppercase",color:T.muted,display:"block",marginBottom:6}}>Adversaire</label>
          <select value={form.opponentId} onChange={e=>setForm(p=>({...p,opponentId:e.target.value}))} style={{...iSx}}>
            <option value="">Choisir un adversaire…</option>
            {users.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
        </div>
        <div>
          <label style={{fontSize:10,fontWeight:600,letterSpacing:1,textTransform:"uppercase",color:T.muted,display:"block",marginBottom:6}}>Type de défi</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[["overall","⚔️ Score global"],["category","🎯 Catégorie"]].map(([t,l])=>(
              <button key={t} onClick={()=>setForm(p=>({...p,type:t}))}
                style={{padding:"11px 8px",border:"none",borderRadius:12,cursor:"pointer",
                  background:form.type===t?T.accent:"rgba(0,0,0,0.05)",
                  color:form.type===t?"#fff":T.text,fontWeight:600,fontSize:13}}>
                {l}
              </button>
            ))}
          </div>
        </div>
        {form.type==="category"&&<div>
          <label style={{fontSize:10,fontWeight:600,letterSpacing:1,textTransform:"uppercase",color:T.muted,display:"block",marginBottom:6}}>Catégorie</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {activeCats.map(cat=>(
              <button key={cat.id} onClick={()=>setForm(p=>({...p,catId:cat.id}))}
                style={{padding:"7px 12px",border:"none",borderRadius:10,cursor:"pointer",
                  background:form.catId===cat.id?cat.color:"rgba(0,0,0,0.05)",
                  color:form.catId===cat.id?"#fff":T.text,fontWeight:600,fontSize:12}}>
                {cat.name}
              </button>
            ))}
          </div>
        </div>}
        <div style={{background:"rgba(0,122,255,0.07)",borderRadius:10,padding:"10px 12px"}}>
          <p style={{margin:0,fontSize:12,color:T.accent,lineHeight:1.5}}>
            {form.type==="category"
              ? `🎯 Le score en ${CATS.find(c=>c.id===form.catId)?.name||""} de la semaine ${wk} sera comparé. Meilleur score gagne.`
              : `⚔️ Le score global de la semaine ${wk} sera comparé. Meilleur score gagne.`}
          </p>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setCreating(false)}
            style={{flex:1,padding:"11px",borderRadius:12,border:"none",background:"rgba(0,0,0,0.06)",color:T.muted,fontWeight:600,fontSize:13,cursor:"pointer"}}>
            Annuler
          </button>
          <button onClick={createDuel} disabled={!form.opponentId}
            style={{flex:2,padding:"11px",borderRadius:12,border:"none",
              background:form.opponentId?T.accent:"rgba(0,0,0,0.06)",
              color:form.opponentId?"#fff":T.muted,fontWeight:700,fontSize:13,cursor:form.opponentId?"pointer":"not-allowed"}}>
            Envoyer le défi 🔥
          </button>
        </div>
      </div>
    </div>}

    {/* Pending challenges to accept */}
    {pending.length>0&&<div style={{marginBottom:20}}>
      <div style={{fontSize:9,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:T.red,marginBottom:10}}>
        🔔 {pending.length} défi{pending.length>1?"s":""} en attente
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {pending.map(d=><DuelCard key={d.id} duel={d} resolved={null}/>)}
      </div>
    </div>}

    {/* Active this week */}
    {active.filter(d=>d.status==="active").length>0&&<div style={{marginBottom:20}}>
      <div style={{fontSize:9,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:T.accent,marginBottom:10}}>
        ⚔️ En cours — semaine {wk}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {active.filter(d=>d.status==="active").map(d=><DuelCard key={d.id} duel={d} resolved={null}/>)}
      </div>
    </div>}

    {/* Past duels */}
    {past.length>0&&<div style={{marginBottom:20}}>
      <div style={{fontSize:9,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:T.muted,marginBottom:10}}>Historique</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {past.map(d=>{
          const [resolved,setResolved]=useState(null);
          useEffect(()=>{resolveDuel(d).then(setResolved);},[]);
          return <DuelCard key={d.id} duel={d} resolved={resolved}/>;
        })}
      </div>
    </div>}

    {!loading&&myDuels.length===0&&!creating&&(
      <div style={{textAlign:"center",padding:"40px 20px"}}>
        <div style={{fontSize:40,marginBottom:12}}>⚔️</div>
        <p style={{color:T.text,fontSize:15,fontWeight:600,marginBottom:6}}>Aucun défi en cours</p>
        <p style={{color:T.muted,fontSize:13}}>Lance le premier défi de la semaine !</p>
      </div>
    )}
  </Scroll>;
}


// ── PROFILE ──
function ProfilView({user,sprint,weekJournals,onJournalout}){
  const [history,setHistory]=useState([]);
  useEffect(()=>{(async()=>{const h=await sg(`sprint_history_${user.id}`)||[];setHistory(h.reverse());})();},[user.id]);
  const wk=sprint?weekNum(sprint.startDate):0;
  const{overall}=sprint?calcScores(sprint.habits,weekJournals[wk]||{}):{overall:0};
  const memberSince=new Date(user.createdAt).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  const allAvgs=history.map(s=>s.avgScore).filter(Boolean);
  const lifetimeAvg=allAvgs.length?Math.round(allAvgs.reduce((a,b)=>a+b,0)/allAvgs.length):null;
  return <Scroll>
    <div style={{background:T.card,borderRadius:22,boxShadow:shadow,padding:"24px 20px",marginBottom:16,textAlign:"center"}}>
      <div style={{display:"none"}}>{initials(user.name)}</div>

    </div>}
    {history.length>0&&<div style={{background:T.card,borderRadius:18,boxShadow:shadow,padding:"16px 18px",marginBottom:16}}>

        <div key={sp.sprintId} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderTop:i>0?`1px solid ${T.border}`:"none"}}>

          <div style={{fontSize:16,fontWeight:800,color:scoreColor(sp.avgScore),minWidth:40,textAlign:"right"}}>{sp.avgScore}%</div>
        </div>
      ))}
    </div>}
    <Btn full variant="danger" onClick={onJournalout}>Se déconnecter</Btn>
  </Scroll>;
}
