// Storage helpers - all shared via Firebase
function dbKey(k) { return k.replace(/[.#$\[\]]/g,"_"); }
async function sg(k) {
  try {
    if (window._fbOk) {
      var snap = await window._db.ref(dbKey(k)).once("value");
      return snap.exists() ? snap.val() : null;
    }
    var v = localStorage.getItem(k);
    return v ? JSON.parse(v) : null;
  } catch(e) { console.warn("sg",k,e.message); return null; }
}
async function ss(k, v) {
  try {
    if (window._fbOk) {
      await window._db.ref(dbKey(k)).set(v === null ? null : v);
      return;
    }
    if (v === null) localStorage.removeItem(k);
    else localStorage.setItem(k, JSON.stringify(v));
  } catch(e) { console.warn("ss",k,e.message); }
}

// ── UTILS ──
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h<<5)+h)^s.charCodeAt(i);
  return (h>>>0).toString(16);
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function weekNum(sd) {
  const start = new Date(sd);
  const toMon = d => { const day = d.getDay()===0?6:d.getDay()-1; return new Date(d.getFullYear(),d.getMonth(),d.getDate()-day); };
  const weeks = Math.round((toMon(new Date())-toMon(start))/(7*24*60*60*1000))+1;
  return Math.min(Math.max(weeks,1),12);
}

function scoreOne(raw, h) {
  if (raw===null||raw===undefined||raw==="") return 0;
  const v = h.type==="boolean" ? (raw?1:0) : Math.max(parseFloat(raw)||0,0);
  const t = Math.max(parseFloat(h.target)||1,0.001);
  return h.targetType==="max" ? Math.min(t/Math.max(v,0.001),1) : Math.min(v/t,1);
}

function calcScores(habits, logs) {
  const reg = (habits||[]).filter(h=>!h.isBonus);
  const bon = (habits||[]).filter(h=>h.isBonus);
  let tW=0, tS=0;
  const byCat = {};
  const CATS_IDS = ["health","growth","career","finance","social","fun"];
  CATS_IDS.forEach(id => {
    const ch = reg.filter(h=>h.catId===id && (parseFloat(h.weight)||0)>0);
    if (!ch.length) { byCat[id]=null; return; }
    let cW=0, cS=0;
    ch.forEach(h => { const w=parseFloat(h.weight)||0, s=scoreOne((logs||{})[h.id],h); cW+=w; cS+=w*s; tW+=w; tS+=w*s; });
    byCat[id] = cW>0 ? Math.round((cS/cW)*100) : 0;
  });
  const regScore = tW>0 ? Math.round((tS/tW)*100) : 0;
  let bonusScore = 0;
  bon.forEach(h => { bonusScore += scoreOne((logs||{})[h.id],h)*5; });
  return {overall:Math.min(regScore+Math.round(bonusScore),100), byCat, regScore, bonusScore:Math.round(bonusScore)};
}

function sprintAvg(habits, weekLogs, upTo, paused=[]) {
  let sum=0, count=0;
  for (let w=1; w<=upTo; w++) {
    if (paused.includes(w)) continue;
    const ll = weekLogs[w]||{};
    if (!habits.some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!=="")) continue;
    sum += calcScores(habits,ll).overall; count++;
  }
  return count ? Math.round(sum/count) : 0;
}

function catAvgs(habits, weekLogs, upTo, paused=[]) {
  const sums={}, counts={};
  for (let w=1; w<=upTo; w++) {
    if (paused.includes(w)) continue;
    const ll = weekLogs[w]||{};
    if (!habits.some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!=="")) continue;
    const {byCat} = calcScores(habits,ll);
    Object.keys(byCat).forEach(id => {
      if (byCat[id]!==null) { sums[id]=(sums[id]||0)+byCat[id]; counts[id]=(counts[id]||0)+1; }
    });
  }
  const res={};
  ["health","growth","career","finance","social","fun"].forEach(id => {
    res[id] = counts[id] ? Math.round(sums[id]/counts[id]) : null;
  });
  return res;
}

// ── RADAR CHART ──
function RadarChart({cats, datasets}) {
  const n = cats.length;
  if (n < 3) return null;
  // Asymmetric viewBox: extra space on right (for INTELLECT/CARRIERE labels)
  // and left (for SOCIAL/FUN). Center polygon at (210,200) in a 480x400 canvas.
  const VBW=480, VBH=400, cx=210, cy=200, R=110, LR=150;
  const angle = (i) => (i/n)*2*Math.PI - Math.PI/2;
  const pt = (a, v) => [cx+R*Math.cos(a)*v/100, cy+R*Math.sin(a)*v/100];
  const angles = cats.map((_,i)=>angle(i));
  const displayW = typeof window!=="undefined" ? Math.min(window.innerWidth-48, 460) : 400;
  const displayH = Math.round(displayW * VBH/VBW);
  return (
    <svg width={displayW} height={displayH} viewBox={`0 0 ${VBW} ${VBH}`}>
      {[25,50,75,100].map(lv=>{
        const pts = angles.map(a=>pt(a,lv));
        return <polygon key={lv} points={pts.map(p=>p.join(",")).join(" ")} fill="none" stroke="rgba(0,0,0,0.08)" strokeWidth={lv===100?1:0.5}/>;
      })}
      {angles.map((a,i)=>{ const [x,y]=pt(a,100); return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(0,0,0,0.08)" strokeWidth={0.5}/>; })}
      {datasets.map((ds,di)=>{
        const pts = angles.map((a,i)=>pt(a,ds.values[i]||0));
        return <g key={di}>
          <polygon points={pts.map(p=>p.join(",")).join(" ")} fill={ds.color+"22"} stroke={ds.color} strokeWidth={1.5}/>
          {pts.map(([x,y],i)=><circle key={i} cx={x} cy={y} r={4} fill={ds.color}/>)}
        </g>;
      })}
      {angles.map((a,i)=>{
        const a2 = angle(i);
        const lx = cx + LR*Math.cos(a2);
        const ly = cy + LR*Math.sin(a2);
        const anchor = Math.cos(a2)>0.15?"start":Math.cos(a2)<-0.15?"end":"middle";
        const label = (cats[i].radar||cats[i].name).toUpperCase();
        return <text key={i} x={lx} y={ly} textAnchor={anchor} fontSize={17} fill={cats[i].color} dominantBaseline="middle" fontWeight="700">{label}</text>;
      })}
    </svg>
  );
}

  const [slide, setSlide] = useState(0);
  const s = ONBOARDING[slide];
  const isLast = slide===ONBOARDING.length-1;
  return (
    <div style={{minHeight:"100vh",background:T.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 24px"}}>
      <div style={{display:"flex",gap:6,marginBottom:40}}>
        {ONBOARDING.map((_,i)=><div key={i} style={{width:i===slide?20:6,height:6,borderRadius:3,background:i===slide?T.accent:i<slide?T.accent+"55":T.faint,transition:"all 0.3s"}}/>)}
      </div>
      <div style={{width:"100%",maxWidth:400,textAlign:"center"}}>
        <div style={{fontSize:60,marginBottom:24}}>{s.emoji}</div>
        <h1 style={{color:T.text,fontSize:22,fontWeight:800,margin:"0 0 14px",lineHeight:1.2}}>{s.title}</h1>
        <p style={{color:T.text,fontSize:14,lineHeight:1.7,margin:"0 0 10px"}}>{s.body}</p>
        <p style={{color:T.muted,fontSize:13,lineHeight:1.6,margin:"0 0 32px"}}>{s.sub}</p>
        <Btn full onClick={()=>isLast?onDone():setSlide(i=>i+1)}>
          {slide===0?`Salut ${name.split(" ")[0]}, ${s.cta}`:s.cta}
        </Btn>
        {slide>0&&<button onClick={()=>setSlide(i=>i-1)} style={{marginTop:12,background:"none",border:"none",color:T.faint,fontSize:13,cursor:"pointer"}}>← Retour</button>}
      </div>
    </div>
  );
}

// ── AUTH ──
function AuthView({onAuth}) {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit() {
    if (busy) return;
    setErr("");
    if (mode==="register"&&!name.trim()) { setErr("Merci d'entrer ton nom."); return; }
    if (!email.trim()) { setErr("Merci d'entrer ton email."); return; }
    if (!password) { setErr("Merci d'entrer un mot de passe."); return; }
    if (mode==="register"&&password.length<6) { setErr("Mot de passe : 6 caractères minimum."); return; }
    setBusy(true);
    try {
      const em = email.trim().toLowerCase();
      if (mode==="register") {
        const idx = (await sg("userIndex"))||[];
        if (idx.find(u=>u.email===em)) { setErr("Email déjà enregistré."); setBusy(false); return; }
        const user = {id:uid(), name:name.trim(), email:em, passwordHash:hashStr(password), createdAt:Date.now(), isNew:true};
        await ss(`user_${user.id}`, user);
        await ss("userIndex", [...idx, {id:user.id,email:user.email,name:user.name}]);
        onAuth(user);
      } else {
        const idx = (await sg("userIndex"))||[];
        const found = idx.find(u=>u.email===em);
        if (!found) { setErr("Aucun compte avec cet email."); setBusy(false); return; }
        const user = await sg(`user_${found.id}`);
        if (!user||user.passwordHash!==hashStr(password)) { setErr("Mot de passe incorrect."); setBusy(false); return; }
        onAuth(user);
      }
    } catch(e) { setErr("Erreur: "+e.message); }
    setBusy(false);
  }

  return (
    <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 20px"}}>
      <div style={{width:"100%",maxWidth:400}}>
        <div style={{textAlign:"center",marginBottom:36}}>
          <div style={{width:60,height:60,borderRadius:18,background:T.text,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",fontSize:24,fontWeight:800,color:"#fff"}}>M</div>
          <h1 style={{color:T.text,fontSize:26,fontWeight:800,margin:0}}>Momentum</h1>
          <p style={{color:T.muted,margin:"8px 0 0",fontSize:14}}>Construis la vie que tu veux, un sprint à la fois.</p>
        </div>
        <div style={{display:"flex",background:"rgba(0,0,0,0.06)",borderRadius:14,padding:4,marginBottom:24}}>
          {[["login","Se connecter"],["register","Créer un compte"]].map(([m,l])=>(
            <button key={m} onClick={()=>{setMode(m);setErr("");}} style={{flex:1,padding:"9px 0",border:"none",borderRadius:10,cursor:"pointer",background:mode===m?T.card:"transparent",color:mode===m?T.text:T.muted,fontSize:14,fontWeight:600,boxShadow:mode===m?SH:"none",transition:"all 0.2s"}}>{l}</button>
          ))}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {mode==="register"&&<Inp label="Nom complet" value={name} onChange={e=>setName(e.target.value)} placeholder="Ton prénom et nom"/>}
          <Inp label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="toi@exemple.com"/>
          <Inp label="Mot de passe" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••"/>
          {err&&<Notice color={T.red}>{err}</Notice>}
          <button onClick={submit} disabled={busy} style={{background:busy?T.faint:T.accent,color:"#fff",border:"none",borderRadius:12,fontWeight:700,fontSize:15,padding:"13px",cursor:busy?"not-allowed":"pointer",opacity:busy?0.7:1}}>
            {busy?"Patiente…":mode==="login"?"Se connecter":"Créer mon compte"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── HABIT FORM ──
function HabitForm({habit, cat, remaining, onChange, onSave, onCancel, saveLabel="Enregistrer"}) {
  const set = (k,v) => onChange(h=>({...h,[k]:v}));
  const isBool = habit.type==="boolean";
  const canSave = habit.name.trim() && (isBool||habit.target!=="") && (parseFloat(habit.weight)||0)>0;
  return (
    <div style={{background:T.bg,border:`1px solid ${T.accent}44`,borderRadius:14,padding:16,display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"grid",gridTemplateColumns:cat.subs?"1fr 1fr":"1fr",gap:10}}>
        <Inp label="Nom" value={habit.name} placeholder="ex: Séances de sport" onChange={e=>set("name",e.target.value)}/>
        {cat.subs&&<Sel label="Sous-catégorie" value={habit.subCat||cat.subs[0]} onChange={e=>set("subCat",e.target.value)} options={cat.subs.map(s=>({value:s,label:s}))}/>}
      </div>
      <Sel label="Type de métrique" value={habit.type} onChange={e=>set("type",e.target.value)} options={HABIT_TYPES.map(t=>({value:t.id,label:t.label}))}/>
      {!isBool&&<>
        <Sel label="Direction" value={habit.targetType} onChange={e=>set("targetType",e.target.value)} options={[{value:"min",label:"Au moins (minimum)"},{value:"max",label:"Au plus (maximum)"}]}/>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10}}>
          <Inp label="Objectif" type="number" value={habit.target} placeholder="ex: 4" onChange={e=>set("target",e.target.value)}/>
          <Inp label="Unité" value={habit.unit} placeholder="hrs" onChange={e=>set("unit",e.target.value)}/>
        </div>
      </>}
      <div>
        <label style={{fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:0.6,fontWeight:600,display:"block",marginBottom:5}}>
          Poids % <span style={{fontWeight:400,letterSpacing:0,textTransform:"none",color:T.faint,fontSize:10}}>(budget restant: {Math.max(0,remaining).toFixed(0)}%)</span>
        </label>
        <input type="number" min={0} step={0.5} value={habit.weight} placeholder={Math.max(0,remaining).toFixed(0)} onChange={e=>set("weight",e.target.value)} style={{...ISX}}/>
      </div>
      <div style={{display:"flex",gap:8}}>
        <Btn variant="ghost" small onClick={onCancel}>Annuler</Btn>
        <Btn small full disabled={!canSave} onClick={onSave}>{saveLabel}</Btn>
      </div>
    </div>
  );
}

// ── SPRINT SETUP ──
function SprintSetupView({user, onDone, isFirstSprint=false}) {
  const [step, setStep] = useState(0);
  const [catW, setCatW] = useState({health:25,growth:20,career:20,finance:15,social:10,fun:10});
  const [habits, setHabits] = useState({});
  const [catIdx, setCatIdx] = useState(0);
  const [formOpen, setFormOpen] = useState(false);
  const [draft, setDraft] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [bonus, setBonus] = useState(null);
  const [bonusForm, setBonusForm] = useState(false);
  const [bonusDraft, setBonusDraft] = useState(null);
  const [saving, setSaving] = useState(false);

  const activeCats = CATS.filter(c=>(parseFloat(catW[c.id])||0)>0);
  const totalW = Object.values(catW).reduce((a,v)=>a+(parseFloat(v)||0),0);
  const weightOk = Math.abs(totalW-100)<0.6;
  const usedW = (catId) => (habits[catId]||[]).filter(h=>!h.isBonus).reduce((a,h)=>a+(parseFloat(h.weight)||0),0);

  function openNew(cat, remaining) {
    setDraft({id:uid(),catId:cat.id,subCat:cat.subs?.[0]||"",name:"",type:"numeric",targetType:"min",target:"",unit:"",weight:Math.max(0,remaining).toFixed(0)});
    setFormOpen(true); setEditingId(null);
  }
  function openTemplate(cat, t, remaining) {
    setDraft({...t, id:uid(), catId:cat.id, subCat:t.subCat||cat.subs?.[0]||"", weight:remaining>0?Math.max(0,remaining).toFixed(0):t.weight.toString()});
    setFormOpen(true); setEditingId(null);
  }
  function openEdit(h, remaining) {
    setDraft({...h}); setFormOpen(true); setEditingId(h.id);
  }
  function saveForm(cat) {
    if (editingId) {
      setHabits(p=>({...p,[cat.id]:p[cat.id].map(h=>h.id===editingId?{...draft,weight:parseFloat(draft.weight)||0}:h)}));
    } else {
      setHabits(p=>({...p,[cat.id]:[...(p[cat.id]||[]),{...draft,id:uid()}]}));
    }
    setDraft(null); setFormOpen(false); setEditingId(null);
  }
  async function launch() {
    setSaving(true);
    const allH = CATS.flatMap(c=>habits[c.id]||[]);
    if (bonus) allH.push(bonus);
    const sprint = {id:uid(),userId:user.id,startDate:new Date().toISOString().split("T")[0],habits:allH,catWeights:catW,pausedWeeks:[],createdAt:Date.now()};
    await ss(`sprint_${user.id}`, sprint);
    setSaving(false); onDone(sprint);
  }

  // Step 0 — weights
  if (step===0) return (
    <Scroll>
      <h2 style={{fontSize:20,fontWeight:800,color:T.text,margin:"0 0 4px"}}>Configuration du sprint</h2>
      <p style={{color:T.muted,fontSize:13,margin:"0 0 16px"}}>Étape 1 sur 3 — répartis ton attention</p>
      <Card style={{marginBottom:16}}>
        <p style={{color:T.text,fontSize:13,lineHeight:1.65,margin:0}}>
          Assigne un <strong style={{color:T.accent}}>pourcentage</strong> à chaque catégorie. Tout doit faire <strong style={{color:T.green}}>exactement 100%</strong>. Mets 0% pour ignorer une catégorie.
        </p>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
        {CATS.map(cat=>(
          <div key={cat.id} style={{background:T.card,borderRadius:14,boxShadow:SH,padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:10,height:10,borderRadius:3,background:cat.color,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{color:T.text,fontSize:14,fontWeight:600}}>{cat.name}</div>
              <div style={{color:T.muted,fontSize:11,marginTop:2,lineHeight:1.4}}>{cat.desc.slice(0,60)}…</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <input type="number" min={0} max={100} step={1} value={catW[cat.id]??0} onChange={e=>setCatW(p=>({...p,[cat.id]:Math.min(100,Math.max(0,parseFloat(e.target.value)||0))}))} style={{...ISX,width:58,textAlign:"center",fontWeight:700,padding:"6px"}}/>
              <span style={{color:T.muted,fontSize:13}}>%</span>
            </div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span style={{color:T.muted}}>Total :</span>
        <span style={{fontSize:20,fontWeight:800,color:weightOk?T.green:T.red}}>{totalW.toFixed(0)}%</span>
      </div>
      <Btn full disabled={!weightOk} onClick={()=>setStep(1)}>Définir les habitudes →</Btn>
    </Scroll>
  );

  // Step 1 — habits per category
  if (step===1) {
    const cat = activeCats[catIdx];
    if (!cat) { setStep(2); return null; }
    const catH = habits[cat.id]||[];
    const regH = catH.filter(h=>!h.isBonus);
    const used = usedW(cat.id);
    const budget = parseFloat(catW[cat.id])||0;
    const remaining = budget-used;
    const usedNames = new Set(regH.map(h=>h.name));
    const tpls = (TEMPLATES[cat.id]||[]).filter(t=>!usedNames.has(t.name));
    return (
      <Scroll>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:2}}><div style={{width:12,height:12,borderRadius:3,background:cat.color}}/><h2 style={{fontSize:20,fontWeight:800,color:T.text,margin:0}}>{cat.name}</h2></div>
        <p style={{color:T.muted,fontSize:13,margin:"4px 0 12px"}}>Étape 2 sur 3</p>

        {/* Category description */}
        <div style={{background:cat.color+"12",border:`1px solid ${cat.color}33`,borderRadius:12,padding:"12px 14px",marginBottom:12}}>
          <p style={{margin:0,fontSize:13,color:T.text,lineHeight:1.6}}>{cat.desc}</p>
        </div>

        {/* First sprint guidance */}
        {isFirstSprint&&<Notice color={T.accent}>Commencer simple, c'est commencer fort — <strong>1 habitude par catégorie</strong> recommandée pour ton premier sprint.</Notice>}

        {/* Weight guidance */}
        <Card style={{marginBottom:12,padding:"12px 14px"}}>
          <p style={{margin:0,fontSize:12,color:T.muted,lineHeight:1.6}}>
            <strong style={{color:T.text}}>Budget :</strong> {budget}% — toutes tes habitudes dans cette catégorie doivent totaliser <strong style={{color:cat.color}}>{budget}%</strong>. Le poids suggéré est le budget restant.
          </p>
        </Card>

        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
          <span style={{color:T.muted,fontSize:12}}>Utilisé : <strong style={{color:remaining<0?T.red:T.text}}>{used.toFixed(0)}%</strong></span>
          <span style={{color:remaining<0?T.red:T.green,fontSize:12,fontWeight:600}}>Restant : {remaining.toFixed(0)}%</span>
        </div>
        <div style={{height:5,background:"rgba(0,0,0,0.06)",borderRadius:3,marginBottom:16}}>
          <div style={{height:"100%",borderRadius:3,background:remaining<0?T.red:cat.color,width:`${Math.min((used/budget)*100,100)}%`,transition:"width 0.3s"}}/>
        </div>

        {/* Templates */}
        {tpls.length>0&&<div style={{marginBottom:14}}>
          <p style={{color:T.muted,fontSize:11,textTransform:"uppercase",letterSpacing:0.6,margin:"0 0 8px",fontWeight:600}}>Ajout rapide — clique pour personnaliser</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {tpls.map(t=><button key={t.name} onClick={()=>openTemplate(cat,t,remaining)} style={{background:cat.color+"15",border:`1px solid ${cat.color}44`,color:cat.color,borderRadius:8,fontSize:12,padding:"6px 10px",cursor:"pointer",fontWeight:500}}>+ {t.name}</button>)}
          </div>
        </div>}

        {/* Habit list */}
        {regH.map(h=>{
          if (editingId===h.id&&formOpen) return <div key={h.id} style={{marginBottom:8}}><HabitForm habit={draft} cat={cat} remaining={remaining+(parseFloat(h.weight)||0)} onChange={setDraft} saveLabel="Mettre à jour" onSave={()=>saveForm(cat)} onCancel={()=>{setFormOpen(false);setEditingId(null);setDraft(null);}}/></div>;
          return <div key={h.id} style={{background:T.card,borderRadius:12,boxShadow:SH,padding:"11px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{color:T.text,fontSize:14,fontWeight:500}}>{h.name}</div><div style={{color:T.muted,fontSize:12,marginTop:2}}>{h.subCat&&`${h.subCat} · `}{h.type}{h.target?` · ${h.targetType==="min"?"≥":"≤"} ${h.target}${h.unit?` ${h.unit}`:""}`:""} · <strong style={{color:cat.color}}>{h.weight}%</strong></div></div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>openEdit(h,remaining+(parseFloat(h.weight)||0))} style={{background:"none",border:`1px solid ${T.faint}`,color:T.muted,borderRadius:8,padding:"7px 12px",fontSize:12,cursor:"pointer",minHeight:36}}>Modifier</button>
              <button onClick={()=>setHabits(p=>({...p,[cat.id]:p[cat.id].filter(x=>x.id!==h.id)}))} style={{background:"none",border:"none",color:T.red,cursor:"pointer",fontSize:20,padding:"0 4px"}}>×</button>
            </div>
          </div>;
        })}

        {/* Add custom */}
        {(!formOpen||editingId)&&<button onClick={()=>openNew(cat,remaining)} style={{width:"100%",padding:12,background:"transparent",border:`1.5px dashed ${T.faint}`,borderRadius:12,color:T.muted,fontSize:14,cursor:"pointer",marginTop:4}}>+ Ajouter une habitude</button>}
        {formOpen&&!editingId&&<HabitForm habit={draft} cat={cat} remaining={remaining} onChange={setDraft} onSave={()=>saveForm(cat)} onCancel={()=>{setFormOpen(false);setDraft(null);}}/>}

        <div style={{display:"flex",gap:10,marginTop:20}}>
          <Btn variant="secondary" onClick={()=>catIdx===0?setStep(0):setCatIdx(i=>i-1)}>← Retour</Btn>
          <Btn full onClick={()=>catIdx<activeCats.length-1?setCatIdx(i=>i+1):setStep(2)}>{catIdx<activeCats.length-1?`Suivant : ${activeCats[catIdx+1].name} →`:"Révision →"}</Btn>
        </div>
        <div style={{display:"flex",justifyContent:"center",gap:6,marginTop:12}}>
          {activeCats.map((c,i)=><div key={c.id} style={{width:6,height:6,borderRadius:3,background:i===catIdx?c.color:i<catIdx?T.green:T.faint,transition:"background 0.3s"}}/>)}
        </div>
      </Scroll>
    );
  }

  // Step 2 — review + bonus
  const allH = CATS.flatMap(c=>habits[c.id]||[]);
  const totalHW = allH.filter(h=>!h.isBonus).reduce((a,h)=>a+(parseFloat(h.weight)||0),0);
  const bonusCatOptions = activeCats.map(c=>({value:c.id,label:c.name}));
  return (
    <Scroll>
      <h2 style={{fontSize:20,fontWeight:800,color:T.text,margin:"0 0 4px"}}>Révision du sprint</h2>
      <p style={{color:T.muted,fontSize:13,margin:"0 0 16px"}}>Étape 3 sur 3 — confirme ton plan</p>
      <Card style={{marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{color:T.muted,fontSize:13}}>Poids total des habitudes :</span>
        <span style={{fontWeight:800,fontSize:18,color:Math.abs(totalHW-100)<2?T.green:T.amber}}>{totalHW.toFixed(0)}%</span>
      </Card>
      {CATS.filter(c=>(habits[c.id]||[]).length>0).map(cat=>{
        const reg = (habits[cat.id]||[]).filter(h=>!h.isBonus);
        return <div key={cat.id} style={{marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><div style={{width:8,height:8,borderRadius:2,background:cat.color}}/><span style={{color:cat.color,fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{cat.name}</span></div>
          {reg.map(h=><div key={h.id} style={{background:T.card,borderRadius:10,boxShadow:SH,padding:"8px 12px",marginBottom:4,display:"flex",justifyContent:"space-between"}}>
            <span style={{color:T.text,fontSize:13}}>{h.name}{h.subCat&&<span style={{color:T.muted}}> · {h.subCat}</span>}</span>
            <span style={{color:T.muted,fontSize:12}}>{h.weight}%</span>
          </div>)}
        </div>;
      })}
      {/* Bonus habit */}
      <div style={{borderTop:`1px solid ${T.faint}`,paddingTop:14,marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <span style={{fontSize:14}}>⭐</span>
          <span style={{color:T.amber,fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>Habitude bonus</span>
          <span style={{color:T.faint,fontSize:11}}>— +5% si accomplie</span>
        </div>
        {!bonus&&!bonusForm&&<button onClick={()=>{setBonusDraft({id:uid(),catId:activeCats[0]?.id||"health",name:"",type:"boolean",targetType:"min",target:"1",unit:"",weight:5,isBonus:true});setBonusForm(true);}} style={{width:"100%",padding:12,background:"rgba(255,149,0,0.08)",border:`1.5px dashed ${T.amber}55`,borderRadius:12,color:T.amber,fontSize:13,cursor:"pointer",fontWeight:500}}>+ Définir une habitude bonus</button>}
        {bonusForm&&bonusDraft&&<div style={{background:"rgba(255,149,0,0.06)",border:`1px solid ${T.amber}44`,borderRadius:14,padding:14,display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Inp label="Nom" value={bonusDraft.name} placeholder="ex: Courir 10km" onChange={e=>setBonusDraft(p=>({...p,name:e.target.value}))}/>
            <Sel label="Catégorie" value={bonusDraft.catId} onChange={e=>setBonusDraft(p=>({...p,catId:e.target.value}))} options={bonusCatOptions}/>
          </div>
          <Sel label="Type" value={bonusDraft.type} onChange={e=>setBonusDraft(p=>({...p,type:e.target.value}))} options={HABIT_TYPES.map(t=>({value:t.id,label:t.label}))}/>
          {bonusDraft.type!=="boolean"&&<div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10}}>
            <Inp label="Objectif" type="number" value={bonusDraft.target} onChange={e=>setBonusDraft(p=>({...p,target:e.target.value}))}/>
            <Inp label="Unité" value={bonusDraft.unit} onChange={e=>setBonusDraft(p=>({...p,unit:e.target.value}))}/>
          </div>}
          <div style={{display:"flex",gap:8}}>
            <Btn variant="ghost" small onClick={()=>{setBonusForm(false);setBonusDraft(null);}}>Annuler</Btn>
            <Btn small full disabled={!bonusDraft.name.trim()} onClick={()=>{setBonus({...bonusDraft,weight:5,isBonus:true});setBonusForm(false);setBonusDraft(null);}} style={{background:T.amber,border:"none",color:"#fff"}}>Enregistrer le bonus</Btn>
          </div>
        </div>}
        {bonus&&!bonusForm&&<div style={{background:"rgba(255,149,0,0.1)",border:`1px solid ${T.amber}44`,borderRadius:12,padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{color:T.amber,fontSize:14,fontWeight:600}}>⭐ {bonus.name}</div><div style={{color:T.muted,fontSize:11,marginTop:2}}>{CATS.find(c=>c.id===bonus.catId)?.name} · {bonus.type} · +5%</div></div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>{setBonusDraft({...bonus});setBonusForm(true);}} style={{background:"none",border:`1px solid ${T.faint}`,color:T.muted,borderRadius:8,padding:"7px 12px",fontSize:12,cursor:"pointer"}}>Modifier</button>
            <button onClick={()=>setBonus(null)} style={{background:"none",border:"none",color:T.red,cursor:"pointer",fontSize:20,padding:"0 2px"}}>×</button>
          </div>
        </div>}
      </div>
      {allH.length===0&&<Notice color={T.amber}>Aucune habitude ajoutée. Reviens en arrière.</Notice>}
      <div style={{display:"flex",gap:10,marginTop:16}}>
        <Btn variant="secondary" onClick={()=>{setStep(1);setCatIdx(activeCats.length-1);}}>← Modifier</Btn>
        <Btn full disabled={allH.length===0||saving} onClick={launch}>{saving?"Lancement…":"Lancer le sprint"}</Btn>
      </div>
    </Scroll>
  );
}

// ── HABIT ROW (log) ──
function HabitRow({habit, value, onChange, isBonus=false}) {
  const isBool = habit.type==="boolean";
  const s = scoreOne(isBool?(value?1:0):value, habit);
  const hasVal = value!==undefined&&value!==null&&value!=="";
  const col = hasVal ? barColor(Math.round(s*100)) : "rgba(0,0,0,0.08)";
  return (
    <div style={{background:isBonus?"rgba(255,149,0,0.07)":T.card,borderRadius:14,boxShadow:SH,padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
      <div style={{width:4,height:36,borderRadius:2,background:isBonus?T.amber:col,flexShrink:0,transition:"background 0.3s"}}/>
      <div style={{flex:1}}>
        <div style={{color:isBonus?T.amber:T.text,fontSize:14,fontWeight:500}}>{isBonus?"⭐ ":""}{habit.name}</div>
        <div style={{color:T.muted,fontSize:11,marginTop:2}}>
          {habit.subCat&&`${habit.subCat} · `}
          {habit.type!=="boolean"&&`${habit.targetType==="min"?"≥":"≤"} ${habit.target}${habit.unit?` ${habit.unit}`:""} · `}
          {isBonus?"+5% bonus":`${habit.weight}%`}
          {hasVal&&<span style={{marginLeft:6,color:isBonus?T.amber:col,fontWeight:700}}>{Math.round(s*100)}%</span>}
        </div>
      </div>
      {isBool
        ?<button onClick={()=>onChange(!value)} style={{width:52,height:32,borderRadius:16,border:"none",cursor:"pointer",flexShrink:0,background:value?(isBonus?T.amber:T.green):"rgba(0,0,0,0.1)",transition:"background 0.2s",position:"relative"}}>
            <div style={{width:26,height:26,borderRadius:13,background:"#fff",position:"absolute",top:3,left:value?23:3,transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/>
          </button>
        :<input type="number" step={habit.type==="duration"?0.5:1} min={habit.type==="rating"?1:0} max={habit.type==="rating"?5:undefined} value={value??""} onChange={e=>onChange(e.target.value)} placeholder={habit.type==="rating"?"1–5":"0"} style={{...ISX,width:80,textAlign:"center",fontWeight:700,flexShrink:0,padding:"9px 6px"}}/>
      }
    </div>
  );
}

// ── HOME ──
function HomeView({sprint, weekLogs, quote, userId}) {
  const wk = weekNum(sprint.startDate);
  const logs = weekLogs[wk]||{};
  const {overall:wkScore, byCat:wkByCat, bonusScore} = calcScores(sprint.habits, logs);
  const [detailMode, setDetailMode] = useState("%");
  const [chartMode, setChartMode] = useState("bars");
  const [history, setHistory] = useState(null);
  const [insight, setInsight] = useState(null);
  const paused = sprint.pausedWeeks||[];

  useEffect(()=>{ sg(`sprint_history_${userId}`).then(h=>setHistory(h||[])); },[userId]);
  useEffect(()=>{ sg(`insight_${userId}_${sprint.id}_w${wk}`).then(d=>setInsight(d||null)); },[userId,sprint.id,wk]);

  // Sprint avg: completed weeks only
  const spAvg = sprintAvg(sprint.habits, weekLogs, Math.max(wk-1,0), paused);
  const spByCat = catAvgs(sprint.habits, weekLogs, Math.max(wk-1,0), paused);

  const prevSprint = history&&history.length>0 ? history[history.length-1] : null;
  const activeCats = CATS.filter(c=>sprint.habits.some(h=>h.catId===c.id&&!h.isBonus));
  const logged = sprint.habits.filter(h=>!h.isBonus).filter(h=>{
    const v=logs[h.id]; return v!==undefined&&v!==null&&v!=="";
  }).length;

  const now = new Date();
  const dow = now.getDay()===0?7:now.getDay();
  const weekPct = Math.round((dow/7)*100);
  const sprintPct = Math.round((wk/12)*100);

  // Pro-rata color + trend
  const proRataScore = weekPct > 5 ? Math.min(Math.round(wkScore/(weekPct/100)),100) : 100;
  const trendScore = weekPct > 5 ? Math.min(Math.round(wkScore/(weekPct/100)),100) : null;
  const wkColor = scoreColor(proRataScore);
  const spColor = scoreColor(spAvg);
  const sprintCompletedWeeks = wk > 1 ? wk-1 : 0;

  // Weakest category for tip
  const catScores = activeCats.map(c=>({id:c.id,score:wkByCat[c.id]??0})).filter(c=>c.score!==null);
  const weakest = catScores.length ? catScores.sort((a,b)=>a.score-b.score)[0] : null;
  const tip = weakest ? TIPS[weakest.id] : null;

  // 12-week bar/line data
  const weekData = Array.from({length:12},(_,i)=>{
    const w=i+1;
    if (paused.includes(w)) return {w,score:null,paused:true,logged:false};
    if (w>wk) return {w,score:null,paused:false,logged:false};
    const ll=weekLogs[w]||{};
    const hasLog=sprint.habits.filter(h=>!h.isBonus).some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!=="");
    if (!hasLog) return {w,score:null,paused:false,logged:false};
    return {w,score:calcScores(sprint.habits,ll).overall,paused:false,logged:true};
  });
  const chartH=76;
  const benchScore = prevSprint?prevSprint.avgScore:80;
  const benchLabel = prevSprint?`Q1-26 · ${benchScore}%`:"Objectif · 80%";
  const benchDashed = !prevSprint;

  // Line chart points
  const loggedWeeks = weekData.filter(d=>d.logged&&d.score!==null);

  return (
    <Scroll>
      {/* 21-day banner */}
      {history!==null&&history.length===0&&(
        <div style={{background:"rgba(0,122,255,0.08)",borderRadius:16,padding:"14px 16px",marginBottom:12,borderLeft:`3px solid ${T.accent}`}}>
          <div style={{fontSize:12,fontWeight:700,color:T.accent,marginBottom:4}}>🧠 Les 21 premiers jours sont décisifs</div>
          <p style={{fontSize:12,color:T.muted,lineHeight:1.6,margin:0}}>Les neurosciences montrent que les habitudes se câblent dans le cerveau pendant les 3 premières semaines. La discipline que tu construis maintenant se multiplie sur tout le sprint.</p>
        </div>
      )}

      {/* ── FEATURE 1: Three rings ── */}
      <Card style={{marginBottom:12,padding:"18px 20px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
          {[
            {label:"Cette semaine",score:wkScore,color:wkColor,size:72},
            {label:"Tendance",score:trendScore!==null?trendScore:wkScore,color:scoreColor(trendScore||wkScore),size:72},
            {label:"Moy. sprint",score:spAvg,color:spColor,size:72},
          ].map(({label,score,color,size})=>(
            <div key={label} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <Ring score={score} size={size} color={color}/>
              <span style={{fontSize:10,fontWeight:600,color:T.muted,textTransform:"uppercase",letterSpacing:0.5,textAlign:"center"}}>{label}</span>
            </div>
          ))}
        </div>
        {/* Progress bars below rings */}
        <div style={{marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:11,color:T.muted}}>Semaine {wk} · {["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"][dow-1]}</span>
            <span style={{fontSize:11,fontWeight:700,color:"#30d158"}}>{weekPct}%</span>
          </div>
          <div style={{height:6,background:"rgba(0,0,0,0.07)",borderRadius:3}}>
            <div style={{height:"100%",borderRadius:3,background:"#30d158",width:`${weekPct}%`,transition:"width 0.6s"}}/>
          </div>
        </div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:11,color:T.muted}}>Sprint · S{wk} sur 12</span>

          </div>
          <div style={{height:6,background:"rgba(0,0,0,0.07)",borderRadius:3,position:"relative"}}>

                    return (

                        <span style={{flex:1,color:T.text,fontSize:12}}>{h.name}</span>
                        <span style={{color:T.muted,fontSize:11}}>{hasVal?(h.type==="boolean"?(val?"✓":"✗"):`${val}${h.unit?` ${h.unit}`:""} / ${h.target}`):"—"}</span>
                        {hasVal&&<span style={{color:barColor(Math.round(s*100)),fontSize:11,fontWeight:700,minWidth:32,textAlign:"right"}}>{Math.round(s*100)}%</span>}
                      </div>
                    );
                  })}
                </Card>
              );
            })}
          </div>
      }

      {/* ── FEATURE 6: Weekly tip ── */}
      {tip&&(
        <Card style={{marginTop:12,padding:"16px",borderLeft:`3px solid ${T.green}`,borderRadius:"0 16px 16px 0"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{fontSize:20}}>{tip.emoji}</span>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:T.text}}>{tip.title}</div>
              <div style={{fontSize:10,color:T.muted}}>Focus de la semaine · {weakest&&CATS.find(c=>c.id===weakest.id)?.name}</div>
            </div>
          </div>
          <p style={{fontSize:12,color:T.muted,lineHeight:1.65,margin:0}}>{tip.tip}</p>
        </Card>
      )}

      {/* Quote */}
      <div style={{borderLeft:`3px solid ${T.accent}`,background:T.card,borderRadius:"0 14px 14px 0",padding:"14px 16px",boxShadow:SH,marginTop:12}}>
        <p style={{color:T.muted,fontSize:12,lineHeight:1.65,margin:"0 0 6px",fontStyle:"italic"}}>"{quote[0]}"</p>
        <span style={{color:T.accent,fontSize:10,fontWeight:600}}>— {quote[1]}</span>
      </div>
    </Scroll>
  );
}


// ── LOG ──
function LogView({sprint, weekLogs, onSave, userId, onUpdateSprint}) {
  const currentWk = weekNum(sprint.startDate);
  const [selWk, setSelWk] = useState(currentWk);
  const [local, setLocal] = useState(weekLogs[currentWk]||{});
  const [saved, setSaved] = useState(false);
  useEffect(()=>setLocal(weekLogs[selWk]||{}),[weekLogs,selWk]);
  const {overall, bonusScore} = calcScores(sprint.habits, local);
  const paused = sprint.pausedWeeks||[];
  const isPaused = paused.includes(selWk);

  async function togglePause() {
    const newPaused = isPaused?paused.filter(w=>w!==selWk):[...paused,selWk];
    const updated = {...sprint,pausedWeeks:newPaused};
    await ss(`sprint_${userId}`, updated);
    onUpdateSprint(updated);
  }

  async function save() {
    if (isPaused) return;
    await ss(`logs_${userId}_${sprint.id}_w${selWk}`, local);
    onSave(selWk, local);
    setSaved(true);
    setTimeout(()=>setSaved(false),2000);
    // Background: social update + AI insight
    sg(`user_${userId}`).then(u=>{
      const uname=u?.name||"User";
      const email=u?.email||"";
      const {overall:ov,byCat}=calcScores(sprint.habits,local);
      // Social update
      const wsk=`social_${sprint.id}_w${selWk}`;
      sg(wsk).then(we=>{
        ss(wsk,[...(we||[]).filter(e=>e.userId!==userId),{userId,name:uname,email,overall:ov,byCat}]);
      });
      const allSaved={...weekLogs,[selWk]:local};
      const entries=Object.entries(allSaved).map(([w,lg])=>{
        if(paused.includes(parseInt(w)))return null;
        const has=sprint.habits.some(h=>lg[h.id]!==undefined&&lg[h.id]!==null&&lg[h.id]!=="");
        const {overall:sc}=calcScores(sprint.habits,lg);
        return has?{w:parseInt(w),sc}:null;
      }).filter(Boolean);
      const spAvgVal=entries.length?Math.round(entries.reduce((a,e)=>a+e.sc,0)/entries.length):0;
      const ssk=`social_sprint_${sprint.id}`;
      sg(ssk).then(se=>{
        ss(ssk,[...(se||[]).filter(e=>e.userId!==userId),{userId,name:uname,email,sprintAvg:spAvgVal,weeksLogged:entries.length,weekScores:Object.fromEntries(entries.map(e=>[e.w,e.sc]))}]);
      });
      // AI insight generation
      generateInsight(userId, sprint.id, selWk, ov, byCat);
    });
  }

  async function generateInsight(userId, sprintId, week, score, byCat) {
    try {
      const catLines = CATS
        .filter(c=>byCat[c.id]!==null&&byCat[c.id]!==undefined)
        .map(c=>`${c.name}: ${byCat[c.id]}%`)
        .join(", ");
      const sorted = CATS.filter(c=>byCat[c.id]!==null).sort((a,b)=>(byCat[a.id]||0)-(byCat[b.id]||0));
      const weakCat = sorted[0]?.name||"";
      const strongCat = sorted[sorted.length-1]?.name||"";
      const prompt = `Tu es un coach de performance elite. L'utilisateur vient de terminer la semaine ${week} de son sprint Momentum.
Score global: ${score}%.
Scores par catégorie: ${catLines}.
Point fort: ${strongCat}. Point faible: ${weakCat}.
Génère un commentaire de coaching, 2 phrases maximum, en français, direct et motivant. Commence directement par le commentaire.`;
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:120,messages:[{role:"user",content:prompt}]})
      });
      const data = await res.json();
      const text = data.content?.[0]?.text||"";
      if (text) await ss(`insight_${userId}_${sprintId}_w${week}`,{text,week,score,createdAt:Date.now()});
    } catch(e) { console.warn("Insight failed:",e.message); }
  }

  const catGroups = CATS.map(c=>({...c,habits:sprint.habits.filter(h=>h.catId===c.id)})).filter(c=>c.habits.length>0);
  const regHabits = sprint.habits.filter(h=>!h.isBonus);

  return (
    <Scroll>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:800,color:T.text,margin:"0 0 2px"}}>Journal</h2>
          <p style={{color:T.muted,fontSize:13,margin:0}}>
            {isPaused?<span style={{color:T.amber,fontWeight:600}}>Semaine {selWk} — OFF</span>
              :<><strong style={{color:scoreColor(overall)}}>{overall}%</strong>{bonusScore>0&&<span style={{color:T.amber,marginLeft:6,fontSize:11}}>+{bonusScore}%</span>}{selWk!==currentWk&&<span style={{color:T.amber,marginLeft:8,fontSize:11}}>← passé</span>}</>
            }
          </p>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={togglePause} style={{background:isPaused?"rgba(255,149,0,0.12)":"transparent",border:`1px solid ${isPaused?T.amber:T.faint}`,color:isPaused?T.amber:T.muted,borderRadius:10,padding:"8px 12px",fontSize:12,cursor:"pointer",fontWeight:600,minHeight:36}}>
            {isPaused?"▶ Reprendre":"⏸ Jours off"}
          </button>
          {!isPaused&&<Btn onClick={save} variant={saved?"success":"primary"}>{saved?"Enregistré ✓":"Enregistrer"}</Btn>}
        </div>
      </div>
      {/* Week selector */}
      <div style={{display:"flex",gap:4,marginBottom:18,overflowX:"auto",paddingBottom:4}}>
        {Array.from({length:currentWk},(_,i)=>{
          const w=i+1;
          const ll=weekLogs[w]||{};
          const isOff=paused.includes(w);
          const hasLog=!isOff&&regHabits.some(h=>ll[h.id]!==undefined&&ll[h.id]!==null&&ll[h.id]!=="");
          const {overall:ws}=calcScores(sprint.habits,ll);
          const isSel=selWk===w;
          return <button key={w} onClick={()=>setSelWk(w)} style={{flexShrink:0,padding:"8px 10px",borderRadius:10,border:`1px solid ${isSel?(isOff?T.amber:T.accent):T.faint}`,background:isSel?(isOff?"rgba(255,149,0,0.1)":"rgba(0,122,255,0.1)"):"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,minWidth:44,minHeight:44,justifyContent:"center"}}>
            <span style={{fontSize:10,fontWeight:isSel?700:400,color:isSel?(isOff?T.amber:T.accent):T.muted}}>S{w}</span>
            {isOff?<span style={{fontSize:7,color:T.amber,fontWeight:700}}>OFF</span>:<div style={{width:6,height:6,borderRadius:3,background:hasLog?scoreColor(ws):"rgba(0,0,0,0.1)"}}/>}
          </button>;
        })}
      </div>
      {isPaused&&<Card style={{textAlign:"center",marginBottom:14,padding:"20px 16px"}}>
        <div style={{fontSize:28,marginBottom:8}}>🏖️</div>
        <p style={{color:T.amber,fontSize:14,fontWeight:600,margin:"0 0 4px"}}>Semaine marquée OFF</p>
        <p style={{color:T.muted,fontSize:12,margin:0}}>Congés ou maladie — cette semaine ne compte pas dans ta moyenne.</p>
      </Card>}
      {catGroups.map(cat=>{
        const reg=cat.habits.filter(h=>!h.isBonus);
        const bon=cat.habits.filter(h=>h.isBonus);
        return <div key={cat.id} style={{marginBottom:18,opacity:isPaused?0.4:1,transition:"opacity 0.2s"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><div style={{width:8,height:8,borderRadius:2,background:cat.color}}/><span style={{color:cat.color,fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{cat.name}</span></div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {reg.map(h=><HabitRow key={h.id} habit={h} value={local[h.id]} onChange={v=>setLocal(p=>({...p,[h.id]:v}))}/>)}
            {bon.map(h=><HabitRow key={h.id} habit={h} value={local[h.id]} onChange={v=>setLocal(p=>({...p,[h.id]:v}))} isBonus/>)}
          </div>
        </div>;
      })}
    </Scroll>
  );
}

// ── SPRINT TAB ──
function SprintTab({user, sprint, onSprintCreated, onHabitsUpdated, history=[]}) {
  const [reconfigure, setReconfigure] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  const [saving, setSaving] = useState(false);
  if (!sprint||reconfigure) return <SprintSetupView user={user} onDone={s=>{setReconfigure(false);onSprintCreated(s);}} isFirstSprint={!sprint&&history.length===0}/>;
  const wk = weekNum(sprint.startDate);
  async function saveEdit() {
    setSaving(true);
    const updated = sprint.habits.map(h=>h.id===editDraft.id?{...editDraft,weight:parseFloat(editDraft.weight)||0}:h);
    const sp={...sprint,habits:updated};
    await ss(`sprint_${user.id}`,sp);
    onHabitsUpdated(sp); setEditingId(null); setEditDraft(null); setSaving(false);
  }
  async function delHabit(id) {
    const sp={...sprint,habits:sprint.habits.filter(h=>h.id!==id)};
    await ss(`sprint_${user.id}`,sp); onHabitsUpdated(sp);
  }
  const catGroups=CATS.map(c=>({...c,habits:sprint.habits.filter(h=>h.catId===c.id),weight:(sprint.catWeights||{})[c.id]||0})).filter(c=>c.habits.length>0);
  return (
    <Scroll>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
        <h2 style={{fontSize:20,fontWeight:800,color:T.text,margin:0}}>Sprint en cours</h2>
        <Btn small variant="secondary" onClick={()=>setReconfigure(true)}>Nouveau sprint</Btn>
      </div>
      <p style={{color:T.muted,fontSize:13,margin:"4px 0 14px"}}>Semaine {wk} sur 12 · démarré le {fmtDate(sprint.startDate)}</p>
      <Notice color={T.accent}>Appuie sur Modifier pour mettre à jour une habitude.</Notice>
      {catGroups.map(cat=>{
        const reg=cat.habits.filter(h=>!h.isBonus);
        const bon=cat.habits.filter(h=>h.isBonus);
        const totW=reg.reduce((a,h)=>a+(parseFloat(h.weight)||0),0);
        return <Card key={cat.id} style={{marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <div style={{width:8,height:8,borderRadius:2,background:cat.color}}/>
            <span style={{color:cat.color,fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{cat.name}</span>
            <span style={{color:T.muted,fontSize:11,marginLeft:"auto"}}>{totW.toFixed(0)}% / {cat.weight}%</span>
          </div>
          {[...reg,...bon].map(h=>{
            const isBonus=h.isBonus;
            if (editingId===h.id&&editDraft) {
              const otherW=reg.filter(x=>x.id!==h.id).reduce((a,x)=>a+(parseFloat(x.weight)||0),0);
              return <div key={h.id} style={{marginTop:4}}><HabitForm habit={editDraft} cat={cat} remaining={(cat.weight||0)-otherW} onChange={setEditDraft} saveLabel={saving?"Patiente…":"Mettre à jour"} onSave={saveEdit} onCancel={()=>{setEditingId(null);setEditDraft(null);}}/></div>;
            }
            return <div key={h.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:isBonus?"rgba(255,149,0,0.07)":"rgba(0,0,0,0.03)",borderRadius:10,marginBottom:6}}>
              <div style={{flex:1}}>
                <div style={{color:isBonus?T.amber:T.text,fontSize:13,fontWeight:500}}>{isBonus?"⭐ ":""}{h.name}{h.subCat&&<span style={{color:T.muted,fontSize:11}}> · {h.subCat}</span>}</div>
                <div style={{color:T.muted,fontSize:11,marginTop:3}}>{h.type!=="boolean"&&`${h.targetType==="min"?"≥":"≤"} ${h.target}${h.unit?` ${h.unit}`:""} · `}<strong style={{color:isBonus?T.amber:cat.color}}>{isBonus?"+5% bonus":`${h.weight}%`}</strong></div>
              </div>
              <button onClick={()=>{setEditingId(h.id);setEditDraft({...h});}} style={{background:"none",border:`1px solid ${T.faint}`,color:T.muted,borderRadius:8,padding:"7px 12px",fontSize:12,cursor:"pointer",minHeight:36}}>Modifier</button>
              <button onClick={()=>delHabit(h.id)} style={{background:"none",border:"none",color:`${T.red}88`,fontSize:18,cursor:"pointer",padding:"0 2px"}}>×</button>
            </div>;
          })}
        </Card>;
      })}
    </Scroll>
  );
}

// ── SOCIAL ──
function SocialView({user, sprint}) {
  const [tab, setTab] = useState("week");
  const [spData, setSpData] = useState([]);
  const [wkData, setWkData] = useState([]);
  const [prevWkData, setPrevWkData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(null);
  const wk = weekNum(sprint.startDate);
  const activeCats = CATS.filter(c=>sprint.habits.some(h=>h.catId===c.id&&!h.isBonus));

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      const [sd,wd,pwd] = await Promise.all([
        sg(`social_sprint_${sprint.id}`),
        sg(`social_${sprint.id}_w${wk}`),
        wk>1?sg(`social_${sprint.id}_w${wk-1}`):Promise.resolve([]),
      ]);
      setSpData((sd||[]).sort((a,b)=>b.sprintAvg-a.sprintAvg));
      setWkData((wd||[]).sort((a,b)=>b.overall-a.overall));
      setPrevWkData(pwd||[]);
      setLoading(false);
    })();
  },[sprint,wk]);

  const entries = tab==="week"?wkData:spData;
  const top3 = entries.slice(0,3);

  function getStreak(entry) {
    if (!entry.weekScores) return 0;
    let streak=0;
    for (let w=wk;w>=1;w--) {
      const s=entry.weekScores[w];
      if (s===undefined||s===null) break;
      if (s>=75) streak++; else break;
    }
    return streak;
  }
  function getMovement(entry) {
    if (tab!=="week"||!prevWkData.length) return null;
    const prev=prevWkData.find(e=>e.userId===entry.userId);
    if (!prev) return null;
    return entry.overall-prev.overall;
  }

  return (
    <Scroll>
      <h2 style={{fontSize:20,fontWeight:800,color:T.text,margin:"0 0 2px"}}>Communauté</h2>
      <p style={{color:T.muted,fontSize:13,margin:"0 0 14px"}}>Semaine {wk} · {entries.length} participant{entries.length!==1?"s":""}</p>

      {/* Tab toggle */}
      <div style={{display:"flex",background:"rgba(0,0,0,0.06)",borderRadius:12,padding:3,marginBottom:16}}>
        {[["week","Cette semaine"],["sprint","Sprint"]].map(([t,l])=>(
          <button key={t} onClick={()=>{setTab(t);setExpanded(null);}} style={{flex:1,padding:"9px 0",border:"none",borderRadius:10,cursor:"pointer",background:tab===t?T.card:"transparent",color:tab===t?T.text:T.muted,fontSize:13,fontWeight:600,boxShadow:tab===t?SH:"none",transition:"all 0.2s"}}>{l}</button>
        ))}
      </div>

      {/* Invite */}
      <Card style={{marginBottom:16,padding:"13px 16px"}}>
        <p style={{color:T.muted,fontSize:11,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 6px",fontWeight:600}}>Inviter des amis</p>
        <p style={{color:T.text,fontSize:12,lineHeight:1.6,margin:0}}>Copie l'URL depuis ta <strong>barre d'adresse</strong> (commence par <span style={{color:T.accent}}>github.io/…</span>) et envoie-la. Ils créent un compte et apparaissent ici automatiquement.</p>
      </Card>

      {loading&&<div style={{textAlign:"center",padding:40,color:T.muted}}>Chargement…</div>}
      {!loading&&entries.length===0&&<div style={{textAlign:"center",padding:40}}><p style={{color:T.muted}}>Aucun score — saisis et enregistre pour apparaître ici.</p></div>}

      {/* Podium */}
      {!loading&&top3.length>=2&&<div style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:8,marginBottom:14,height:110}}>
          {[1,0,2].map(rank=>{
            const e=top3[rank]; if(!e) return <div key={rank} style={{flex:1}}/>;
            const heights=[68,50,38];
            const isFirst=rank===0;
            return <div key={rank} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:1}}>
              {isFirst&&<div style={{fontSize:18}}>🥇</div>}
              <Avatar name={e.name} userId={e.userId} email={e.email} size={isFirst?40:34}/>
              <span style={{fontSize:10,fontWeight:isFirst?700:500,color:T.text,maxWidth:64,textAlign:"center",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{e.name.split(" ")[0]}</span>
              <div style={{width:"100%",background:isFirst?T.accent:"rgba(0,0,0,0.06)",borderRadius:"8px 8px 0 0",height:heights[rank],display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span style={{fontSize:isFirst?16:13,fontWeight:800,color:isFirst?"#fff":T.muted}}>{tab==="week"?e.overall:e.sprintAvg}%</span>
              </div>
            </div>;
          })}
        </div>
      </div>}

      {/* Full list */}
      {!loading&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {entries.map((entry,i)=>{
          const score=tab==="week"?entry.overall:entry.sprintAvg;
          const isMe=entry.userId===user.id;
          const isExp=expanded===entry.userId;
          const streak=getStreak(entry);
          const mov=getMovement(entry);
          return (
            <div key={entry.userId} onClick={()=>setExpanded(isExp?null:entry.userId)} style={{background:isMe?"rgba(0,122,255,0.06)":T.card,borderRadius:16,border:isMe?`1.5px solid rgba(0,122,255,0.25)`:"none",boxShadow:SH,overflow:"hidden",cursor:"pointer"}}>
              <div style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}>
                <div style={{width:26,height:26,borderRadius:8,background:i<3?"rgba(0,122,255,0.1)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontSize:i<3?14:11,fontWeight:700,color:i===0?T.accent:i===1?T.muted:i===2?T.amber:T.faint}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span>
                </div>
                <Avatar name={entry.name} userId={entry.userId} email={entry.email} size={34}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    <span style={{fontSize:14,fontWeight:600,color:T.text}}>{entry.name}</span>
                    {isMe&&<span style={{fontSize:9,color:T.accent,background:"rgba(0,122,255,0.1)",padding:"2px 7px",borderRadius:10,fontWeight:700}}>toi</span>}
                    {streak>=3&&<span style={{fontSize:9,color:T.green,background:"rgba(48,209,88,0.1)",padding:"2px 7px",borderRadius:10,fontWeight:700}}>🔥 {streak} sem.</span>}
                  </div>
                  <div style={{fontSize:11,color:T.muted,marginTop:2}}>{tab==="sprint"?`${entry.weeksLogged||0} sem. saisies`:`S${wk}`}</div>
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}}>
                  <span style={{fontSize:22,fontWeight:800,color:scoreColor(score),letterSpacing:-1}}>{score}%</span>
                  {mov!==null&&<span style={{fontSize:10,fontWeight:600,color:mov>0?T.green:mov<0?T.red:T.muted}}>{mov>0?`↑ +${mov}pp`:mov<0?`↓ ${mov}pp`:"→"}</span>}
                </div>
                <div style={{color:T.muted,fontSize:14,transform:isExp?"rotate(180deg)":"rotate(0)",transition:"transform 0.2s",marginLeft:4}}>⌄</div>
              </div>
              {isExp&&<div style={{padding:"0 16px 14px",borderTop:`1px solid ${T.border}`}}>
                <div style={{paddingTop:10,display:"flex",flexDirection:"column",gap:8}}>
                  <div style={{fontSize:9,fontWeight:600,letterSpacing:1.2,textTransform:"uppercase",color:T.muted}}>Score par catégorie · objectifs privés</div>
                  {activeCats.map(cat=>{
                    const catScore=tab==="week"?entry.byCat?.[cat.id]:null;
                    const catW=(sprint.catWeights||{})[cat.id]||0;
                    if (catScore===null||catScore===undefined) return null;
                    return <div key={cat.id}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                        <div style={{width:6,height:6,borderRadius:3,background:cat.color,flexShrink:0}}/>
                        <span style={{fontSize:12,color:T.text,fontWeight:500,flex:1}}>{cat.name}</span>
                        <span style={{fontSize:10,color:T.muted}}>{catW}%</span>

                      </div>

                    <div style={{fontSize:9,fontWeight:600,letterSpacing:1.2,textTransform:"uppercase",color:T.muted,marginBottom:6}}>Progression</div>
                    <div style={{display:"flex",alignItems:"flex-end",gap:3,height:36}}>
                      {Array.from({length:wk},(_,i)=>{
                        const sc=entry.weekScores[i+1];
                        return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                          <div style={{width:"100%",height:sc!==undefined?`${Math.max((sc/100)*28,2)}px`:"2px",background:sc!==undefined?barColor(sc):"rgba(0,0,0,0.06)",borderRadius:"2px 2px 0 0",minHeight:2}}/>
                          <span style={{fontSize:6.5,color:T.muted}}>S{i+1}</span>
                        </div>;
                      })}
                    </div>
                  </div>}
                </div>
              </div>}

          );
        })}

}

// ── DUELS ──
function DuelsView({user, sprint}) {
  const [myDuels, setMyDuels] = useState([]);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [creating, setCreating] = useState(false);
  const [form, setForm] = useState({opponentId:"",type:"overall",catId:"health"});
  const [msg, setMsg] = useState(null);
  const wk = weekNum(sprint.startDate);
  const activeCats = CATS.filter(c=>sprint.habits.some(h=>h.catId===c.id&&!h.isBonus));

  async function load() {
    setLoading(true);
    const [idx,duelsData] = await Promise.all([sg("userIndex"),sg(`duels_${sprint.id}`)]);
    setUsers((idx||[]).filter(u=>u.id!==user.id));
    const all=duelsData||[];
    setMyDuels(all.filter(d=>d.challengerId===user.id||d.opponentId===user.id));
    setLoading(false);
  }
  useEffect(()=>{load();},[sprint]);

  async function createDuel() {
    if (!form.opponentId) return;
    const newDuel={id:uid(),challengerId:user.id,challengerName:user.name,opponentId:form.opponentId,opponentName:users.find(u=>u.id===form.opponentId)?.name||"",type:form.type,catId:form.type==="category"?form.catId:null,week:wk,status:"pending",createdAt:Date.now()};
    const all=await sg(`duels_${sprint.id}`)||[];
    await ss(`duels_${sprint.id}`,[...all,newDuel]);
    setCreating(false); setMsg("Défi envoyé ! 🔥"); setTimeout(()=>setMsg(null),3000); load();
  }
  async function respond(duelId, accept) {
    const all=await sg(`duels_${sprint.id}`)||[];
    await ss(`duels_${sprint.id}`,all.map(d=>d.id===duelId?{...d,status:accept?"active":"declined"}:d));
    setMsg(accept?"Défi accepté ! C'est parti 🔥":"Défi refusé."); setTimeout(()=>setMsg(null),3000); load();
  }

  const pending=myDuels.filter(d=>d.status==="pending"&&d.opponentId===user.id);
  const active=myDuels.filter(d=>d.status==="active"&&d.week===wk);

  function DuelCard({duel}) {
    const isChallenger=duel.challengerId===user.id;
    const opponent=isChallenger?duel.opponentName:duel.challengerName;
    const cat=duel.catId?CATS.find(c=>c.id===duel.catId):null;
    return (
      <Card style={{marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{fontSize:20}}>{duel.type==="category"?"🎯":"⚔️"}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,color:T.text}}>{isChallenger?"Tu as défié":"Défi reçu de"} <span style={{color:T.accent}}>{opponent}</span></div>
            <div style={{fontSize:11,color:T.muted,marginTop:2}}>{duel.type==="category"?`Catégorie : ${cat?.name||duel.catId}`:"Score global"} · Semaine {duel.week}</div>
          </div>
        </div>
        {duel.status==="active"&&<div style={{background:"rgba(0,122,255,0.07)",borderRadius:10,padding:"9px 12px"}}><span style={{fontSize:12,color:T.accent}}>⚡ En cours — résultat à la fin de la semaine</span></div>}
        {duel.status==="pending"&&duel.opponentId===user.id&&<div style={{display:"flex",gap:8,marginTop:4}}>
          <button onClick={()=>respond(duel.id,false)} style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:"rgba(255,59,48,0.1)",color:T.red,fontWeight:600,fontSize:13,cursor:"pointer"}}>Refuser</button>
          <button onClick={()=>respond(duel.id,true)} style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:T.accent,color:"#fff",fontWeight:600,fontSize:13,cursor:"pointer"}}>Accepter 🔥</button>
        </div>}
        {duel.status==="pending"&&duel.challengerId===user.id&&<div style={{background:"rgba(0,0,0,0.04)",borderRadius:10,padding:"9px 12px"}}><span style={{fontSize:12,color:T.muted}}>⏳ En attente d'acceptation…</span></div>}
        {duel.status==="declined"&&<div style={{background:"rgba(255,59,48,0.07)",borderRadius:10,padding:"9px 12px"}}><span style={{fontSize:12,color:T.red}}>Défi refusé</span></div>}
      </Card>
    );
  }

  return (
    <Scroll>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div><h2 style={{fontSize:20,fontWeight:800,color:T.text,margin:"0 0 2px"}}>Duels</h2><p style={{color:T.muted,fontSize:13,margin:0}}>Défie tes amis cette semaine</p></div>
        {!creating&&<button onClick={()=>setCreating(true)} style={{background:T.accent,color:"#fff",border:"none",borderRadius:12,padding:"9px 16px",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Nouveau défi</button>}
      </div>
      {msg&&<Notice color={T.green}>{msg}</Notice>}
      {creating&&<Card style={{marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,color:T.text,marginBottom:14}}>Nouveau défi</div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Sel label="Adversaire" value={form.opponentId} onChange={e=>setForm(p=>({...p,opponentId:e.target.value}))} options={[{value:"",label:"Choisir…"},...users.map(u=>({value:u.id,label:u.name}))]}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[["overall","⚔️ Score global"],["category","🎯 Catégorie"]].map(([t,l])=>(
              <button key={t} onClick={()=>setForm(p=>({...p,type:t}))} style={{padding:"11px 8px",border:"none",borderRadius:12,cursor:"pointer",background:form.type===t?T.accent:"rgba(0,0,0,0.05)",color:form.type===t?"#fff":T.text,fontWeight:600,fontSize:13}}>{l}</button>
            ))}
          </div>
          {form.type==="category"&&<div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {activeCats.map(cat=><button key={cat.id} onClick={()=>setForm(p=>({...p,catId:cat.id}))} style={{padding:"7px 12px",border:"none",borderRadius:10,cursor:"pointer",background:form.catId===cat.id?cat.color:"rgba(0,0,0,0.05)",color:form.catId===cat.id?"#fff":T.text,fontWeight:600,fontSize:12}}>{cat.name}</button>)}
          </div>}
          <div style={{display:"flex",gap:8}}>
            <Btn variant="secondary" small onClick={()=>setCreating(false)}>Annuler</Btn>
            <Btn full small disabled={!form.opponentId} onClick={createDuel}>Envoyer le défi 🔥</Btn>
          </div>
        </div>
      </Card>}
      {pending.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:9,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:T.red,marginBottom:8}}>🔔 {pending.length} défi{pending.length>1?"s":""} en attente</div>{pending.map(d=><DuelCard key={d.id} duel={d}/>)}</div>}
      {active.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:9,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:T.accent,marginBottom:8}}>⚔️ En cours — semaine {wk}</div>{active.map(d=><DuelCard key={d.id} duel={d}/>)}</div>}
      {!loading&&myDuels.length===0&&!creating&&<div style={{textAlign:"center",padding:"40px 20px"}}>
        <div style={{fontSize:40,marginBottom:10}}>⚔️</div>
        <p style={{color:T.text,fontSize:15,fontWeight:600,marginBottom:4}}>Aucun défi en cours</p>
        <p style={{color:T.muted,fontSize:13}}>Lance le premier défi de la semaine !</p>
      </div>}
    </Scroll>
  );
}

// ── PROFILE ──
function ProfileView({user, sprint, weekLogs, onLogout}) {
  const [history, setHistory] = useState([]);
  useEffect(()=>{ sg(`sprint_history_${user.id}`).then(h=>setHistory((h||[]).slice().reverse())); },[user.id]);
  const wk=sprint?weekNum(sprint.startDate):0;
  const {overall}=sprint?calcScores(sprint.habits,weekLogs[wk]||{}):{overall:0};
  const allAvgs=history.map(s=>s.avgScore).filter(Boolean);
  const lifetimeAvg=allAvgs.length?Math.round(allAvgs.reduce((a,b)=>a+b,0)/allAvgs.length):null;
  return (
    <Scroll>
      <Card style={{textAlign:"center",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:14}}><Avatar name={user.name} userId={user.id} email={user.email} size={72}/></div>

        <p style={{color:T.muted,fontSize:13,margin:0}}>{user.email}</p>
        <p style={{color:T.faint,fontSize:12,marginTop:6}}>Membre depuis {new Date(user.createdAt).toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</p>
      </Card>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
        {[{l:"Sprints",v:history.length},{l:"Moy. globale",v:lifetimeAvg!==null?`${lifetimeAvg}%`:"—"},{l:"Sem. saisies",v:history.reduce((a,s)=>a+(s.weeksLogged||0),0)}].map(({l,v})=>(
          <Card key={l} style={{textAlign:"center",padding:"12px 8px"}}>
            <div style={{color:T.muted,fontSize:9,textTransform:"uppercase",letterSpacing:0.5,marginBottom:5}}>{l}</div>
            <div style={{color:T.text,fontSize:20,fontWeight:800}}>{v}</div>
          </Card>
        ))}
      </div>
      {sprint&&<Card style={{marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}><Ring score={overall} size={60}/><div><div style={{color:T.text,fontSize:14,fontWeight:600}}>Semaine {wk} sur 12</div><div style={{color:T.muted,fontSize:12,marginTop:4}}>Démarré le {fmtDate(sprint.startDate)}</div></div></div>
      </Card>}
      {history.length>0&&<Card style={{marginBottom:14}}>
        <p style={{color:T.muted,fontSize:11,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 12px",fontWeight:600}}>Historique des sprints</p>
        {history.map((sp,i)=>(
          <div key={sp.sprintId} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderTop:i>0?`1px solid ${T.border}`:"none"}}>
            <div style={{flex:1}}><div style={{color:T.text,fontSize:13,fontWeight:500}}>Sprint {history.length-i}</div><div style={{color:T.muted,fontSize:11,marginTop:2}}>{fmtDate(sp.startDate)} · {sp.weeksLogged} sem.</div></div>
            <div style={{fontSize:16,fontWeight:800,color:scoreColor(sp.avgScore)}}>{sp.avgScore}%</div>
          </div>
        ))}
      </Card>}
      <Btn full variant="danger" onClick={onLogout}>Se déconnecter</Btn>
    </Scroll>
  );
}

function AdminView({currentUser, onHistoryUpdated}) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(null);
  const [details, setDetails] = useState({});
  const [msg, setMsg] = useState(null);
  const [newPwds, setNewPwds] = useState({});
  const [importing, setImporting] = useState(false);

  useEffect(()=>{ (async()=>{setLoading(true);const idx=await sg("userIndex");setUsers(idx||[]);setLoading(false);})(); },[]);

  async function loadDetails(uid) {
    if (details[uid]) return setExpanded(expanded===uid?null:uid);
    const [u,sp,hist]=await Promise.all([sg(`user_${uid}`),sg(`sprint_${uid}`),sg(`sprint_history_${uid}`)]);
    const wk=sp?weekNum(sp.startDate):0; let cs=null;
    if (sp) { const logs=await sg(`logs_${uid}_${sp.id}_w${wk}`)||{}; const {overall}=calcScores(sp.habits,logs); cs=overall; }
    setDetails(p=>({...p,[uid]:{user:u,sprint:sp,history:hist||[],wk,cs}})); setExpanded(expanded===uid?null:uid);
  }
  async function resetPwd(uid,pwd) {
    const u=await sg(`user_${uid}`); if(!u) return;
    await ss(`user_${uid}`,{...u,passwordHash:hashStr(pwd)});
    setMsg(`Mot de passe réinitialisé pour ${u.name}`); setTimeout(()=>setMsg(null),3000); setNewPwds(p=>({...p,[uid]:""}));
  }
  async function clearSprint(uid) {
    await ss(`sprint_${uid}`,null);
    setDetails(p=>({...p,[uid]:{...p[uid],sprint:null,cs:null,wk:0}}));
    setMsg("Sprint effacé."); setTimeout(()=>setMsg(null),3000);
  }
  async function importSprint() {
    setImporting(true);
    const existing=await sg(`sprint_${currentUser.id}`);
    if (existing) { setMsg("Un sprint existe déjà — efface-le d'abord si tu veux réimporter."); setImporting(false); setTimeout(()=>setMsg(null),4000); return; }

      habits:[
        {id:"s1",catId:"health",subCat:"Sport",name:"Séances de sport",type:"numeric",targetType:"min",target:"4",unit:"séances",weight:20},
        {id:"s2",catId:"health",subCat:"Nutrition",name:"Verres d'alcool",type:"numeric",targetType:"max",target:"3",unit:"verres",weight:10},
        {id:"s3",catId:"growth",name:"Russe",type:"duration",targetType:"min",target:"1.5",unit:"hrs",weight:5},
        {id:"s4",catId:"growth",name:"Data learning and practice",type:"duration",targetType:"min",target:"4",unit:"hrs",weight:30},
        {id:"s5",catId:"career",name:"Heures de travail",type:"duration",targetType:"min",target:"55",unit:"hrs",weight:5},
        {id:"s6",catId:"career",name:"Impact livré",type:"boolean",targetType:"min",target:"1",unit:"",weight:10},
        {id:"s7",catId:"finance",name:"Épargne & investissement",type:"numeric",targetType:"min",target:"350",unit:"€",weight:5},
        {id:"s8",catId:"social",name:"Temps de qualité (partenaire)",type:"numeric",targetType:"min",target:"1",unit:"moments",weight:10},
        {id:"s9",catId:"fun",name:"Heures de loisirs",type:"duration",targetType:"min",target:"4",unit:"hrs",weight:5},
        {id:"s10",catId:"health",name:"Habitude bonus",type:"boolean",targetType:"min",target:"1",unit:"",weight:5,isBonus:true},
      ]
    };
    await ss(`sprint_${currentUser.id}`,sprint);
    setMsg("Sprint importé ! Démarré le 30 mars 2026."); setImporting(false); setTimeout(()=>setMsg(null),5000);
    if (onHistoryUpdated) onHistoryUpdated(currentUser.id);
  }
  async function importHistory() {
    setImporting(true);
    const existing=await sg(`sprint_history_${currentUser.id}`)||[];
    const existingIds=new Set(existing.map(s=>s.sprintId));
    const toAdd=HIST_DATA.filter(s=>!existingIds.has(s.sprintId));

        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
          {[{l:"Q3-25",v:"80%",wk:12},{l:"Q4-25",v:"79%",wk:11},{l:"Q1-26",v:"73%",wk:13}].map(({l,v,wk})=>(
            <div key={l} style={{background:"rgba(0,0,0,0.04)",borderRadius:10,padding:"10px",textAlign:"center"}}>
              <div style={{color:T.muted,fontSize:9,textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}}>{l}</div>
              <div style={{color:T.green,fontSize:16,fontWeight:800}}>{v}</div>
              <div style={{color:T.faint,fontSize:10}}>{wk} sem.</div>
            </div>

      </Card>}

      {/* User list */}
      <Card style={{overflow:"hidden",padding:0}}>
        {loading&&<div style={{padding:20,textAlign:"center",color:T.muted}}>Chargement…</div>}
