            </div>}
          </div>;
        })}
      </Card>
    </Scroll>
  );
}

// ── RECAP ──
function RecapView({user, sprint, weekLogs, onArchive}) {
  const [archiving, setArchiving] = useState(false);
  const wk = weekNum(sprint.startDate);
  const weekScores = Array.from({length:12},(_,i)=>{
    const w=i+1; const logs=weekLogs[w]||{};
    const logged=sprint.habits.some(h=>logs[h.id]!==undefined&&logs[h.id]!==null&&logs[h.id]!=="");
    const {overall}=calcScores(sprint.habits,logs);
    return {w,overall:logged?overall:null,logged};
  });
  const lw = weekScores.filter(w=>w.logged);
  const avg = lw.length?Math.round(lw.reduce((a,w)=>a+w.overall,0)/lw.length):0;
  const ca = catAvgs(sprint.habits,weekLogs,wk,[]);

  async function doArchive() {
    setArchiving(true);
    const record={sprintId:sprint.id,startDate:sprint.startDate,endDate:new Date().toISOString().split("T")[0],avgScore:avg,weeksLogged:lw.length,catAvgs:ca,weekScores:weekScores.map(w=>({w:w.w,score:w.overall}))};
    const hist=await sg(`sprint_history_${user.id}`)||[];
    await ss(`sprint_history_${user.id}`,[...hist,record]);
    await ss(`sprint_${user.id}`,null);
    setArchiving(false); onArchive();
  }

  return (
    <Scroll>
      <div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:40,marginBottom:8}}>🏁</div><h2 style={{color:T.text,fontSize:24,fontWeight:800,margin:0}}>Sprint terminé !</h2></div>
      <Card style={{marginBottom:14,display:"flex",flexDirection:"column",alignItems:"center",gap:14,padding:"24px 20px"}}>
        <Ring score={avg} size={110}/>
        <div style={{textAlign:"center"}}><div style={{color:T.text,fontSize:18,fontWeight:800}}>{avg>=80?"Excellent sprint":avg>=60?"Bel effort":"Peut mieux faire"}</div><div style={{color:T.muted,fontSize:13,marginTop:4}}>{lw.length} / 12 semaines · moy. {avg}%</div></div>
      </Card>
      <Btn full disabled={archiving} onClick={doArchive}>{archiving?"Archivage…":"Archiver et démarrer un nouveau sprint →"}</Btn>
    </Scroll>
  );
}

// ── APP ──
function App() {
  const [user, setUser] = useState(null);
  const [sprint, setSprint] = useState(null);
  const [weekLogs, setWL] = useState({});
  const [view, setView] = useState("home");
  const [booting, setBooting] = useState(true);
  const [showOnboarding, setShowOnboarding] = useState(false);
  const [showRecap, setShowRecap] = useState(false);
  const [history, setHistory] = useState([]);
  const [quote] = useState(WISDOM[new Date().getDay()%WISDOM.length]);
  const wk = sprint?weekNum(sprint.startDate):0;
  const isAdmin = user&&ADMIN_EMAILS.includes(user.email);
  const NAV_ICONS = {
    home: <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="currentColor" opacity="0.9"/></svg>,
    log:  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" strokeWidth="2"/><path d="M8 12h8M8 8h8M8 16h5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
    sprint:<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2"/><path d="M12 7v5l3 3" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>,
    social:<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" strokeWidth="2"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>,
    duels:<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5zm-5 0c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5zM8 15h8M6 19h12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>,
    profile:<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" strokeWidth="2"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>,
    admin:<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z" fill="currentColor" opacity="0.8"/></svg>,
  };
  const NAV = [
    {id:"home",label:"Accueil"},{id:"log",label:"Journal"},{id:"sprint",label:"Sprint"},
    {id:"social",label:"Social"},{id:"duels",label:"Duels"},{id:"profile",label:"Profil"},
    ...(isAdmin?[{id:"admin",label:"Admin"}]:[])
  ];

  async function loadHistory(userId) { const h=await sg(`sprint_history_${userId}`); setHistory(h||[]); }
  async function loadLogs(userId, sp) {
    const out={};
    for (let w=1;w<=weekNum(sp.startDate);w++) { const d=await sg(`logs_${userId}_${sp.id}_w${w}`); if(d) out[w]=d; }
    setWL(out);
  }

  useEffect(()=>{
    (async()=>{
      const session=await sg("session"); if(!session?.userId){setBooting(false);return;}
      const u=await sg(`user_${session.userId}`); if(!u){setBooting(false);return;}
      setUser(u); await loadHistory(u.id);
      const sp=await sg(`sprint_${u.id}`);
      if(sp){setSprint(sp);await loadLogs(u.id,sp);}
      setBooting(false);
    })();
  },[]);

  useEffect(()=>{if(sprint&&weekNum(sprint.startDate)>=12)setShowRecap(true);},[sprint]);

  async function onAuth(u) {
    await ss("session",{userId:u.id});
    if(u.isNew){const updated={...u,isNew:false};await ss(`user_${u.id}`,updated);setUser(updated);setShowOnboarding(true);return;}
    setUser(u); await loadHistory(u.id);
    const sp=await sg(`sprint_${u.id}`);
    if(sp){setSprint(sp);await loadLogs(u.id,sp);}
  }
  async function onLogout() {
    await ss("session",null); setUser(null); setSprint(null); setWL({}); setHistory([]);
    setView("home"); setShowOnboarding(false); setShowRecap(false);
  }
  function onSprintCreated(sp){setSprint(sp);setWL({});setView("home");setShowRecap(false);}
  function onSaveLogs(w,logs){setWL(p=>({...p,[w]:logs}));}
  async function onArchive(){setSprint(null);setWL({});setShowRecap(false);setView("sprint");if(user)await loadHistory(user.id);}

  if(booting) return <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:T.muted}}>Chargement…</span></div>;
  if(!user) return <AuthView onAuth={onAuth}/>;
  if(showOnboarding) return <OnboardingView name={user.name} onDone={()=>{setShowOnboarding(false);setView("sprint");}}/>;
  if(showRecap&&sprint) return (
    <div style={{minHeight:"100vh",background:T.bg}}>
      <div style={{background:"rgba(242,242,247,0.92)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderBottom:"1px solid rgba(0,0,0,0.1)",padding:"11px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}><div style={{width:28,height:28,borderRadius:8,background:T.text,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#fff"}}>M</div><span style={{fontWeight:800,fontSize:15}}>Momentum</span></div>
        <span style={{color:T.amber,fontSize:12,fontWeight:600}}>Sprint terminé</span>
      </div>
      <RecapView user={user} sprint={sprint} weekLogs={weekLogs} onArchive={onArchive}/>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
      {/* Top bar */}
      <div style={{background:"rgba(242,242,247,0.92)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderBottom:"1px solid rgba(0,0,0,0.1)",padding:"11px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:28,height:28,borderRadius:8,background:T.text,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#fff"}}>M</div>
          <span style={{fontWeight:800,fontSize:15}}>Momentum</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {sprint&&<span style={{color:T.muted,fontSize:11}}>S{wk}/12</span>}
          {isAdmin&&<span style={{fontSize:9,color:T.amber,background:"rgba(255,149,0,0.15)",padding:"2px 7px",borderRadius:4,fontWeight:700}}>ADMIN</span>}
          <Avatar name={user.name} userId={user.id} email={user.email} size={28}/>
        </div>
      </div>

      {/* No sprint banner */}
      {!sprint&&view!=="sprint"&&<div style={{background:"rgba(0,122,255,0.08)",borderBottom:"1px solid rgba(0,122,255,0.15)",padding:"10px 20px",textAlign:"center"}}>
        <span style={{color:T.text,fontSize:13}}>Aucun sprint actif.{" "}<button onClick={()=>setView("sprint")} style={{background:"none",border:"none",color:T.accent,fontWeight:700,fontSize:13,cursor:"pointer",padding:0}}>En créer un →</button></span>
      </div>}

      {/* Views */}
      <div style={{paddingTop:4}}>
        {view==="home"&&(sprint?<HomeView sprint={sprint} weekLogs={weekLogs} quote={quote} userId={user.id}/>:<div style={{textAlign:"center",padding:64}}><p style={{color:T.muted,fontSize:15,marginBottom:20}}>Configure un sprint pour commencer.</p><Btn onClick={()=>setView("sprint")}>Configurer un sprint →</Btn></div>)}
        {view==="log"&&(sprint?<LogView sprint={sprint} weekLogs={weekLogs} onSave={onSaveLogs} userId={user.id} onUpdateSprint={sp=>setSprint(sp)}/>:<div style={{textAlign:"center",padding:64,color:T.muted}}>Configure d'abord un sprint.</div>)}
        {view==="sprint"&&<SprintTab user={user} sprint={sprint} onSprintCreated={onSprintCreated} onHabitsUpdated={sp=>setSprint(sp)} history={history}/>}
        {view==="social"&&(sprint?<SocialView user={user} sprint={sprint}/>:<div style={{textAlign:"center",padding:64,color:T.muted}}>Configure d'abord un sprint.</div>)}
        {view==="duels"&&(sprint?<DuelsView user={user} sprint={sprint}/>:<div style={{textAlign:"center",padding:64,color:T.muted}}>Configure d'abord un sprint.</div>)}
        {view==="profile"&&<ProfileView user={user} sprint={sprint} weekLogs={weekLogs} onLogout={onLogout}/>}
        {view==="admin"&&isAdmin&&<AdminView currentUser={user} onHistoryUpdated={loadHistory}/>}
      </div>

      {/* Nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(242,242,247,0.92)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderTop:"1px solid rgba(0,0,0,0.1)",display:"flex",paddingBottom:"env(safe-area-inset-bottom,8px)",zIndex:100}}>
        {NAV.map(item=>(
          <button key={item.id} onClick={()=>setView(item.id)} style={{flex:1,background:"none",border:"none",cursor:"pointer",padding:"8px 4px 10px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,minHeight:56}}>
            <span style={{color:view===item.id?(item.id==="admin"?T.amber:T.accent):T.muted,transition:"color 0.2s"}}>{NAV_ICONS[item.id]}</span>
            <span style={{fontSize:10,fontWeight:view===item.id?700:500,color:view===item.id?(item.id==="admin"?T.amber:T.text):T.muted,transition:"color 0.2s",letterSpacing:-0.1}}>{item.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
